<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#F5F4F0;color:#0B2545;min-height:100vh}
/* Paleta de marca Research Assessor: azul marino (texto), azul hoja (acción), dorado (acento) */
:root{
  --navy:#0B2545;--brand:#0F4C81;--brand-dk:#0B3A63;--brand-lt:#E7EEF6;
  --gold:#B8894A;--gold-dk:#8E6630;--gold-lt:#F5EBDC;--gold-grad:linear-gradient(135deg,#E6C38E 0%,#C99A5B 55%,#A9793D 100%);
  --green:#0e9f6e;--green-bg:#f0fdf4;
  --amber:#d97706;--amber-bg:#fffbeb;
  --red:#e02424;--red-bg:#fef2f2;
  --violet:#8E6630;--violet-bg:#F5EBDC;
  --surface:#fff;--bg:#F5F4F0;--border:#E6E3DC;
  --text:#0B2545;--text2:#4A5568;--text3:#8C94A3;
  --r:12px;--rs:8px;--shadow:0 1px 3px rgba(11,37,69,.06),0 4px 16px rgba(11,37,69,.04)
}

/* ── LOGIN ── */
.lw{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 110% -10%,rgba(201,154,91,.18),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(15,76,129,.14),transparent 60%),#F5F4F0;padding:20px}
.l-brand{display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.l-brand img{width:260px;max-width:78vw;height:auto;display:block}
.l-sub{font-size:13px;color:var(--text3);margin-top:4px;text-align:center;letter-spacing:.3px}
.lb{background:#fff;border-radius:20px;padding:36px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(11,37,69,.10),0 1px 4px rgba(0,0,0,.05);position:relative;overflow:hidden}
.lb::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--gold-grad)}
.lb-title{font-size:22px;font-weight:800;color:var(--text);margin-bottom:4px}
.lb-sub{font-size:13px;color:var(--text3);margin-bottom:28px}
.lf-group{margin-bottom:16px}
.lf-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block;letter-spacing:.3px}
.lf-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--rs);font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;transition:all .15s}
.lf-input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(15,76,129,.1)}
.l-btn{width:100%;padding:13px;border-radius:var(--rs);border:none;cursor:pointer;font-size:15px;font-weight:700;font-family:inherit;background:var(--brand);color:#fff;margin-top:8px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.l-btn:hover{background:var(--brand-dk);transform:translateY(-1px);box-shadow:0 4px 16px rgba(15,76,129,.3)}
.l-err{background:var(--red-bg);border:1px solid #fecaca;border-radius:var(--rs);padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:14px;display:none}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh}
aside{width:230px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.a-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.a-logo img{width:170px;height:auto;display:block}
nav{padding:10px 8px;flex:1}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:2px;border:none;background:none;width:100%;text-align:left;transition:all .12s;position:relative}
.ni:hover{background:#F1F5FA;color:var(--brand)}
.ni.on{background:var(--brand-lt);color:var(--navy);font-weight:700}
.ni.on::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--gold-grad)}
.ni-new{margin-left:auto;background:var(--gold-lt);color:var(--gold-dk);font-size:9px;font-weight:800;padding:1px 6px;border-radius:20px;letter-spacing:.4px}
.ni .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px}
.n-section{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.8px;padding:12px 12px 4px;text-transform:uppercase}
.a-foot{padding:14px;border-top:1px solid var(--border)}
.a-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:#F8F7F3;margin-bottom:8px}
.a-avatar{width:32px;height:32px;border-radius:8px;background:var(--navy);color:#F5EBDC;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.a-uname{font-size:12px;font-weight:700;color:var(--text)}
.a-urole{font-size:11px;color:var(--text3)}
main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}

.kpi-value{font-size:28px;font-weight:800;line-height:1;color:var(--text)}
.kpi-sub{font-size:12px;color:var(--text3);margin-top:4px}
.kpi-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:28px;opacity:.15}
.kpi-bar{height:3px;border-radius:100px;margin-top:10px;background:#f1f5f9;overflow:hidden}
.kpi-bar-f{height:100%;border-radius:100px;transition:width .5s ease}

.card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
.card-hd{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f8fafc}
.card-hd h3{font-size:13px;font-weight:700;color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 16px;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #f1f5f9;background:#FAFAF7}
td{padding:11px 16px;border-bottom:1px solid #f8fafc;vertical-align:middle;color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAF7}
.empty{text-align:center;padding:36px;color:var(--text3);font-size:13px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--rs);border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:all .12s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--brand);color:#fff}.btn-p:hover{background:var(--brand-dk)}
.btn-green{background:var(--green);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn-g{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-g:hover{background:#F1F5FA;color:var(--brand)}
.btn-r{background:var(--red-bg);color:var(--red);border:1px solid #fecaca}
.btn-wa{background:#dcfce7;color:#16a34a;border:1px solid #bbf7d0}
.btn-amber{background:var(--amber-bg);color:var(--amber);border:1px solid #fde68a}

/* ── BADGES ── */
.b{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.bg{background:#dcfce7;color:#15803d}.bb{background:#E3ECF6;color:#0F4C81}
.ba{background:#fef3c7;color:#b45309}.br{background:#fee2e2;color:#dc2626}
.bx{background:#f1f5f9;color:#475569}.bv{background:var(--violet-bg);color:var(--violet)}

/* ── MODAL ── */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:18px;padding:28px;width:100%;max-width:540px;box-shadow:0 24px 60px rgba(0,0,0,.2)}
.modal h3{font-size:16px;font-weight:800;color:var(--brand);margin-bottom:20px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .full{grid-column:1/-1}
label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
input,select,textarea{width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:var(--rs);font-size:13px;font-family:inherit;color:var(--text);background:#fff;outline:none;transition:border .12s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,76,129,.1)}
textarea{resize:vertical;min-height:64px}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;border-top:1px solid #f1f5f9;padding-top:16px}

.pbar{height:5px;border-radius:100px;background:#f1f5f9;overflow:hidden;flex:1;min-width:60px}
.pbar-f{height:100%;border-radius:100px;transition:width .4s}
.mcard{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:10px;padding:16px;display:flex;gap:14px;box-shadow:var(--shadow)}
.datebox{flex-shrink:0;width:52px;text-align:center;border-radius:10px;padding:8px 4px}
.crow{border-radius:9px;margin-bottom:5px;border:1px solid}
.crow-hd{padding:9px 13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ── SYNC ── */
.sp{display:flex;align-items:center;gap:7px;padding:5px 13px;border-radius:20px;font-size:11px;font-weight:600}
.sp-ok{background:#dcfce7;color:#15803d}.sp-ld{background:#fef3c7;color:#b45309}.sp-er{background:#fee2e2;color:#dc2626}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;z-index:200;padding:12px 20px;border-radius:12px;color:#fff;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .2s ease;display:flex;align-items:center;gap:8px}

.activity-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #f8fafc;font-size:12px}

// Cada tipo de trabajo usa un modelo de contrato y un conjunto de campos específicos
// (guardados como JSON en la columna "detalles" de la hoja Trabajos).
function modeloTrabajo(tipo){
  if(tipo===TIPO_PUB||tipo==='Artículo científico'||tipo==='Publicación en revistas')return'publicacion'
  if(tipo==='Asesoría de tesis/proyectos')return'tesis'
  if(tipo==='Análisis estadístico')return'estadistica'
  if(tipo==='Revisión bibliográfica'||tipo==='Diseño de instrumentos')return'revision'
  return'general'
}

  if(!t||!t.detalles)return{}
  if(typeof t.detalles==='object')return t.detalles
  try{return JSON.parse(t.detalles)||{}}catch(e){return{}}
}

// Convierte cualquier string de fecha a YYYY-MM-DD para input type="date"
function toISO(s){
  if(!s||s==='')return''
  s=String(s).trim()
  // Already ISO: 2026-03-15
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10)
  // Google Sheets US format: M/D/YYYY or MM/DD/YYYY
  const m1=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/)
  if(m1)return m1[3]+'-'+m1[1].padStart(2,'0')+'-'+m1[2].padStart(2,'0')
  // DD-MM-YYYY
  const m2=s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/)
  if(m2)return m2[3]+'-'+m2[2].padStart(2,'0')+'-'+m2[1].padStart(2,'0')
  // Sheets Date object string: "Sun Apr 07 2026 00:00:00 GMT..."
  const m3=s.match(/(\d{4}) (\d{2}:\d{2}:\d{2})/)
  if(m3){try{const d=new Date(s);if(!isNaN(d.getTime())){const y=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0');return y+'-'+mo+'-'+dy}}catch(e){}}
  // ISO with time: 2026-04-07T10:30:00
  const m4=s.match(/^(\d{4}-\d{2}-\d{2})T/)
  if(m4)return m4[1]
  // Native parse fallback
  try{const d=new Date(s);if(!isNaN(d.getTime())){const y=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0');return y+'-'+mo+'-'+dy}}catch(e){}
  return''
}

// Formatea fecha larga: "Lunes, 30 de marzo 2026"
function fmtD(s){
  if(!s||s==='---'||s==='')return'—'
  const iso=toISO(s)
  if(!iso||iso==='')return s||'—'
  try{
    // Parse as local date (avoid UTC shift)
    const p=iso.split('-')
    const d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]))
    if(isNaN(d.getTime()))return s
    return DIAS_FULL[d.getDay()]+', '+d.getDate()+' de '+MESES_FULL[d.getMonth()].toLowerCase()+' '+d.getFullYear()
  }catch(e){return s}
}

// Formato corto: "15 mar 2026"
function fmtDCorto(s){
  if(!s||s==='')return'—'
  const iso=toISO(s)
  if(!iso)return s
  try{
    const p=iso.split('-')
    const d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]))
    if(isNaN(d.getTime()))return s
    return d.getDate()+' '+MESES_FULL[d.getMonth()].slice(0,3).toLowerCase()+' '+d.getFullYear()
  }catch(e){return s}
}

// Cargar desde localStorage o usar defaults
function cargarTpls(){
  try{
    const saved=localStorage.getItem('wa_tpls_v5')
    if(!saved) return WA_TPLS_DEFAULT.map(function(t){return Object.assign({},t)})
    const parsed=JSON.parse(saved)
    // Check emoji integrity: broken char or missing emoji in default templates
    const hasBroken=parsed.some(function(t){
      return t.msg&&(t.msg.indexOf('\uFFFD')>-1||t.msg.indexOf('\u0000')>-1)
    })
    if(hasBroken){
      localStorage.removeItem('wa_tpls_v5')
      return WA_TPLS_DEFAULT.map(function(t){return Object.assign({},t)})
    }
    // Merge: keep user's custom templates, but refresh default templates
    // that have broken emojis (no emoji chars when they should have them)
    var merged=parsed.map(function(t){
      // Renovación de marca: corrige el nombre antiguo en plantillas guardadas
      if(t.msg&&t.msg.indexOf('Research Assesor')>-1) t=Object.assign({},t,{msg:t.msg.replace(/Research Assesor/g,'Research Assessor')})
      var def=WA_TPLS_DEFAULT.find(function(d){return d.id===t.id})
      if(def){
        // If saved template lacks emojis that default has, use default
        var defHasEmoji=/[\u{1F300}-\u{1FFFF}]/u.test(def.msg)
        var savedHasEmoji=/[\u{1F300}-\u{1FFFF}]/u.test(t.msg)
        if(defHasEmoji&&!savedHasEmoji) return Object.assign({},def)
      }
      return t
    })
    // Add any default templates not in saved
    WA_TPLS_DEFAULT.forEach(function(d){
      if(!merged.some(function(t){return t.id===d.id})) merged.push(Object.assign({},d))
    })
    return merged
  }catch(e){return WA_TPLS_DEFAULT.map(function(t){return Object.assign({},t)})}
}
function guardarTpls(tpls){
  try{localStorage.setItem('wa_tpls_v5',JSON.stringify(tpls))}catch(e){}
}
var WA_TPLS=cargarTpls()

function abonoPaid(cuotaId){
  return(data.abonos||[]).reduce(function(s,a){
    return a.cuotaId===cuotaId?s+parseFloat(a.monto||0):s
  },0)
}
// Use abonos as source of truth; fallback to c.pagado if no abonos recorded
function realPaid(c){
  var fromAbonos=abonoPaid(c.id)
  // If abonos exist for this cuota, use that sum; else use c.pagado field
  return fromAbonos>0?fromAbonos:parseFloat(c.pagado||0)
}
function cStat(c){
  var paid=realPaid(c),acordado=parseFloat(c.acordado||0)
  if(paid>=acordado&&acordado>0)return'pagado'
  if(paid>0)return'parcial'
  if(c.fechaVencimiento&&new Date(c.fechaVencimiento)<new Date())return'vencido'
  return'pendiente'
}

  const total=parseFloat(t.total||0)
  const bal=Math.max(total-paid,0)
  return{total,paid,bal,pct:total>0?Math.min(Math.round(paid/total*100),100):0}
}

    syncMsg='✓ '+new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})
    syncErr=false
  }else{
    syncMsg='Error conexión'+(r&&r.error?' — '+r.error:'');syncErr=true
    const errRed=!r||r.error==='Failed to fetch'||r.error==='NetworkError'||/network|fetch|load failed/i.test(r.error||'')
    // Sin internet: usar la última copia guardada en este dispositivo (solo lectura)
    const copia=errRed?leerCopiaLocal():null
    if(copia){
      data=mapData(copia.data);sinConexion=true
      syncMsg='📴 Sin conexión — datos del '+new Date(copia.t).toLocaleString('es-EC',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})
    }else if(window._demoData&&errRed){
      // Demo solo si hay error de red total y nunca se cargaron datos reales aquí
      data=mapData(window._demoData)
      syncMsg='⚡ Modo demo — sin conexión al Sheets'
    }
  }
  loading=false;draw()
}

async function saveRec(tabla,rec,isNew){
  // Optimistic update: update UI immediately, then sync in background
  const key=tabla.toLowerCase()
  if(data[key]){
    data[key]=isNew?[...data[key],rec]:data[key].map(x=>x.id===rec.id?rec:x)
  }
  modal=null;syncMsg='Guardando...';syncErr=false;draw()
  try{
    const r=await apiPost({action:isNew?'insertar':'actualizar',tabla,fila:rec,id:rec.id})
    if(r&&r.ok){
      syncMsg='✓ '+new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})
      toast('Guardado ✓')
      // Silent background reload - don't block UI
      apiGet('getData').then(function(rd){
        if(rd&&!rd.error){
          data=mapData(rd)
          syncMsg='✓ '+new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})
          draw()
        }
      })
    }else{
      const msg=r&&r.error?r.error:'Sin respuesta'
      syncMsg='Error: '+msg;syncErr=true
      toast('Error: '+msg,'err')
      draw()
    }
  }catch(err){
    syncMsg='Error: '+err.message;syncErr=true
    toast('Error: '+err.message,'err');draw()
  }
}
async function delRec(tabla,id,msg){
  if(!confirm(msg||'¿Eliminar este registro?'))return
  // Optimistic: remove from UI immediately
  const key=tabla.toLowerCase()
  if(data[key]) data[key]=data[key].filter(function(x){return x.id!==id})
  syncMsg='Eliminando...';syncErr=false;draw()
  try{
    const r=await apiPost({action:'eliminar',tabla,id})
    if(r&&r.ok){
      toast('Eliminado ✓');syncMsg='✓ Eliminado'
      apiGet('getData').then(function(rd){
        if(rd&&!rd.error){
          data=mapData(rd)
          draw()
        }
      })
    }else{
      const msg2=r&&r.error?r.error:'Sin respuesta'
      syncMsg='Error: '+msg2;syncErr=true
      toast('Error: '+msg2,'err')
      await loadData()  // reload to restore removed item
    }
  }catch(err){
    syncMsg='Error: '+err.message;syncErr=true
    toast('Error: '+err.message,'err')
    await loadData()
  }
}

async function doLogin(){
  const u=v('lu'),p=v('lp')
  const e=document.getElementById('lerr')
  const tryAdmin=()=>(window._appUsers||USERS).find(x=>x.u===u&&x.p===p&&x.activo!=='0')
  let found=tryAdmin(),loaded=false

  // Las credenciales de cliente/colaborador solo existen en el Sheet. loadData() antes
  // solo corría DESPUÉS de un login exitoso, así que en una sesión nueva (recién abierta,
  // sin haber iniciado sesión como admin antes) window._clientUsers/data.colaboradores
  // seguían vacíos y CUALQUIER cliente o colaborador recibía "Credenciales incorrectas"
  // sin importar si la contraseña era correcta. Forzamos una carga si aún no tenemos esos datos.
  if(!found&&(!window._clientUsers||!(data.colaboradores&&data.colaboradores.length))){
    e.textContent='Verificando…';e.style.display='block'
    await loadData();loaded=true
    found=tryAdmin()
  }
  if(found){
    user=found
    // Accesos directos del ícono instalado (?p=propuestas, etc.)
    const pIni=new URLSearchParams(location.search).get('p')
    if(pIni&&NAV_MAIN.some(n=>n.id===pIni))page=pIni
    loaded?draw():loadData();return
  }

  // Check client portal users (loaded from Sheets)
  const foundClient=(window._clientUsers||[]).find(x=>x.usuario===u&&x.password===p&&x.activo!=='0')
  if(foundClient){
    user={id:foundClient.id,u:foundClient.usuario,name:foundClient.nombre,
          role:'cliente',clienteId:foundClient.clienteId}
    loaded?draw():loadData();return
  }

  // Check colaborador users (loaded from Sheets)
  const foundColab=(data.colaboradores||[]).find(x=>x.usuario===u&&x.password===p&&String(x.activo)!=='0'&&String(x.activo)!=='false')
  if(foundColab){
    user={id:foundColab.id,u:foundColab.usuario,name:foundColab.nombre,
          role:'colaborador',colaboradorId:foundColab.id}
    loaded?draw():loadData();return
  }

  e.textContent='Credenciales incorrectas';e.style.display='block'
}

// Gráfico de barras (real/proyectado por mes) dibujado en SVG con coordenadas fijas,
// para no depender de que el navegador resuelva alturas en % dentro de flexbox anidado.
function barsChartSvg(allMonths,maxVal){
  const svgW=700,svgH=130,colW=svgW/allMonths.length,barW=colW*0.55,baseY=110,maxBarH=76
  let s='<svg viewBox="0 0 '+svgW+' '+svgH+'" preserveAspectRatio="none" style="width:100%;height:130px;display:block">'
  allMonths.forEach(function(m,i){
    const isProj=m.isFuture
    const val=isProj?m.proj:m.real
    const hasVal=val>0
    const cx=i*colW+colW/2
    if(!hasVal){
      s+='<text x="'+cx+'" y="'+(baseY-20)+'" font-size="8" fill="#94a3b8" text-anchor="middle" font-weight="700">—</text>'
      s+='<line x1="'+cx+'" y1="'+(baseY-14)+'" x2="'+cx+'" y2="'+baseY+'" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>'
      s+='<circle cx="'+cx+'" cy="'+baseY+'" r="4" fill="#fff" stroke="#94a3b8" stroke-width="2"/>'
      return
    }
    const h=Math.max(Math.round(val/maxVal*maxBarH),6)
    const y=baseY-h
    const fill=isProj?'rgba(126,58,242,.45)':(m.isCurrent?'var(--brand)':'rgba(15,76,129,.65)')
    const lblFill=isProj?'var(--violet)':(m.isCurrent?'var(--brand)':'#6b7280')
    s+='<rect x="'+(cx-barW/2)+'" y="'+y+'" width="'+barW+'" height="'+h+'" rx="4" fill="'+fill+'"'+(isProj?' stroke="var(--violet)" stroke-width="2" stroke-dasharray="4,3"':'')+'>'
      +'<title>'+(isProj?'Proyectado':'Cobrado')+': $'+val+'</title></rect>'
    s+='<text x="'+cx+'" y="'+(y-6)+'" font-size="8" fill="'+lblFill+'" text-anchor="middle" font-weight="700">$'+fmt(val)+'</text>'
  })
  s+='</svg>'
  return s
}
function htmlDash(){
  // Primera carga (aún sin datos): mostrar skeleton en vez de KPIs y gráfico en $0.
  // En refrescos posteriores (loading=true pero ya hay datos) se sigue mostrando lo último cargado.
  if(loading&&!data.clientes.length&&!data.trabajos.length){
    return'<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 20px;color:var(--text3)">'
      +'<div class="spin" style="font-size:30px;margin-bottom:14px">⟳</div>'
      +'<div style="font-size:14px;font-weight:600">Cargando dashboard…</div>'
      +'</div>'
  }
  const {clientes,trabajos,cuotas,abonos,reuniones}=data
  const now=new Date()
  const hoy=now.toISOString().split('T')[0]
  const mesActual=now.getMonth(), anioActual=now.getFullYear()

  // ── KPI calcs ──
  const cobrado    =abonos.reduce((s,a)=>s+parseFloat(a.monto||0),0)
  const totalFact  =cuotas.reduce((s,c)=>s+parseFloat(c.acordado||0),0)
  const pendiente  =cuotas.filter(c=>cStat(c)!=='pagado').reduce((s,c)=>s+Math.max(parseFloat(c.acordado||0)-realPaid(c),0),0)
  const vencidas   =cuotas.filter(c=>cStat(c)==='vencido')
  const activos    =trabajos.filter(t=>t.estado!=='Completado'&&t.estado!=='Cancelado').length
  const completados=trabajos.filter(t=>t.estado==='Completado').length
  const cobPct     =totalFact>0?Math.round(cobrado/totalFact*100):0
  const proxR      =reuniones.filter(r=>toISO(r.fecha||'')>=hoy).sort((a,b)=>toISO(a.fecha||'').localeCompare(toISO(b.fecha||''))).slice(0,3)

  // ── 12 meses de datos (6 pasados + mes actual + 5 futuros) ──
  const allMonths = Array.from({length:14},(_,i)=>{
    const d=new Date(now); d.setDate(1); d.setMonth(d.getMonth()-8+i)
    const m=d.getMonth(), y=d.getFullYear()
    const isPast=y<anioActual||(y===anioActual&&m<mesActual)
    const isCurrent=y===anioActual&&m===mesActual
    const isFuture=y>anioActual||(y===anioActual&&m>mesActual)

    // Cobrado real en ese mes
    const real=abonos.reduce((s,a)=>{
      const _af=toISO(a.fecha||'');const ad=_af?new Date(_af+'T12:00:00'):new Date(NaN)
      return(ad.getMonth()===m&&ad.getFullYear()===y)?s+parseFloat(a.monto||0):s
    },0)

    // Proyectado: cuotas pendientes/parciales con vencimiento en ese mes
    const proj=cuotas.filter(c=>{
      const st=cStat(c)
      if(st==='pagado')return false
      const _cv=toISO(c.fechaVencimiento||'');const dv=_cv?new Date(_cv+'T12:00:00'):new Date(NaN)
      return dv.getMonth()===m&&dv.getFullYear()===y
    }).reduce((s,c)=>s+(parseFloat(c.acordado||0)-parseFloat(c.pagado||0)),0)

    return{label:MESES[m],m,y,real:Math.round(real),proj:Math.round(proj),isPast,isCurrent,isFuture}
  })

  // Meses pasados (incluye actual)
  const pastMonths   = allMonths.filter(x=>x.isPast||x.isCurrent)
  const futureMonths = allMonths.filter(x=>x.isFuture)

  // Ingresos reales del mes actual — calculado directamente para mayor confiabilidad
  const ingresoMesActual=abonos.reduce((s,a)=>{
    const _af=toISO(a.fecha||'');if(!_af)return s
    const ad=new Date(_af+'T12:00:00')
    return(ad.getMonth()===mesActual&&ad.getFullYear()===anioActual)?s+parseFloat(a.monto||0):s
  },0)
  // Ingresos mes anterior
  const _prevM=mesActual===0?11:mesActual-1, _prevY=mesActual===0?anioActual-1:anioActual
  const ingresoMesAnterior=abonos.reduce((s,a)=>{
    const _af=toISO(a.fecha||'');if(!_af)return s
    const ad=new Date(_af+'T12:00:00')
    return(ad.getMonth()===_prevM&&ad.getFullYear()===_prevY)?s+parseFloat(a.monto||0):s
  },0)
  // Proyección total futura
  const proyeccionTotal=futureMonths.reduce((s,x)=>s+x.proj,0)
  // Mejor mes futuro
  const mejorMesFuturo=futureMonths.reduce((best,x)=>x.proj>best.proj?x:best,{proj:0,label:'—'})
  // Variación mes a mes
  const variacion=ingresoMesAnterior>0?Math.round((ingresoMesActual-ingresoMesAnterior)/ingresoMesAnterior*100):0

  // Escala única: cada mes aporta un solo valor (real si ya pasó, proyectado si es futuro)
  const maxVal=Math.max(...allMonths.map(x=>Math.max(x.real,x.proj)),1)

  // ── Estado cuotas ──
  const cuotaDist={pagado:0,parcial:0,pendiente:0,vencido:0}
  cuotas.forEach(c=>{const s=cStat(c);cuotaDist[s]=(cuotaDist[s]||0)+1})
  const cuotaColors={pagado:'var(--green)',parcial:'var(--brand)',pendiente:'var(--amber)',vencido:'var(--red)'}
  const cuotaLabels={pagado:'Pagadas',parcial:'Parciales',pendiente:'Pendientes',vencido:'Vencidas'}
  const totalCuotas=Math.max(cuotas.length,1)

  // ── Estado trabajos ──
  const estadoDist={Nuevo:0,'En progreso':0,Revisión:0,Completado:0,Cancelado:0}
  trabajos.forEach(t=>{estadoDist[t.estado||'Nuevo']=(estadoDist[t.estado||'Nuevo']||0)+1})
  const estadoColors={Nuevo:'#93c5fd','En progreso':'var(--brand)',Revisión:'var(--amber)',Completado:'var(--green)',Cancelado:'#d1d5db'}
  const totalTrab=Math.max(trabajos.length,1)

  // ── Top tipos ──
  const tipoDist={}
  trabajos.forEach(t=>{const k=t.tipo||'Otro';tipoDist[k]=(tipoDist[k]||0)+1})
  const topTipos=Object.entries(tipoDist).sort((a,b)=>b[1]-a[1]).slice(0,5)
  let h=''

  // Alert vencidas
  if(vencidas.length){
    h+='<div class="alert-venc">⚠️ <strong>'+vencidas.length+' cuota'+(vencidas.length>1?'s':'')+' vencida'+(vencidas.length>1?'s':'')+' — $'+fmt(vencidas.reduce((s,c)=>s+(parseFloat(c.acordado||0)-parseFloat(c.pagado||0)),0))+' pendiente</strong>'
      +'<button class="btn btn-r btn-sm" onclick="goTo(\'cobros\')">Ver cobros →</button></div>'
  }


  h+='<div class="kpis">'
    +'<div class="kpi" style="cursor:pointer" onclick="goTo(\'clientes\')"><div class="kpi-label">Clientes</div><div class="kpi-value">'+clientes.length+'</div><div class="kpi-sub">'+activos+' con trabajos activos</div><div class="kpi-icon">👥</div></div>'

              +(a.comprobante?' <span style="color:#0369a1;font-weight:600">'+esc(a.comprobante)+'</span>':'')
              +(a.nota?' <span style="color:var(--text3)">'+esc(a.nota)+'</span>':'')
              +'</span>'
          })
          h+='</div></td></tr>'
        }
      })
      h+='</tbody></table></div></td></tr>'
    }
  })}else h+='<tr><td colspan="8" class="empty">Sin clientes registrados</td></tr>'
  h+='</tbody></table></div>'
  return h
}

// ─── COBROS ───────────────────────────────────────────────────────────────────
function htmlCobros(){
  const q=search.toLowerCase()
  const _ordT={};data.trabajos.forEach((t,i)=>{_ordT[t.id]=i})
  const rows=data.cuotas.map(c=>{
    const t=data.trabajos.find(x=>x.id===c.trabajoId)
    const cl=t?data.clientes.find(x=>x.id===t.clienteId):null
    const st=cStat(c)
    return{...c,_t:t,_cl:cl,_st:st}
  }).filter(c=>{
    // Skip cuotas with no trabajo asociado (huérfanas)
    if(!c._t)return false
    // Skip if no client info at all
    if(!c._cl&&!(c.clienteNombre||c._t.clienteNombre))return false
    // Apply filters
    const nameMatch=(c._cl&&c._cl.nombre||c.clienteNombre||'')+(c._t&&c._t.titulo||c.trabajoTitulo||'')
    return(cSt==='Todos'||cSt===c._st)&&(!q||nameMatch.toLowerCase().includes(q))
  })
    // Del trabajo ingresado más recientemente al más antiguo; dentro de cada trabajo, cuota 1, 2, 3…
    .sort((a,b)=>(_ordT[b.trabajoId]||0)-(_ordT[a.trabajoId]||0)||new Date(a.fechaVencimiento)-new Date(b.fechaVencimiento))

  const cobrado=data.abonos.reduce((s,a)=>s+parseFloat(a.monto||0),0)
  const pendiente=data.cuotas.filter(c=>cStat(c)!=='pagado').reduce((s,c)=>s+Math.max(parseFloat(c.acordado||0)-realPaid(c),0),0)
  const vencido=data.cuotas.filter(c=>cStat(c)==='vencido').reduce((s,c)=>s+Math.max(parseFloat(c.acordado||0)-realPaid(c),0),0)
  const total=data.cuotas.reduce((s,c)=>s+parseFloat(c.acordado||0),0)

  let h='<div class="kpis">'
    +'<div class="kpi" style="cursor:pointer" onclick="cSt=\'Todos\';draw()"><div class="kpi-label">Total facturado</div><div class="kpi-value">$'+fmt(total)+'</div><div class="kpi-sub">'+data.cuotas.length+' cuotas</div><div class="kpi-icon">📋</div></div>'
    +'<div class="kpi" style="cursor:pointer" onclick="cSt=\'pagado\';draw()"><div class="kpi-label">Cobrado</div><div class="kpi-value" style="color:var(--green)">$'+fmt(cobrado)+'</div><div class="kpi-sub">clic para ver pagadas</div><div class="kpi-icon">✅</div></div>'
    +'<div class="kpi" style="cursor:pointer" onclick="cSt=\'pendiente\';draw()"><div class="kpi-label">Por cobrar</div><div class="kpi-value" style="color:var(--amber)">$'+fmt(pendiente)+'</div><div class="kpi-sub">clic para ver pendientes</div><div class="kpi-icon">⏰</div></div>'
    +(vencido>0?'<div class="kpi" style="cursor:pointer;animation:pulse 2s infinite" onclick="cSt=\'vencido\';draw()"><div class="kpi-label">⚠️ Vencido</div><div class="kpi-value" style="color:var(--red)">$'+fmt(vencido)+'</div><div class="kpi-sub">clic para ver vencidas</div><div class="kpi-icon">🚨</div></div>':'')
    +'</div>'
  h+='<div class="tb"><input id="srch" placeholder="Buscar..." oninput="search=this.value;drawPage()" value="'+esc(search)+'" style="max-width:240px"/>'
    +['Todos','vencido','pendiente','parcial','pagado'].map(s=>'<button class="btn btn-sm '+(cSt===s?'btn-p':'btn-g')+'" onclick="cSt=\''+s+'\';drawPage()">'+s.charAt(0).toUpperCase()+s.slice(1)+'</button>').join('')
    +'<button class="btn btn-g btn-sm" style="margin-left:auto" onclick="exportCobros()">⬇ CSV</button></div>'
    +htmlCobrosFilterBadge()
  if(!rows.length)return h+'<div class="card"><p class="empty">Sin resultados</p></div>'
  rows.forEach(c=>{
    const st=c._st,_rp=realPaid(c),saldo=Math.max(parseFloat(c.acordado||0)-_rp,0)
    const today=new Date(),due=new Date(c.fechaVencimiento)
    const days=Math.ceil((due-today)/86400000)
    const bgc={pagado:'#dcfce7',parcial:'#E3ECF6',vencido:'#fee2e2',pendiente:'#fef3c7'}[st]||'#f9fafb'
    const bdc={pagado:'#bbf7d0',parcial:'#C9D9EB',vencido:'#fecaca',pendiente:'#fde68a'}[st]||'#e2e8f0'
    const phone=c._cl&&c._cl.telefono
    h+='<div style="background:'+bgc+';border:1px solid '+bdc+';border-radius:10px;margin-bottom:8px;overflow:hidden">'
      +'<div style="display:flex;align-items:center;gap:10px;padding:11px 15px;flex-wrap:wrap">'
      +'<div style="flex:1;min-width:150px"><strong style="font-size:13px">'+esc(c._cl&&c._cl.nombre||c.clienteNombre||'—')+'</strong>'
      +'<div style="font-size:11px;color:var(--text3)">'+esc(c._t&&c._t.titulo||c.trabajoTitulo||'—')+' — '+esc(c.label||'—')+'</div></div>'
      +'<div style="text-align:center;min-width:80px"><div style="font-weight:700;font-size:14px">$'+fmt(c.acordado)+'</div>'
      +(_rp>0?'<div style="font-size:10px;color:var(--green)">+$'+fmt(_rp)+'</div>':'')
      +(saldo>0&&st!=='pagado'?'<div style="font-size:11px;font-weight:600;color:var(--amber)">Saldo $'+fmt(saldo)+'</div>':'')
      +'</div>'
      +'<div style="text-align:center;min-width:85px"><div style="font-size:12px">'+fmtDCorto(c.fechaVencimiento||'')+'</div>'
      +(st!=='pagado'?'<div style="font-size:11px;color:'+(days<0?'var(--red)':days<=3?'var(--amber)':'var(--text3)')+'">'+(days<0?Math.abs(days)+'d vencido':days===0?'Hoy':'en '+days+'d')+'</div>':'')
      +'</div>'+bdg(st,cColor(st))
      +'<div style="display:flex;gap:5px;flex-wrap:wrap">'
      +(st!=='pagado'?'<button class="btn btn-green btn-sm" onclick="openModal(\'abono\',{cuotaId:\''+c.id+'\',trabajoId:\''+c.trabajoId+'\',label:\''+esc(c.label)+'\',acordado:\''+esc(c.acordado)+'\',pagado:\''+esc(c.pagado)+'\'})" >💵 Pago</button>':'' )
      +(phone?waBtnsCobros(c.id,c.trabajoId,phone,st):'')
      +'<button class="btn btn-g btn-sm" title="Editar cuota" onclick="editarCuota(\''+c.id+'\',\''+c.trabajoId+'\')" >✏️</button>'

      +'</div></div>'
    const abs=data.abonos.filter(a=>a.cuotaId===c.id)

function htmlDeudores(){

  data.cuotas.forEach(c=>{
    if(cStat(c)==='pagado')return

    const cl=data.clientes.find(x=>x.id===t.clienteId)
    if(!porCliente[t.clienteId])porCliente[t.clienteId]={cliente:cl,cuotas:[],total:0,vencidas:false}

function waDeudor(clienteId){
  const cl=data.clientes.find(c=>c.id===clienteId)
  if(!cl||!cl.telefono){toast('Cliente sin teléfono registrado','err');return}
  const trabajosCl=data.trabajos.filter(t=>t.clienteId===clienteId)
  const idsTrab=trabajosCl.map(t=>t.id)
  const cuotasPend=data.cuotas.filter(c=>idsTrab.includes(c.trabajoId)&&cStat(c)!=='pagado'&&Math.max(parseFloat(c.acordado||0)-realPaid(c),0)>0)
    .sort((a,b)=>new Date(a.fechaVencimiento)-new Date(b.fechaVencimiento))
  if(!cuotasPend.length){toast('Este cliente no tiene saldo pendiente','err');return}
  let totalSaldo=0
  const lineas=cuotasPend.map(c=>{
    const t=trabajosCl.find(x=>x.id===c.trabajoId)
    const pag=realPaid(c),saldo=Math.max(parseFloat(c.acordado||0)-pag,0)
    totalSaldo+=saldo
    return'📚 *'+(t?t.titulo:'')+'* — '+(c.label||'Cuota')
      +'\n   💰 Valor: $'+fmt(c.acordado)+(pag>0?' · Cancelado: $'+fmt(pag):'')+' · Saldo: $'+fmt(saldo)
      +'\n   📅 Vence: '+fmtDCorto(c.fechaVencimiento||'')
  }).join('\n\n')
  const msg='Hola '+cl.nombre+' 👋\n\nTe escribo para recordarte el estado de tus cuotas pendientes:\n\n'
    +lineas
    +'\n\n💵 *Total pendiente: $'+fmt(totalSaldo)+'*'
    +'\n\nSi ya realizaste algún pago, por favor envíame el comprobante para actualizarlo. Cualquier consulta, aquí estoy. 🙏'
    +'\n\n— Edison Bonifaz | Research Assessor'
  window.open(waUrl(cl.telefono,msg),'_blank')
}

function calUrl(r,clName){
  const tt=encodeURIComponent((r.titulo||'Reunión')+(clName?' — '+clName:''))
  const fechaISO=toISO(r.fecha||'')
  const dt=fechaISO.replace(/-/g,'')
  const horaClean=cleanHora(r.hora)
  const [hh,mm]=(horaClean!=='—'?horaClean:'10:00').split(':')
  const eh=String(parseInt(hh)+1).padStart(2,'0')
  const mmPad=(mm||'00').padStart(2,'0')
  return'https://calendar.google.com/calendar/r/eventedit?text='+tt+'&dates='+dt+'T'+hh+mmPad+'00/'+dt+'T'+eh+mmPad+'00&location='+encodeURIComponent(r.link||'')+'&details='+encodeURIComponent('Research Assessor\n'+(r.link||''))
}

async function genMeet(titulo,fecha,hora){
  // Try Apps Script createMeet action
  try{
    const url=API+'?action=createMeet&title='+encodeURIComponent(titulo)
      +'&date='+encodeURIComponent(fecha||'')
      +'&time='+encodeURIComponent(hora||'10:00')
      +'&duration=60&t='+Date.now()
    const r=await fetch(url)
    const text=await r.text()
    const jsonStr=text.replace(/^[^(]+\((.+)\)\s*;?\s*$/,'$1').trim()
    let d
    try{d=JSON.parse(jsonStr||text)}catch(e){d=null}
    if(d&&d.ok&&d.meetLink)return d.meetLink
    // If script doesn't support createMeet yet, throw specific error
    if(d&&d.error&&d.error.includes('desconocida')){
      throw new Error('NEEDS_REDEPLOY')
    }
    if(d&&d.error)throw new Error(d.error)
  }catch(fe){
    if(fe.message==='NEEDS_REDEPLOY'||fe.name==='TypeError'){
      throw new Error('NEEDS_REDEPLOY')
    }
    throw fe
  }
  throw new Error('Sin enlace Meet en la respuesta del servidor.')
}

function editUsuario(id){
  const allU=window._appUsers||USERS
  const rec=id?allU.find(u=>u.id===id)||{}:{}
  openModal('usuario',rec)
}
async function delUsuario(id){
  if(!confirm('¿Eliminar este usuario?'))return
  const r=await apiPost({action:'eliminar',tabla:'Usuarios',id:id})
  if(r&&r.ok){
    window._appUsers=(window._appUsers||USERS.slice()).filter(u=>u.id!==id);draw();toast('Usuario eliminado')
  }else{
    toast('Error: '+(r&&r.error||'Sin respuesta'),'err')
  }
}

const MODELO_TIT={publicacion:'📰 Detalles de la publicación científica',tesis:'🎓 Detalles de la asesoría de tesis',estadistica:'📊 Detalles del análisis estadístico',revision:'📚 Detalles de la revisión / instrumento',general:'📋 Detalles del servicio'}
function htmlDetCampos(modelo,det){
  det=det||{}
  const campos=(DET_CAMPOS[modelo]||DET_CAMPOS.general).concat(DET_EXTRA)
  let h='<div style="margin-top:14px;padding:14px;background:#FAFAF7;border:1px solid var(--border);border-radius:12px">'
    +'<div style="font-size:13px;font-weight:800;color:var(--navy);margin-bottom:2px">'+MODELO_TIT[modelo]+'</div>'
    +'<div style="font-size:11px;color:var(--text3);margin-bottom:4px">Estos datos se usan en el contrato y en el seguimiento.</div>'
    +'<div class="fg">'
  campos.forEach(function(f){
    if(f.sec){h+='<div class="full sec-t">'+esc(f.sec)+'</div>';return}
    const id='det_'+f.k,val=det[f.k]
    const cls=f.full?' class="full"':''
    let inp
    if(f.t==='select'){
      inp='<select id="'+id+'"><option value="">—</option>'+f.o.map(function(o){return'<option'+(val===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'
    }else if(f.t==='multi'){
      const arr=Array.isArray(val)?val:String(val||'').split(/\s*[,;]\s*/).filter(Boolean)
      inp='<div class="chk-grid">'+f.o.map(function(o){
        return'<label class="chk"><input type="checkbox" name="'+id+'" value="'+esc(o)+'"'+(arr.indexOf(o)>-1?' checked':'')+'/>'+esc(o)+'</label>'
      }).join('')+'</div>'
    }else if(f.t==='textarea'){
      inp='<textarea id="'+id+'" rows="2" placeholder="'+esc(f.ph||'')+'">'+esc(val||'')+'</textarea>'
    }else{
      const typ=f.t==='date'?'date':f.t==='number'?'number':f.t==='url'?'url':'text'
      const vv=f.t==='date'?toISO(val||''):(val||'')
      inp='<input id="'+id+'" type="'+typ+'"'+(typ==='number'?' min="0" step="any"':'')+' value="'+esc(vv)+'" placeholder="'+esc(f.ph||'')+'"/>'
    }
    h+='<div'+cls+'><label>'+esc(f.l)+'</label>'+inp+'</div>'
  })
  return h+'</div></div>'
}
function leerDetCampos(modelo){
  const out={}
  ;(DET_CAMPOS[modelo]||DET_CAMPOS.general).concat(DET_EXTRA).forEach(function(f){
    if(f.sec)return
    if(f.t==='multi'){
      out[f.k]=Array.from(document.querySelectorAll('input[name="det_'+f.k+'"]:checked')).map(function(x){return x.value})
    }else{
      const el=document.getElementById('det_'+f.k)
      if(el)out[f.k]=el.value
    }
  })
  return out
}

  const f=pares.filter(p=>p[1]!==undefined&&p[1]!==null&&String(p[1]).trim()!=='')

function fichaCliente(c){
  if(!c)return''
  return _fichaGrid([['Nombre completo',c.nombre],['Cédula / RUC',c.cedula||'— falta'],['Teléfono / WhatsApp',c.telefono||'— falta'],['Email',c.email||'— falta'],
    ['Dirección',c.direccion||'— falta',1],['Institución',c.institucion],['Ciudad',c.ciudad],['Área / programa / grupo',c.area,1],['Notas',c.notas,1],
    ['Registrado',c.createdAt?fmtDCorto(String(c.createdAt).slice(0,10)):'']])
}
function fichaDetalles(t){
  const det=detallesDe(t),pares=[]
  ;(DET_CAMPOS[modeloTrabajo(t.tipo)]||DET_CAMPOS.general).concat(DET_EXTRA).forEach(function(f){
    if(f.sec)return
    let val=det[f.k]
    if(Array.isArray(val))val=_lista(val)
    if(val===undefined||val===null||String(val).trim()==='')return
    if(f.t==='date')val=fmtDCorto(val)
    pares.push([f.l,val,f.full||f.t==='textarea'])
  })
  return pares.length?_fichaGrid(pares)
    :'<div style="font-size:12px;color:var(--text3)">Todavía no se registran los datos específicos del contrato (revista, fechas de entrega, condiciones…). Pulsa "Editar" para completarlos.</div>'
}
function editarDesdeContrato(tipo,tid){
  const t=data.trabajos.find(x=>x.id===tid);if(!t)return
  const cl=data.clientes.find(c=>c.id===t.clienteId)
  if(tipo==='cliente'&&!cl){toast('Este trabajo no tiene cliente asignado','err');return}
  _volverContrato=tid
  openModal(tipo,tipo==='cliente'?cl:t)

function previewPlan(){
  const total=parseFloat((document.getElementById('f4')||{}).value||0)
  const n=parseInt((document.getElementById('tp_n')||{}).value||1)
  const d=(document.getElementById('tp_d')||{}).value
  const el=document.getElementById('pprev');if(!el)return
  if(!total||!n){el.innerHTML='<em>Ingresa el valor total para ver el plan</em>';return}
  const pc=Math.floor(total*100/n)/100,last=Math.round((total-pc*(n-1))*100)/100
  let h='Plan: '
  for(let i=0;i<Math.min(n,5);i++){
    const dt=new Date(d||new Date());dt.setMonth(dt.getMonth()+i)
    const lb=i===0?'Anticipo':'Cuota '+(i+1)+(i===n-1&&n>1?' (final)':'')
    h+='<span style="background:#E3ECF6;color:var(--brand);border-radius:4px;padding:2px 6px;margin:2px;font-size:11px;display:inline-block">'+lb+' $'+fmt(i===n-1?last:pc)+' · '+dt.toISOString().split('T')[0]+'</span>'
  }
  if(n>5)h+='<em style="color:var(--text3)"> ...y '+(n-5)+' más</em>'

}
async function submitTrabajo(id,isEdit){
  const titulo=v('f0'),clienteId=v('f1')
  if(!titulo){alert('Título obligatorio');return}
  if(!clienteId){alert('Selecciona un cliente');return}
  const cl=data.clientes.find(c=>c.id===clienteId)
  const total=parseFloat(v('f4'))||0
  const workId=id||uid()
  const tipo=v('f2')
  const prevRec=id?(modal.rec||{}):{}
  const rec={id:workId,clienteId,clienteNombre:cl&&cl.nombre||'',titulo,tipo,estado:v('f3'),total,progreso:v('f5'),fechaInicio:v('f6'),fechaFin:v('f7'),notas:v('f8'),carpeta:v('f9'),
    detalles:JSON.stringify(leerDetCampos(modeloTrabajo(tipo))),
    etapa:prevRec.etapa||'',contratoUrl:prevRec.contratoUrl||'',contratoFecha:prevRec.contratoFecha||'',
    createdAt:id?(prevRec.createdAt||''):new Date().toISOString()}
  // Capture plan values BEFORE draw() clears the modal inputs
  const planN=parseInt(v('tp_n'))||1
  const planD=v('tp_d')||new Date().toISOString().split('T')[0]
  const planManual=document.getElementById('plan_manual')
  const usaManual=planManual&&planManual.style.display!=='none'
  const crearCuotas=!isEdit&&(total>0||usaManual)
  const volver=_volverContrato
  await saveRec('Trabajos',rec,!id)
  if(volver&&isEdit&&!modal){_volverContrato=volver;volverAlContrato();return}
  if(crearCuotas){
    let cuotasACrear=[]
    if(usaManual){
      // Cuotas manuales
      cuotasACrear=getCuotasManual()
      if(cuotasACrear.length===0){await loadData();return}
    }else{
      // Cuotas automáticas
      const pc=Math.floor(total*100/planN)/100
      const last=Math.round((total-pc*(planN-1))*100)/100
      for(let i=0;i<planN;i++){
        const dt=new Date(planD);dt.setMonth(dt.getMonth()+i)
        const lb=i===0?'Anticipo':'Cuota '+(i+1)+(i===planN-1&&planN>1?' (final)':'')
        cuotasACrear.push({label:lb,monto:i===planN-1?last:pc,fecha:dt.toISOString().split('T')[0]})
      }
    }
    toast('Creando '+cuotasACrear.length+' cuota'+(cuotasACrear.length>1?'s':'')+'...')
    for(let i=0;i<cuotasACrear.length;i++){
      const c=cuotasACrear[i]
      await apiPost({action:'insertar',tabla:'Cuotas',fila:{
        id:uid(),trabajoId:workId,
        clienteId:clienteId,
        clienteNombre:cl&&cl.nombre||'',
        trabajoTitulo:titulo,
        label:c.label,
        fechaVencimiento:c.fecha,
        acordado:c.monto,
        pagado:0,estado:'pendiente'
      }})
    }
    await loadData()
    toast('✓ Trabajo y '+cuotasACrear.length+' cuota'+(cuotasACrear.length>1?'s':'')+' creadas')
    abrirContrato(workId)
  }
}

}

function _cargarJSZip(cb){
  if(window.JSZip){cb();return}
  toast('Preparando descarga...')
  const s=document.createElement('script')
  s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'
  s.onload=function(){cb()}
  s.onerror=function(){toast('Error cargando JSZip — verifica conexión','err')}
  document.head.appendChild(s)
}

function _xml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}
function _fmtM(n){return'$'+(parseFloat(n)||0).toFixed(2)}
function _fmtFecha(){
  const d=new Date()
  return d.getDate().toString().padStart(2,'0')+'/'+(d.getMonth()+1).toString().padStart(2,'0')+'/'+d.getFullYear()
}

function _p(text,opts){
  opts=opts||{}
  const sz=opts.sz||22
  const bold=opts.bold?'<w:b/>':''
  const color=opts.color?'<w:color w:val="'+opts.color+'"/>' : ''
  const before=opts.before||0
  const after=opts.after!==undefined?opts.after:80
  const align=opts.align?'<w:jc w:val="'+opts.align+'"/>':''
  const keep=opts.keep?'<w:keepNext/>':''  // no separar este párrafo de lo que sigue (p. ej. una tabla)
  return'<w:p><w:pPr>'+keep+'<w:spacing w:before="'+before+'" w:after="'+after+'"/>'+align+'</w:pPr>'
    +'<w:r><w:rPr>'+bold+'<w:sz w:val="'+sz+'"/><w:szCs w:val="'+sz+'"/>'+DOC_RF+''+color+'</w:rPr>'
    +'<w:t xml:space="preserve">'+_xml(text)+'</w:t></w:r></w:p>'
}
