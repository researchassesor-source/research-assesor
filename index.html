// ════════════════════════════════════════════════════════════════
// PDF — generado en el navegador a partir del mismo contenido del Word
// (párrafos y tablas de WordprocessingML) con el membrete: logo, QR, ondas y pie.
// ════════════════════════════════════════════════════════════════
const LIB_PDFLIB='https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js'
const W_NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main'
const TW=t=>(parseFloat(t)||0)/20               // twips → puntos
const hexRgb=h=>{h=String(h||'000000').replace('#','');const n=parseInt(h.length===6?h:'000000',16);return PDFLib.rgb(((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255)}
function _wHijo(el,n){for(const c of el.childNodes)if(c.nodeType===1&&c.localName===n)return c;return null}
function _wAttr(el,n){return el?el.getAttributeNS(W_NS,n)||el.getAttribute('w:'+n):null}
// Interpreta el subconjunto de WordprocessingML que generan los documentos de la app
function _modeloBody(body){
  const xml='<w:document xmlns:w="'+W_NS+'" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>'
    +body.replace(/<w:sectPr>[\s\S]*?<\/w:sectPr>/g,'')+'</w:body></w:document>'
  const doc=new DOMParser().parseFromString(xml,'application/xml')
  if(doc.getElementsByTagName('parsererror').length)throw new Error('Documento no válido')
  const par=function(p){
    const pPr=_wHijo(p,'pPr'),sp=pPr&&_wHijo(pPr,'spacing'),jc=pPr&&_wHijo(pPr,'jc'),ind=pPr&&_wHijo(pPr,'ind'),bd=pPr&&_wHijo(pPr,'pBdr')
    const bot=bd&&_wHijo(bd,'bottom')
    const runs=[]
    for(const r of p.childNodes){
      if(r.nodeType!==1||r.localName!=='r')continue
      const rPr=_wHijo(r,'rPr'),t=_wHijo(r,'t');if(!t)continue
      const sz=rPr&&_wHijo(rPr,'sz'),co=rPr&&_wHijo(rPr,'color')
      runs.push({text:t.textContent.replace(/\t/g,'  '),bold:!!(rPr&&_wHijo(rPr,'b')),size:sz?parseFloat(_wAttr(sz,'val'))/2:11,color:co?_wAttr(co,'val'):'000000'})
    }
    return{type:'p',runs:runs,before:TW(sp&&_wAttr(sp,'before')),after:sp&&_wAttr(sp,'after')!=null?TW(_wAttr(sp,'after')):4,
      align:(jc&&_wAttr(jc,'val'))||'left',keep:!!(pPr&&_wHijo(pPr,'keepNext')),
      indLeft:TW(ind&&_wAttr(ind,'left')),hanging:TW(ind&&_wAttr(ind,'hanging')),
      border:bot?{color:_wAttr(bot,'color')||'0F4C81',size:(parseFloat(_wAttr(bot,'sz'))||4)/8}:null}
  }
  const tabla=function(tb){
    const grid=_wHijo(tb,'tblGrid'),widths=[]
    for(const g of grid.childNodes)if(g.nodeType===1)widths.push(TW(_wAttr(g,'w')))
    const tblPr=_wHijo(tb,'tblPr'),bs=tblPr&&_wHijo(tblPr,'tblBorders'),top=bs&&_wHijo(bs,'top')
    const rows=[]
    for(const tr of tb.childNodes){
      if(tr.nodeType!==1||tr.localName!=='tr')continue
      const trPr=_wHijo(tr,'trPr'),cells=[]
      for(const tc of tr.childNodes){
        if(tc.nodeType!==1||tc.localName!=='tc')continue
        const tcPr=_wHijo(tc,'tcPr'),shd=tcPr&&_wHijo(tcPr,'shd'),w=tcPr&&_wHijo(tcPr,'tcW')
        const paras=[];for(const p of tc.childNodes)if(p.nodeType===1&&p.localName==='p')paras.push(par(p))
        cells.push({w:TW(w&&_wAttr(w,'w')),fill:shd?_wAttr(shd,'fill'):'FFFFFF',paras:paras,keep:paras.some(x=>x.keep)})
      }
      rows.push({header:!!(trPr&&_wHijo(trPr,'tblHeader')),cells:cells,keep:cells.some(c=>c.keep)})
    }
    return{type:'tbl',widths:widths,borde:{color:_wAttr(top,'color')||'CCCCCC',size:(parseFloat(_wAttr(top,'sz'))||2)/8},rows:rows}
  }
  const bloques=[],b=doc.getElementsByTagNameNS(W_NS,'body')[0]
  for(const el of b.childNodes){if(el.nodeType!==1)continue;if(el.localName==='p')bloques.push(par(el));else if(el.localName==='tbl')bloques.push(tabla(el))}
  return bloques
}
// Fuente incrustada en el PDF (serif, similar a Palatino): así el texto se ve igual en cualquier visor.
// Sin conexión se usa Times (fuente estándar del PDF).
const LIB_FONTKIT='https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js'
const FUENTE_PDF={reg:'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/crimsontext/CrimsonText-Regular.ttf',bold:'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/crimsontext/CrimsonText-Bold.ttf'}
let _fuenteBytes=null
async function _fuentesPdf(doc){
  try{
    await cargarLib(LIB_FONTKIT,'fontkit')
    doc.registerFontkit(window.fontkit)
    if(!_fuenteBytes)_fuenteBytes=await Promise.all([FUENTE_PDF.reg,FUENTE_PDF.bold].map(u=>fetch(u).then(x=>{if(!x.ok)throw new Error('HTTP '+x.status);return x.arrayBuffer()})))
    return{reg:await doc.embedFont(_fuenteBytes[0],{subset:true}),bold:await doc.embedFont(_fuenteBytes[1],{subset:true})}
  }catch(e){
    console.warn('Fuente incrustada no disponible, se usa Times:',e)
    return{reg:await doc.embedFont(PDFLib.StandardFonts.TimesRoman),bold:await doc.embedFont(PDFLib.StandardFonts.TimesRomanBold)}
  }
}
// Texto que la fuente puede dibujar (se reemplazan o quitan símbolos sin glifo)
const _REEMPLAZOS={'■':'•','✓':'v','✔':'v','→':'->','←':'<-','≤':'<=','≥':'>=',' ':' ',' ':' ','‑':'-'}
function _txtPdf(font,s){
  const fk=font.embedder&&font.embedder.font&&font.embedder.font.hasGlyphForCodePoint?font.embedder.font:null
  let o=''
  for(const ch of String(s)){
    const c=_REEMPLAZOS[ch]!==undefined?_REEMPLAZOS[ch]:ch
    if(fk){if(c===' '||Array.from(c).every(x=>fk.hasGlyphForCodePoint(x.codePointAt(0))))o+=c;continue}
    try{font.encodeText(c);o+=c}catch(e){}
  }
  return o
}
// Arma las líneas de un párrafo dentro de un ancho dado
function _lineasParrafo(p,ancho,F){
  const toks=[]
  p.runs.forEach(function(r){
    const font=r.bold?F.bold:F.reg,txt=_txtPdf(font,r.text)
    txt.split(/( +)/).forEach(function(w){if(w!=='')toks.push({t:w,esp:/^ +$/.test(w),font:font,size:r.size,color:r.color,ancho:font.widthOfTextAtSize(w,r.size)})})
  })
  const lineas=[];let ln=[],w=0
  const primera=()=>lineas.length===0
  const limite=()=>ancho-(primera()?Math.max(p.indLeft-p.hanging,0):p.indLeft)
  toks.forEach(function(t){
    if(t.esp&&!ln.length)return
    if(!t.esp&&w+t.ancho>limite()&&ln.length){
      while(ln.length&&ln[ln.length-1].esp){w-=ln.pop().ancho}
      lineas.push({toks:ln,ancho:w});ln=[];w=0
    }
    // palabra más larga que la línea: se corta por caracteres
    if(!t.esp&&t.ancho>limite()){
      let trozo=''
      for(const ch of t.t){const x=t.font.widthOfTextAtSize(trozo+ch,t.size);if(x>limite()&&trozo){ln.push(Object.assign({},t,{t:trozo,ancho:t.font.widthOfTextAtSize(trozo,t.size)}));lineas.push({toks:ln,ancho:t.font.widthOfTextAtSize(trozo,t.size)});ln=[];trozo=ch}else trozo+=ch}
      t=Object.assign({},t,{t:trozo,ancho:t.font.widthOfTextAtSize(trozo,t.size)})
    }
    ln.push(t);w+=t.ancho
  })
  while(ln.length&&ln[ln.length-1].esp){w-=ln.pop().ancho}
  if(ln.length||!lineas.length)lineas.push({toks:ln,ancho:w})
  const def=(p.runs[0]&&p.runs[0].size)||11
  lineas.forEach(l=>{l.alto=Math.max(def,...l.toks.map(t=>t.size))*1.2})
  return lineas
}
const _altoParrafo=(p,ancho,F)=>p.before+p.after+_lineasParrafo(p,ancho,F).reduce((s,l)=>s+l.alto,0)
function _dibujarLinea(page,l,x,y,ancho,p,ultima,indent){
  const libre=ancho-indent-l.ancho
  let xx=x+indent,extra=0
  if(p.align==='center')xx+=libre/2
  else if(p.align==='right')xx+=libre
  else if(p.align==='both'&&!ultima){const gaps=l.toks.filter(t=>t.esp).length;if(gaps)extra=libre/gaps}
  l.toks.forEach(function(t){
    if(t.esp){xx+=t.ancho+extra;return}
    page.drawText(t.t,{x:xx,y:y,size:t.size,font:t.font,color:hexRgb(t.color)});xx+=t.ancho
  })
}

async function generarPdf(body,opts){
  opts=opts||{}
  await cargarLib(LIB_PDFLIB,'PDFLib')
  const L=PDFLib,doc=await L.PDFDocument.create()
  const F=await _fuentesPdf(doc)
  const b64u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0))
  const logo=await doc.embedPng(b64u8(LOGO_B64)),ondas=await doc.embedJpg(b64u8(ONDAS_B64))
  const qr=opts.qrB64?await doc.embedPng(b64u8(opts.qrB64)):null
  const PW=595.28,PH=841.89,ML=56.7,MR=56.7,MT=100,MB=112,AN=PW-ML-MR
  const pr=prestador()
  const pie=[pr.direccion?'Dirección: '+pr.direccion:'',pr.telefono?'Celular: '+pr.telefono:'',pr.web?'Sitio web: '+pr.web:''].filter(Boolean)
  let page,y
  const nuevaPagina=function(){
    page=doc.addPage([PW,PH])
    const hO=PW*406/478
    page.drawImage(ondas,{x:0,y:0,width:PW,height:hO})
    page.drawImage(logo,{x:39.4,y:PH-23.6-70.4,width:198.4,height:70.4})
    if(qr)page.drawImage(qr,{x:PW-39.4-64.6,y:PH-20.5-64.6,width:64.6,height:64.6})
    let yy=28
    pie.slice().reverse().forEach(function(t){const s=_txtPdf(F.bold,t),w=F.bold.widthOfTextAtSize(s,10);page.drawText(s,{x:(PW-w)/2,y:yy,size:10,font:F.bold,color:hexRgb('215E99')});yy+=13})
    if(opts.codigo){const s=_txtPdf(F.reg,'Código de verificación: '+opts.codigo+' · Verifique su autenticidad escaneando el código QR'),w=F.reg.widthOfTextAtSize(s,7.5);page.drawText(s,{x:(PW-w)/2,y:yy+1,size:7.5,font:F.reg,color:hexRgb('0B2545')})}
    y=PH-MT
  }
  const libre=()=>y-MB
  const firmas=[] // posiciones de las líneas de firma (para el sello de la firma electrónica)
  nuevaPagina()
  const bloques=_modeloBody(body)
  const altoTabla=t=>t.rows.reduce((s,r)=>s+_altoFila(r),0)
  const _altoFila=function(r){
    return Math.max(...r.cells.map(c=>8+c.paras.reduce((s,p)=>s+_altoParrafo(Object.assign({},p,{before:0,after:0}),c.w-10,F),0)))
  }
  const altoMinimo=function(bq){ // lo que debe caber junto con un párrafo "mantener con el siguiente"
    if(!bq)return 0
    if(bq.type==='tbl'){
      const esFirmas=bq.rows.some(r=>r.cells.some(c=>c.paras.length===1&&/^_{8,}$/.test((c.paras[0].runs[0]||{}).text||'')))
      const keepAll=esFirmas||bq.rows.slice(0,-1).every(r=>r.keep)
      return keepAll?altoTabla(bq):(_altoFila(bq.rows[0])+(bq.rows[1]?_altoFila(bq.rows[1]):0))
    }
    const ls=_lineasParrafo(bq,AN,F);return bq.before+ls.slice(0,2).reduce((s,l)=>s+l.alto,0)
  }
  for(let i=0;i<bloques.length;i++){
    const bq=bloques[i]
    if(bq.type==='p'){
      const ls=_lineasParrafo(bq,AN,F),alto=bq.before+ls.reduce((s,l)=>s+l.alto,0)
      if(bq.keep&&y<PH-MT){
        const necesita=bq.before+ls.reduce((s,l)=>s+l.alto,0)+altoMinimo(bloques[i+1])
        if(necesita>libre()&&necesita<PH-MT-MB)nuevaPagina()
      }
      if(y<PH-MT)y-=bq.before
      ls.forEach(function(l,k){
        if(l.alto>libre())nuevaPagina()
        y-=l.alto
        const ind=k===0?Math.max(bq.indLeft-bq.hanging,0):bq.indLeft
        _dibujarLinea(page,l,ML,y+l.alto*0.22,AN,bq,k===ls.length-1,ind)
      })
      if(bq.border){page.drawLine({start:{x:ML,y:y-2},end:{x:ML+AN,y:y-2},thickness:Math.max(bq.border.size,0.5),color:hexRgb(bq.border.color)})}
      y-=bq.after
    }else{
      // Tablas que van completas en una página: las marcadas "mantener" y la de firmas
      const esFirmas=bq.rows.some(r=>r.cells.some(c=>c.paras.length===1&&/^_{8,}$/.test((c.paras[0].runs[0]||{}).text||'')))
      const keepAll=esFirmas||bq.rows.slice(0,-1).every(r=>r.keep)
      const total=altoTabla(bq)
      if(keepAll&&total>libre()&&total<PH-MT-MB)nuevaPagina()
      const cabeceras=bq.rows.filter(r=>r.header)
      const dibujarFila=function(r){
        const h=_altoFila(r)
        let x=ML
        r.cells.forEach(function(c){
          const fill=String(c.fill||'FFFFFF').toUpperCase()
          if(fill!=='FFFFFF'&&fill!=='AUTO')page.drawRectangle({x:x,y:y-h,width:c.w,height:h,color:hexRgb(fill)})
          page.drawRectangle({x:x,y:y-h,width:c.w,height:h,borderColor:hexRgb(bq.borde.color),borderWidth:Math.max(bq.borde.size,0.25)})
          let yy=y-4
          c.paras.forEach(function(p){
            const pp=Object.assign({},p,{before:0,after:0})
            _lineasParrafo(pp,c.w-10,F).forEach(function(l,k,arr){yy-=l.alto;_dibujarLinea(page,l,x+5,yy+l.alto*0.22,c.w-10,pp,k===arr.length-1,0)})
          })
          if(c.paras.length===1&&/^_{8,}$/.test((c.paras[0].runs[0]||{}).text||''))firmas.push({page:page,x:x,y:y-h,w:c.w,h:h})
          x+=c.w
        })
        y-=h
      }
      bq.rows.forEach(function(r,k){
        if(_altoFila(r)>libre()){nuevaPagina();if(!r.header)cabeceras.forEach(dibujarFila)}
        dibujarFila(r)
      })
    }
  }
  doc.setTitle((opts.titulo||'Documento')+(opts.codigo?' · '+opts.codigo:''))
  if(opts.codigo){doc.setSubject('Código de verificación '+opts.codigo);doc.setKeywords([opts.codigo])}
  doc.setCreator('Research Assessor');doc.setProducer('Research Assessor')
  return{doc:doc,fuentes:F,firmas:firmas}
}

// FIRMA ELECTRÓNICA CON ARCHIVO .p12 (dentro del sistema, sin programas externos)
// Firma PDF estándar (adbe.pkcs7.detached, CMS con SHA-256) con sello visible.
// El archivo .p12 y su clave se usan solo en este equipo: nunca se envían al servidor.
// ════════════════════════════════════════════════════════════════
const P12_KEY='ra_p12_v1'
let _p12Cache=null // {nombre,bytes} del archivo elegido en esta sesión
function p12Recordado(){try{const x=JSON.parse(localStorage.getItem(P12_KEY)||'null');return x&&x.b64?x:null}catch(e){return null}}
function olvidarP12(){try{localStorage.removeItem(P12_KEY)}catch(e){};_p12Cache=null;toast('Certificado olvidado en este equipo');draw()}
async function leerP12(bytesU8,clave){
  await cargarLib(LIB_FORGE,'forge')
  const A=forge.asn1
  let p12
  try{p12=forge.pkcs12.pkcs12FromAsn1(A.fromDer(forge.util.createBuffer(bytesToLatin1(bytesU8))),false,clave)}
  catch(e){throw new Error(/password|Invalid|decrypt|MAC/i.test(e.message)?'La clave del certificado no es correcta.':'No se pudo abrir el archivo .p12: '+e.message)}
  const bolsasK=(p12.getBags({bagType:forge.pki.oids.pkcs8ShroudedKeyBag})[forge.pki.oids.pkcs8ShroudedKeyBag]||[]).concat(p12.getBags({bagType:forge.pki.oids.keyBag})[forge.pki.oids.keyBag]||[])
  const certs=(p12.getBags({bagType:forge.pki.oids.certBag})[forge.pki.oids.certBag]||[]).map(b=>b.cert).filter(Boolean)
  const llave=bolsasK.map(b=>b.key).find(Boolean)
  if(!llave)throw new Error('El archivo no contiene la llave privada de firma.')
  if(!llave.n)throw new Error('Tipo de llave no soportado (se requiere RSA).')
  const cert=certs.find(c=>c.publicKey&&c.publicKey.n&&c.publicKey.n.equals(llave.n))
  if(!cert)throw new Error('No se encontró el certificado de la llave en el archivo.')
  const campo=(ent,n)=>{const x=ent.getField(n);return x?String(x.value):''}
  const textos=cert.subject.attributes.map(a=>String(a.value))
  ;(cert.extensions||[]).forEach(function(e){try{_textosAsn1(A.fromDer(e.value,{strict:false}),textos)}catch(x){}})
  const ced=textos.join(' ').match(/\b(\d{10}(?:001)?)\b/)
  const ahora=new Date()
  return{llave:llave,cert:cert,cadena:certs,nombre:campo(cert.subject,'CN'),cedula:ced?ced[1]:'',
    emisor:campo(cert.issuer,'O')||campo(cert.issuer,'CN'),desde:cert.validity.notBefore,hasta:cert.validity.notAfter,
    vigente:ahora>=cert.validity.notBefore&&ahora<=cert.validity.notAfter}
}
// Agrega el campo de firma y firma el PDF (CMS detached sobre el /ByteRange)
async function firmarPdf(gen,cred,info){
  const L=PDFLib,doc=gen.doc,ctx=doc.context,F=gen.fuentes
  const pages=doc.getPages()
  // Sello visible sobre la línea de firma de EL PRESTADOR (primera línea de firma del documento)
  const pos=gen.firmas[0]||{page:pages[pages.length-1],x:56.7,y:140,w:200,h:20}
  const fecha=new Date()
  const fh=fecha.toLocaleString('es-EC',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})
  const lineas=[['Firmado electrónicamente por:',F.reg,6.5],[cred.nombre,F.bold,8],[(cred.cedula?'C.I. '+cred.cedula+' · ':'')+fh,F.reg,6.5],['Certificado: '+cred.emisor,F.reg,6]]
  const sx=pos.x+6,sw=pos.w-12,sh=lineas.length*9+6,sy=pos.y+pos.h-2
  pos.page.drawRectangle({x:sx,y:sy,width:sw,height:sh,color:hexRgb('F5EBDC'),borderColor:hexRgb('B8894A'),borderWidth:0.8,opacity:0.95})
  let ly=sy+sh-9
  lineas.forEach(function(l){const s=_txtPdf(l[1],l[0]);pos.page.drawText(s.length>70?s.slice(0,70)+'…':s,{x:sx+5,y:ly,size:l[2],font:l[1],color:hexRgb('0B2545'),maxWidth:sw-10});ly-=9})
  // Diccionario de firma con espacios reservados
  const RES=24000 // bytes reservados para la firma CMS
  const byteRange=L.PDFArray.withContext(ctx)
  byteRange.push(L.PDFNumber.of(0));byteRange.push(L.PDFName.of('**********'));byteRange.push(L.PDFName.of('**********'));byteRange.push(L.PDFName.of('**********'))
  const sig=ctx.obj({Type:'Sig',Filter:'Adobe.PPKLite',SubFilter:'adbe.pkcs7.detached',ByteRange:byteRange,
    Contents:L.PDFHexString.of('0'.repeat(RES*2)),Reason:L.PDFString.of(_txtPdf(F.reg,info.motivo||'Firma del contrato')),
    M:L.PDFString.fromDate(fecha),Name:L.PDFString.of(_txtPdf(F.reg,cred.nombre)),Location:L.PDFString.of(_txtPdf(F.reg,info.lugar||'Ecuador')),
    ContactInfo:L.PDFString.of(_txtPdf(F.reg,info.contacto||''))})
  const sigRef=ctx.register(sig)
  const widget=ctx.obj({Type:'Annot',Subtype:'Widget',FT:'Sig',Rect:[sx,sy,sx+sw,sy+sh],V:sigRef,T:L.PDFString.of('Firma_Prestador'),F:4,P:pos.page.ref})
  const wRef=ctx.register(widget)
  pos.page.node.set(L.PDFName.of('Annots'),ctx.obj([wRef]))
  doc.catalog.set(L.PDFName.of('AcroForm'),ctx.obj({SigFlags:3,Fields:[wRef]}))
  const u8=await doc.save({useObjectStreams:false})
  // Ubicar los espacios reservados
  const txt=bytesToLatin1(u8)
  const reBR=/\/ByteRange\s*\[\s*0\s+\/\*{10}\s+\/\*{10}\s+\/\*{10}\s*\]/
  const mBR=reBR.exec(txt);if(!mBR)throw new Error('No se pudo preparar la firma (ByteRange)')
  const iC=txt.indexOf('/Contents <'+'0'.repeat(32),mBR.index-RES*2-200);const ini=txt.indexOf('<',iC>-1?iC:txt.indexOf('/Contents <'))
  const fin=ini+1+RES*2+1
  if(txt[fin-1]!=='>')throw new Error('No se pudo preparar la firma (Contents)')
  const br='/ByteRange ['+[0,ini,fin,u8.length-fin].join(' ')+']'
  if(br.length>mBR[0].length)throw new Error('ByteRange demasiado largo')
  const brFinal=br.slice(0,-1)+' '.repeat(mBR[0].length-br.length)+']'
  for(let k=0;k<brFinal.length;k++)u8[mBR.index+k]=brFinal.charCodeAt(k)
  // CMS (PKCS#7) detached con SHA-256
  const contenido=new Uint8Array(ini+(u8.length-fin));contenido.set(u8.subarray(0,ini),0);contenido.set(u8.subarray(fin),ini)
  const p7=forge.pkcs7.createSignedData()
  p7.content=forge.util.createBuffer(bytesToLatin1(contenido))
  cred.cadena.forEach(c=>p7.addCertificate(c))
  p7.addSigner({key:cred.llave,certificate:cred.cert,digestAlgorithm:forge.pki.oids.sha256,
    authenticatedAttributes:[{type:forge.pki.oids.contentType,value:forge.pki.oids.data},{type:forge.pki.oids.messageDigest},{type:forge.pki.oids.signingTime,value:fecha}]})
  p7.sign({detached:true})
  const hex=forge.util.bytesToHex(forge.asn1.toDer(p7.toAsn1()).getBytes())
  if(hex.length>RES*2)throw new Error('La firma no cabe en el espacio reservado')
  const hexFull=hex+'0'.repeat(RES*2-hex.length)
  for(let k=0;k<hexFull.length;k++)u8[ini+1+k]=hexFull.charCodeAt(k)
  return u8
}

// ── Diagnóstico de instalación de la app ──
async function diagnosticoInstalacion(){
  const R=[],ua=navigator.userAgent
  const add=(ok,t,d)=>R.push({ok:ok,t:t,d:d||''})
  const enApp=esStandalone()
  if(enApp){add(true,'Ya estás usando la app instalada');return R}
  const https=location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)
  add(https,'Conexión segura (https)',https?location.host:location.protocol==='file:'?'Estás abriendo el archivo desde tu equipo. La app solo se instala desde la dirección https de GitHub Pages.':'La dirección no es https.')
  const inApp=/FBAN|FBAV|Instagram|Line\/|WhatsApp|; wv\)|GSA\//i.test(ua)
  const ios=esIOS(),safari=/Safari/i.test(ua)&&!/CriOS|FxiOS|EdgiOS|Chrome|Chromium|Android/i.test(ua)
  const firefox=/Firefox|FxiOS/i.test(ua),chromium=/Chrome|Chromium|Edg\//i.test(ua)&&!/OPR\//.test(ua)
  if(inApp)add(false,'Navegador interno de otra app','Abriste el enlace dentro de WhatsApp, Facebook u otra app. Toca ⋮ o ↗ y elige "Abrir en Chrome" (Android) o "Abrir en Safari" (iPhone).')
  else if(ios)add(true,'iPhone / iPad',safari?'En Safari: Compartir ↑ → "Agregar a pantalla de inicio". En iPhone no aparece un botón de instalar automático.':'Abre la dirección en Safari: Compartir ↑ → "Agregar a pantalla de inicio".')
  else if(firefox)add(false,'Firefox no instala aplicaciones web','Abre la dirección en Google Chrome o Microsoft Edge.')
  else if(safari)add(true,'Safari en Mac','Menú Archivo → "Agregar al Dock" (macOS Sonoma o superior), o usa Chrome/Edge.')
  else add(chromium,'Navegador compatible',chromium?'Chrome / Edge':'Usa Google Chrome o Microsoft Edge.')
  try{
    const r=await fetch('manifest.webmanifest',{cache:'no-store'})
    if(!r.ok)throw new Error('HTTP '+r.status)
    const m=await r.json()
    const iconos=await Promise.all((m.icons||[]).map(i=>fetch(i.src,{cache:'no-store'}).then(x=>x.ok).catch(()=>false)))
    const okIc=iconos.length>0&&iconos.every(Boolean),faltan=(m.icons||[]).filter((i,k)=>!iconos[k]).map(i=>i.src).filter((v,k,a)=>a.indexOf(v)===k)
    add(true,'Manifiesto de la app',m.name)
    add(okIc,'Íconos de la app',okIc?iconos.length+' íconos encontrados':'Faltan en el repositorio: '+faltan.join(', ')+'. Súbelos junto a index.html.')
  }catch(e){add(false,'Manifiesto de la app','No se encontró manifest.webmanifest ('+e.message+'). Súbelo a la misma carpeta que index.html.')}
  if('serviceWorker' in navigator){
    const reg=await navigator.serviceWorker.getRegistration().catch(()=>null)
    add(!!(reg&&(reg.active||reg.waiting||reg.installing)),'Servicio de la app (sw.js)',reg?'Registrado':'No registrado: sube sw.js a la misma carpeta que index.html y recarga la página.')
  }else add(false,'Servicio de la app','Este navegador no lo admite.')
  if(chromium&&!ios&&!inApp)add(!!_installEvt,'Instalación disponible',_installEvt?'Pulsa "📲 Instalar app".'
    :'Chrome no ofreció la instalación todavía. Puede que ya esté instalada (búscala en tus apps), o que la hayas rechazado antes: en computadora usa el ícono ⊕ de la barra de direcciones o ⋮ → "Transmitir, guardar y compartir" → "Instalar página como app"; en Android ⋮ → "Agregar a la pantalla principal" → "Instalar".')
  return R
}

  return R.map(x=>'<div style="display:flex;gap:8px;margin-bottom:7px;font-size:12.5px;line-height:1.5"><span>'+(x.ok?'✅':'❌')+'</span><span><strong>'+esc(x.t)+'</strong>'+(x.d?'<br/><span style="color:var(--text2)">'+esc(x.d)+'</span>':'')+'</span></div>').join('')

// manifest.webmanifest, sw.js y los íconos (icon-*.png, apple-touch-icon.png).

let _installEvt=null,_swNuevo=null
const esStandalone=()=>(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true
const esIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)
function puedeInstalar(){return!esStandalone()&&(!!_installEvt||esIOS())}
function htmlBotonInstalar(clase){
  if(!puedeInstalar())return''
  return'<button class="btn '+(clase||'btn-g')+' btn-sm" style="width:100%;justify-content:center;margin-bottom:6px" onclick="instalarApp()">📲 Instalar app</button>'
}
function htmlInstalarLogin(){
  return puedeInstalar()?htmlBotonInstalar('btn-gold')+'<div style="font-size:11px;color:var(--text3);text-align:center">Instálala en tu teléfono o computadora para abrirla como una app.</div>':''
}
// En el login solo se actualiza el recuadro del botón (no se borra lo que el usuario escribió)
function refrescarInstalar(){
  const s=document.getElementById('inst_slot')
  if(s)s.innerHTML=htmlInstalarLogin();else if(user)draw()
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();_installEvt=e;refrescarInstalar()})

async function instalarApp(){
  if(_installEvt){
    _installEvt.prompt()

  alert(textoInstalarIOS())
}

function actualizarApp(){
  if(_swNuevo&&_swNuevo.waiting)_swNuevo.waiting.postMessage('activar')
  else location.reload()
}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      const avisar=function(){if(reg.waiting&&navigator.serviceWorker.controller){_swNuevo=reg;if(user)draw()}}
      avisar()
      reg.addEventListener('updatefound',function(){
        const w=reg.installing
        if(w)w.addEventListener('statechange',function(){if(w.state==='installed')avisar()})
      })
    }).catch(function(e){console.warn('Service worker no registrado:',e)})
    let recargando=false
    navigator.serviceWorker.addEventListener('controllerchange',function(){if(recargando)return;recargando=true;location.reload()})
  })
}

window.addEventListener('online',function(){if(user&&sinConexion){toast('Conexión restablecida');loadData()}})
