// FIRMA ELECTRÓNICA CON ARCHIVO .p12 (dentro del sistema, sin programas externos)
// Firma PDF estándar (adbe.pkcs7.detached, CMS con SHA-256) con sello visible.
// El archivo .p12 y su clave se usan solo en este equipo: nunca se envían al servidor.
// ════════════════════════════════════════════════════════════════
const P12_KEY='ra_p12_v1'
let _p12Cache=null // {nombre,bytes} del archivo elegido en esta sesión
function p12Recordado(){try{const x=JSON.parse(localStorage.getItem(P12_KEY)||'null');return x&&x.b64?x:null}catch(e){return null}}
function olvidarP12(){try{localStorage.removeItem(P12_KEY)}catch(e){};_p12Cache=null;toast('Certificado olvidado en este equipo');draw()}
async function leerP12(bytesU8,clave){
  await cargarLib(LIB_FORGE,'forge')
  const A=forge.asn1
  let p12
  try{p12=forge.pkcs12.pkcs12FromAsn1(A.fromDer(forge.util.createBuffer(bytesToLatin1(bytesU8))),false,clave)}
  catch(e){throw new Error(/password|Invalid|decrypt|MAC/i.test(e.message)?'La clave del certificado no es correcta.':'No se pudo abrir el archivo .p12: '+e.message)}
  const bolsasK=(p12.getBags({bagType:forge.pki.oids.pkcs8ShroudedKeyBag})[forge.pki.oids.pkcs8ShroudedKeyBag]||[]).concat(p12.getBags({bagType:forge.pki.oids.keyBag})[forge.pki.oids.keyBag]||[])
  const certs=(p12.getBags({bagType:forge.pki.oids.certBag})[forge.pki.oids.certBag]||[]).map(b=>b.cert).filter(Boolean)
  const llave=bolsasK.map(b=>b.key).find(Boolean)
  if(!llave)throw new Error('El archivo no contiene la llave privada de firma.')
  if(!llave.n)throw new Error('Tipo de llave no soportado (se requiere RSA).')
  const cert=certs.find(c=>c.publicKey&&c.publicKey.n&&c.publicKey.n.equals(llave.n))
  if(!cert)throw new Error('No se encontró el certificado de la llave en el archivo.')
  const campo=(ent,n)=>{const x=ent.getField(n);return x?String(x.value):''}
  const textos=cert.subject.attributes.map(a=>String(a.value))
  ;(cert.extensions||[]).forEach(function(e){try{_textosAsn1(A.fromDer(e.value,{strict:false}),textos)}catch(x){}})
  const ced=textos.join(' ').match(/\b(\d{10}(?:001)?)\b/)
  const ahora=new Date()
  return{llave:llave,cert:cert,cadena:certs,nombre:campo(cert.subject,'CN'),cedula:ced?ced[1]:'',
    emisor:campo(cert.issuer,'O')||campo(cert.issuer,'CN'),desde:cert.validity.notBefore,hasta:cert.validity.notAfter,
    vigente:ahora>=cert.validity.notBefore&&ahora<=cert.validity.notAfter}
}
// Agrega el campo de firma y firma el PDF (CMS detached sobre el /ByteRange)
async function firmarPdf(gen,cred,info){
  const L=PDFLib,doc=gen.doc,ctx=doc.context,F=gen.fuentes
  const pages=doc.getPages()
  // Sello visible sobre la línea de firma de EL PRESTADOR (primera línea de firma del documento)
  const pos=gen.firmas[0]||{page:pages[pages.length-1],x:56.7,y:140,w:200,h:20}
  const fecha=new Date()
  const fh=fecha.toLocaleString('es-EC',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})
  // Sello con código QR de la firma (estilo firma electrónica): el QR contiene quién firmó,
  // la fecha, el motivo y la dirección para validar el contrato.
  // Contenido breve para que el QR (≈2 cm) se lea bien con cualquier teléfono
  const qrTxt='FIRMADO POR: '+cred.nombre+'\nRAZON: '+(info.codigo?'Contrato '+info.codigo:(info.motivo||'Firma del contrato'))
    +'\nFECHA: '+fecha.toISOString().slice(0,16).replace('T',' ')+' UTC'+(info.url?'\nVALIDAR EN: '+info.url:'')
  const qrImg=await doc.embedPng(Uint8Array.from(atob(await qrPngB64(qrTxt,'L')),c=>c.charCodeAt(0)))
  const sx=pos.x+6,sw=pos.w-12,sh=58,sy=pos.y+pos.h+3,qs=sh-6
  const tx=sx+qs+9,tw=sw-qs-14
  // Nombre en una o dos líneas según el ancho disponible
  const partirNombre=function(nom,font,size){
    const ws=_txtPdf(font,nom).split(' '),out=[''];
    ws.forEach(function(w){const t=(out[out.length-1]+' '+w).trim();if(font.widthOfTextAtSize(t,size)<=tw||!out[out.length-1])out[out.length-1]=t;else out.push(w)})
    return out.slice(0,2)
  }
  const nom=partirNombre(cred.nombre,F.bold,8.5)
  const lineas=[['Firmado electrónicamente por:',F.reg,6.3,8.5]].concat(nom.map(n=>[n,F.bold,8.5,10]))
    .concat([[(info.codigo?'Contrato '+info.codigo+' · ':'')+fh,F.reg,6,8],['Validar escaneando el QR o en la página de verificación',F.reg,5.5,7]])
  pos.page.drawRectangle({x:sx,y:sy,width:sw,height:sh,color:hexRgb('FFFFFF'),borderColor:hexRgb('B8894A'),borderWidth:0.9})
  pos.page.drawRectangle({x:sx,y:sy,width:qs+6,height:sh,color:hexRgb('F5EBDC')})
  pos.page.drawImage(qrImg,{x:sx+3,y:sy+3,width:qs,height:qs})
  pos.page.drawLine({start:{x:sx+qs+6,y:sy+4},end:{x:sx+qs+6,y:sy+sh-4},thickness:0.6,color:hexRgb('B8894A')})
  const altoTxt=lineas.reduce((s,l)=>s+l[3],0)
  let ly=sy+(sh+altoTxt)/2-7
  lineas.forEach(function(l){
    let s=_txtPdf(l[1],l[0]);while(s.length>4&&l[1].widthOfTextAtSize(s,l[2])>tw)s=s.slice(0,-2)+'…'
    pos.page.drawText(s,{x:tx,y:ly,size:l[2],font:l[1],color:hexRgb(l[1]===F.bold?'0B2545':'334155')});ly-=l[3]
  })
  // Diccionario de firma con espacios reservados
  const RES=24000 // bytes reservados para la firma CMS
  const byteRange=L.PDFArray.withContext(ctx)
  byteRange.push(L.PDFNumber.of(0));byteRange.push(L.PDFName.of('**********'));byteRange.push(L.PDFName.of('**********'));byteRange.push(L.PDFName.of('**********'))
  const sig=ctx.obj({Type:'Sig',Filter:'Adobe.PPKLite',SubFilter:'adbe.pkcs7.detached',ByteRange:byteRange,
    Contents:L.PDFHexString.of('0'.repeat(RES*2)),Reason:L.PDFString.of(_txtPdf(F.reg,info.motivo||'Firma del contrato')),
    M:L.PDFString.fromDate(fecha),Name:L.PDFString.of(_txtPdf(F.reg,cred.nombre)),Location:L.PDFString.of(_txtPdf(F.reg,info.lugar||'Ecuador')),
    ContactInfo:L.PDFString.of(_txtPdf(F.reg,info.contacto||''))})
  const sigRef=ctx.register(sig)
  const widget=ctx.obj({Type:'Annot',Subtype:'Widget',FT:'Sig',Rect:[sx,sy,sx+sw,sy+sh],V:sigRef,T:L.PDFString.of('Firma_Prestador'),F:4,P:pos.page.ref})
  const wRef=ctx.register(widget)
  pos.page.node.set(L.PDFName.of('Annots'),ctx.obj([wRef]))
  doc.catalog.set(L.PDFName.of('AcroForm'),ctx.obj({SigFlags:3,Fields:[wRef]}))
  const u8=await doc.save({useObjectStreams:false})
  // Ubicar los espacios reservados
  const txt=bytesToLatin1(u8)
  const reBR=/\/ByteRange\s*\[\s*0\s+\/\*{10}\s+\/\*{10}\s+\/\*{10}\s*\]/
  const mBR=reBR.exec(txt);if(!mBR)throw new Error('No se pudo preparar la firma (ByteRange)')
  const iC=txt.indexOf('/Contents <'+'0'.repeat(32),mBR.index-RES*2-200);const ini=txt.indexOf('<',iC>-1?iC:txt.indexOf('/Contents <'))
  const fin=ini+1+RES*2+1
  if(txt[fin-1]!=='>')throw new Error('No se pudo preparar la firma (Contents)')
  const br='/ByteRange ['+[0,ini,fin,u8.length-fin].join(' ')+']'
  if(br.length>mBR[0].length)throw new Error('ByteRange demasiado largo')
  const brFinal=br.slice(0,-1)+' '.repeat(mBR[0].length-br.length)+']'
  for(let k=0;k<brFinal.length;k++)u8[mBR.index+k]=brFinal.charCodeAt(k)
  // CMS (PKCS#7) detached con SHA-256
  const contenido=new Uint8Array(ini+(u8.length-fin));contenido.set(u8.subarray(0,ini),0);contenido.set(u8.subarray(fin),ini)
  const p7=forge.pkcs7.createSignedData()
  p7.content=forge.util.createBuffer(bytesToLatin1(contenido))
  cred.cadena.forEach(c=>p7.addCertificate(c))
  p7.addSigner({key:cred.llave,certificate:cred.cert,digestAlgorithm:forge.pki.oids.sha256,
    authenticatedAttributes:[{type:forge.pki.oids.contentType,value:forge.pki.oids.data},{type:forge.pki.oids.messageDigest},{type:forge.pki.oids.signingTime,value:fecha}]})
  p7.sign({detached:true})
  const hex=forge.util.bytesToHex(forge.asn1.toDer(p7.toAsn1()).getBytes())
  if(hex.length>RES*2)throw new Error('La firma no cabe en el espacio reservado')
  const hexFull=hex+'0'.repeat(RES*2-hex.length)
  for(let k=0;k<hexFull.length;k++)u8[ini+1+k]=hexFull.charCodeAt(k)
  return u8
}

// ════════════════════════════════════════════════════════════════
// AUTORES DEL ARTÍCULO Y FORMA DE COBRO
// Un trabajo puede tener uno o varios autores (Trabajos.autores, JSON).
// • "responsable": cobra todo al autor encargado / de correspondencia (titular del trabajo).
// • "porAutor": cada cuota del plan se divide entre los autores según su porcentaje
//   (las cuotas de un mismo hito comparten el campo "grupo").
// Las cuotas que ya tienen pagos o facturas nunca se modifican.
// ════════════════════════════════════════════════════════════════
const ROL_AUTOR={correspondencia:'Encargado / correspondencia',coautor:'Coautor'}
function autoresDe(t){
  let a=[];try{a=JSON.parse(t&&t.autores||'[]')||[]}catch(e){}
  if(!Array.isArray(a))a=[]
  if(!a.length&&t&&t.clienteId){const cl=data.clientes.find(c=>c.id===t.clienteId);a=[{id:'a0',clienteId:t.clienteId,nombre:cl?cl.nombre:(t.clienteNombre||''),rol:'correspondencia',pct:100}]}
  // Nombre de cada autor: el de su ficha de cliente; si no lo tiene, el que quedó en sus cuotas
  return a.map(function(x){
    if(x.nombre&&data.clientes.some(c=>c.id===x.clienteId))return x
    const cl=data.clientes.find(c=>c.id===x.clienteId),cq=data.cuotas.find(c=>c.clienteId===x.clienteId&&(c.clienteNombre||/ — /.test(c.label||'')))
    const nom=cl&&cl.nombre||x.nombre||(cq&&(cq.clienteNombre||String(cq.label).split(' — ').pop()))||''
    return nom===x.nombre?x:Object.assign({},x,{nombre:nom})
  })
}
const modoCobroDe=t=>t&&t.modoCobro==='porAutor'?'porAutor':'responsable'
// Quién paga una cuota: el autor de esa parte (cuotas divididas) o el titular del trabajo
function pagadorIdDe(c,t){t=t||data.trabajos.find(x=>x.id===c.trabajoId);if(c.grupo&&c.clienteId)return c.clienteId;return t?t.clienteId:(c.clienteId||'')}
const pagadorDe=(c,t)=>data.clientes.find(x=>x.id===pagadorIdDe(c,t))||null
const esDelCliente=(t,cid)=>!!t&&(t.clienteId===cid||autoresDe(t).some(a=>a.clienteId===cid))
const facturasDeAbono=id=>(data.facturas||[]).filter(f=>f.abonoId===id&&f.estado!=='ANULADA')
const facturasDeCuota=id=>(data.facturas||[]).filter(f=>f.cuotaId===id&&f.estado!=='ANULADA')
// ORCID: 0000-0000-0000-000X (dígito de control ISO 7064 11,2). Acepta también la dirección https://orcid.org/...
function normalizarOrcid(s){
  const m=String(s||'').trim().toUpperCase().replace(/^HTTPS?:\/\/(WWW\.)?ORCID\.ORG\//,'').replace(/[^0-9X]/g,'')
  return m.length===16?m.slice(0,4)+'-'+m.slice(4,8)+'-'+m.slice(8,12)+'-'+m.slice(12):String(s||'').trim()
}
function orcidValido(s){
  const o=normalizarOrcid(s);if(!/^\d{4}-\d{4}-\d{4}-\d{3}[\dX]$/.test(o))return false
  const d=o.replace(/-/g,'');let t=0;for(let i=0;i<15;i++)t=(t+(+d[i]))*2
  const r=(12-t%11)%11;return d[15]===(r===10?'X':String(r))
}
const orcidLink=o=>o?'<a href="https://orcid.org/'+esc(o)+'" target="_blank" rel="noopener" title="ORCID" style="color:#A6CE39;font-weight:700;text-decoration:none">iD</a>':''
// Valor que le corresponde a cada autor sobre el total del trabajo (por valor fijo o por porcentaje)
function montoAutor(a,total){if(a&&a.exento)return 0;return a.tipo==='valor'?r2(parseFloat(a.monto)||0):r2((parseFloat(total)||0)*(parseFloat(a.pct)||0)/100)}
// Cuotas de un autor: 'plan' = las mismas cuotas del plan del trabajo; un número = sus propias cuotas mensuales
const cuotasAutorTxt=a=>a.exento?'no paga (concesión)':!a.cuotas||a.cuotas==='plan'?'según el plan':(+a.cuotas===1?'1 cuota':a.cuotas+' cuotas')
function htmlAutoresResumen(t){
  const au=autoresDe(t),modo=modoCobroDe(t)
  return'<div style="border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:12px;background:#fff">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">'
    +'<strong style="font-size:12px;color:var(--navy)">👥 Autores ('+au.length+') · '+(modo==='porAutor'?'Cobro por autor':'Cobro al autor encargado')+'</strong>'
    +'<button class="btn btn-g btn-sm" onclick="abrirAutores(\''+t.id+'\')">✏️ Autores y forma de cobro</button></div>'
    +(autoresPendientes(t).length?'<div style="font-size:11.5px;color:#92400e;background:var(--amber-bg);border:1px solid #fde68a;border-radius:8px;padding:6px 10px;margin-bottom:6px">Coautores escritos en los detalles que aún no están registrados: <strong>'+autoresPendientes(t).map(esc).join(', ')+'</strong> · <a href="#" onclick="event.preventDefault();abrirAutores(\''+t.id+'\')">Registrarlos como autores y clientes</a></div>':'')
    +(cuotasConPagadorDistinto(t).length?'<div style="font-size:11.5px;color:#92400e;background:var(--amber-bg);border:1px solid #fde68a;border-radius:8px;padding:6px 10px;margin-bottom:6px">'+cuotasConPagadorDistinto(t).length+' cuota(s) tienen el nombre de un autor pero están asignadas a otro (por ejemplo "'+esc(cuotasConPagadorDistinto(t)[0].c.label)+'" figura a nombre de '+esc(cuotasConPagadorDistinto(t)[0].actual)+'). <a href="#" onclick="event.preventDefault();repararPagadores(\''+t.id+'\')">Corregir</a></div>':'')
    +htmlTablaAutores(t)+'</div>'
}
// Nombres escritos en el campo de texto "Autores / coautores" de los detalles del trabajo
const _normNom=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9ñ ]/g,' ').replace(/\s+/g,' ').trim()
function nombresAutoresTexto(t){
  const txt=String(detallesDe(t).autores||'')
  return txt.split(/\s*(?:;|\n|,|\s+y\s+|\s+&\s+|\/)\s*/).map(x=>x.replace(/^\d+[.)-]\s*/,'').trim()).filter(x=>x.length>2)
}
// Coautores escritos como texto que todavía no están registrados como autores del trabajo
function autoresPendientes(t){
  const ya=new Set(autoresDe(t).map(a=>_normNom(a.nombre)))
  const vistos=new Set()
  return nombresAutoresTexto(t).filter(n=>{const k=_normNom(n);if(!k||ya.has(k)||vistos.has(k))return false;vistos.add(k);return true})
}
const clientePorNombre=n=>{const k=_normNom(n);return data.clientes.find(c=>_normNom(c.nombre)===k)||null}
const faltaCliente=r=>!r.clienteId||!data.clientes.some(c=>c.id===r.clienteId)
// Autores registrados en trabajos cuyo cliente no existe en la base (p. ej. si su registro no llegó a guardarse)
function autoresSinCliente(){
  const ids=new Set(data.clientes.map(c=>c.id)),out={}
  data.trabajos.forEach(t=>{if(!t.autores)return
    autoresDe(t).forEach(a=>{if(!a.clienteId||ids.has(a.clienteId)||out[a.clienteId])return
      out[a.clienteId]={id:a.clienteId,nombre:a.nombre||'',orcid:a.orcid||'',trabajo:t.titulo}})})
  return Object.values(out)
}
async function repararAutoresClientes(){
  const fs=autoresSinCliente(),con=fs.filter(x=>x.nombre),sin=fs.length-con.length
  if(!con.length){alert('No hay coautores que se puedan registrar automáticamente'+(sin?' ('+sin+' sin nombre: ábrelos desde el trabajo, en Autores y forma de cobro).':'.'));return}
  if(!confirm('Se registrarán '+con.length+' coautor(es) en la base de clientes:\n\n'+con.map(x=>'• '+x.nombre).join('\n')+'\n\nLuego puedes completar su cédula, correo y teléfono en Clientes.'))return
  syncMsg='Registrando coautores...';syncErr=false;draw()
  const rs=[]
  for(const x of con){const cli={id:x.id,nombre:x.nombre,cedula:'',telefono:'',email:'',orcid:x.orcid,direccion:'',institucion:'',ciudad:'',area:'',notas:'Coautor de: '+String(x.trabajo||'').slice(0,80),createdAt:new Date().toISOString()}
    rs.push(await apiPost({action:'insertar',tabla:'Clientes',fila:cli}));data.clientes=data.clientes.concat([cli])}
  finSync(rs,con.length+' coautor(es) registrados en Clientes ✓')
}
function htmlAvisoAutoresSinCliente(){
  const fs=autoresSinCliente();if(!fs.length)return''
  return'<div class="alert-venc" style="background:var(--amber-bg);border-color:#fde68a;color:#92400e">👥 <strong>'+fs.length+' coautor'+(fs.length>1?'es':'')+' de tus trabajos no está'+(fs.length>1?'n':'')+' en la base de clientes'+(fs.some(x=>x.nombre)?': '+fs.filter(x=>x.nombre).slice(0,6).map(x=>esc(x.nombre)).join(', ')+(fs.length>6?'…':''):'')+'</strong>'
    +'<button class="btn btn-gold btn-sm" onclick="repararAutoresClientes()">Registrarlos como clientes</button></div>'

// Tabla con los datos de cada autor: identificación, contacto, ORCID, valor, forma de pago, pagado y saldo
function htmlTablaAutores(t){
  const filas=resumenPorAutor(t),modo=modoCobroDe(t),fir=new Set(firmantesDe(t).map(x=>x.id))

        +'<td>'+(a.orcid?'<a href="https://orcid.org/'+esc(a.orcid)+'" target="_blank" rel="noopener" style="font-family:monospace;font-size:11px">'+esc(a.orcid)+'</a>':'—')+'</td>'
        +(modo==='porAutor'?'<td style="text-align:right;white-space:nowrap">'+(a.exento?'<span class="b bv" title="'+esc(a.motivoExento||'')+'">Concesión</span>':fmtUSD(x.acordado>0?x.acordado:montoAutor(a,t.total))+'<div style="font-size:10.5px;color:var(--text3)">'+fmt(parseFloat(a.pct)||0)+' %</div>')+'</td><td style="font-size:11.5px">'+(!a.cuotas||a.cuotas==='plan'?'Según el plan'+(x.cuotas?' ('+x.cuotas+' cuota'+(x.cuotas>1?'s':'')+')':''):esc(cuotasAutorTxt(a)))+'</td>':'')
        +'<td style="text-align:right;color:var(--green);font-weight:700">'+fmtUSD(x.pagado)+'</td><td style="text-align:right;font-weight:700;color:'+(x.saldo>0?'#b45309':'var(--green)')+'">'+fmtUSD(x.saldo)+'</td>'

    +'</tbody></table></div>'
}
// Cuotas cuyo nombre indica un autor distinto del que figura como pagador (p. ej. tras editarlas en versiones anteriores)
function cuotasConPagadorDistinto(t){
  const au=autoresDe(t);if(au.length<2)return[]
  return data.cuotas.filter(c=>c.trabajoId===t.id).map(function(c){
    const m=/ — ([^—]+)$/.exec(c.label||'');if(!m)return null
    const a=au.find(x=>x.nombre&&x.nombre.trim()===m[1].trim());if(!a||!a.clienteId)return null
    const pid=pagadorIdDe(c,t);return pid!==a.clienteId?{c:c,autor:a,actual:(data.clientes.find(x=>x.id===pid)||{}).nombre||'—'}:null
  }).filter(Boolean)
}
async function repararPagadores(tid){
  const t=data.trabajos.find(x=>x.id===tid);if(!t)return
  const ls=cuotasConPagadorDistinto(t);if(!ls.length)return
  if(!confirm('Se corregirá a quién le corresponde cada cuota según su nombre:\n\n'+ls.map(x=>'• '+x.c.label+': '+x.actual+' → '+x.autor.nombre).join('\n')+'\n\n¿Continuar?'))return
  const rs=[]
  for(const x of ls){const upd={clienteId:x.autor.clienteId,clienteNombre:x.autor.nombre,grupo:x.c.grupo||('au_'+x.autor.id)}
    data.cuotas=data.cuotas.map(c=>c.id===x.c.id?Object.assign({},c,upd):c)
    rs.push(await apiPost({action:'actualizar',tabla:'Cuotas',id:x.c.id,fila:upd}))}
  finSync(rs,ls.length+' cuota(s) corregida(s) ✓')
}
function abrirAutores(tid,op){
  const t=data.trabajos.find(x=>x.id===tid);if(!t)return
  const rows=autoresDe(t).map(function(a){
    const cl=data.clientes.find(c=>c.id===a.clienteId)
    return Object.assign({nuevo:{},tipo:'pct',cuotas:'plan',orcid:cl&&cl.orcid||''},a,{orcid:a.orcid||(cl&&cl.orcid)||''})
  })
  // Los coautores escritos en los detalles se agregan como filas: si ya existen como clientes se enlazan,
  // si no, se registran como clientes nuevos al guardar
  autoresPendientes(t).forEach(function(n){
    const cl=clientePorNombre(n)
    if(cl&&rows.some(r=>r.clienteId===cl.id))return
    rows.push({id:uid(),clienteId:cl?cl.id:'',nombre:cl?cl.nombre:n,rol:'coautor',pct:0,monto:0,tipo:'pct',cuotas:'plan',orcid:cl&&cl.orcid||'',nuevo:cl?{}:{nombre:n}})
  })
  // Filas vacías para los coautores que faltan (p. ej. al aceptar un artículo de 3 autores)
  for(let k=0;op&&k<(op.vacias||0);k++)rows.push({id:uid(),clienteId:'',nombre:'',rol:'coautor',pct:0,monto:0,tipo:'pct',cuotas:'plan',orcid:'',nuevo:{}})
  openModal('autores',Object.assign({trabajoId:tid,modo:modoCobroDe(t),_rows:rows},op||{}))
}
// Guarda los cambios del formulario del trabajo y abre la pantalla de autores

// Panel de autores dentro del formulario de edición del trabajo
function htmlAutoresEnEdicion(d){

  return'<div style="margin-top:12px;padding:12px 13px;background:#FFFDF8;border-radius:10px;border:1px solid var(--border)">'

      +(a.rol==='correspondencia'?'✉️ ':'')+esc(a.nombre||'—')+(a.orcid?' '+orcidLink(a.orcid):'')+'</span>').join('')+'</div>'
    +(pend.length?'<div style="font-size:11.5px;color:#92400e;margin-top:8px">Escritos en "Autores / coautores" y aún sin registrar: <strong>'+pend.map(esc).join(', ')+'</strong>. Pulsa <em>Guardar y editar autores</em> para registrarlos como autores y como clientes.</div>':'')

}

    +'<label class="chk" style="margin-top:6px"><input type="radio" name="au_modo" value="porAutor"'+(porAutor?' checked':'')+' onchange="_autLeer();modal.rec.modo=this.value;if(modal.rec._rows.some(r=>!(montoAutor(r,'+total+')>0)))_autIguales();else _autDraw()"/> <strong>Cobro por autor:</strong> cada autor paga su parte (por porcentaje o por valor), en las cuotas del plan o en sus propias cuotas</label>'

    +'</div>'
    +'<div class="ma"><button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-p" id="au_btn" onclick="submitAutores()">Guardar</button></div>'

function _autDetalle(r,m){
  if(r.exento)return'No paga: su parte la cubren los demás autores. Sigue figurando como autor (y puede firmar el contrato).'
  if(!r.cuotas||r.cuotas==='plan')return'Paga '+fmtUSD(m)+' repartido en las cuotas del plan del trabajo.'
  const n=+r.cuotas,ps=repartirPesos(m,Array(n).fill(1))
  return'Paga '+fmtUSD(m)+(n>1?' en '+n+' cuotas mensuales de '+(ps[0]===ps[n-1]?fmtUSD(ps[0]):fmtUSD(ps[0])+' (la última '+fmtUSD(ps[n-1])+')'):' en un solo pago')+'.'
}
function _autSumaTxt(rows,total){
  const s=r2(rows.reduce((a,r)=>a+montoAutor(r,total),0)),ok=Math.abs(s-total)<0.01
  return'<span style="color:'+(ok?'var(--green)':'var(--red)')+'">Suma: '+fmtUSD(s)+' de '+fmtUSD(total)+(ok?' ✓':' · '+(s<total?'faltan '+fmtUSD(r2(total-s)):'sobran '+fmtUSD(r2(s-total))))+'</span>'
}
// Al escribir el % se calcula el valor y viceversa (sin redibujar, para no perder el foco)
function _autCalc(i,cual){
  const t=data.trabajos.find(x=>x.id===modal.rec.trabajoId),total=parseFloat(t&&t.total)||0,r=modal.rec._rows[i]
  const P=document.getElementById('au_pct_'+i),V=document.getElementById('au_val_'+i)
  if(cual==='pct'){r.tipo='pct';r.pct=parseFloat(P.value)||0;r.monto=montoAutor(r,total);V.value=r.monto.toFixed(2)}
  else{r.tipo='valor';r.monto=r2(parseFloat(V.value)||0);r.pct=total?Math.round(r.monto/total*1e6)/1e4:0;P.value=r2(r.pct)}
  const dt=document.getElementById('au_det_'+i);if(dt)dt.innerHTML=_autDetalle(r,montoAutor(r,total))
  const s=document.getElementById('au_suma');if(s)s.innerHTML=_autSumaTxt(modal.rec._rows,total)
}
function _autLeer(){
  if(!modal||modal.type!=='autores')return
  const t=data.trabajos.find(x=>x.id===modal.rec.trabajoId),total=parseFloat(t&&t.total)||0
  const rol=document.querySelector('input[name="au_rol"]:checked')
  modal.rec._rows.forEach(function(r,i){
    const s=document.getElementById('au_cl_'+i),antes=r.clienteId;if(s)r.clienteId=s.value
    const o=document.getElementById('au_orcid_'+i);if(o)r.orcid=o.value.trim()?normalizarOrcid(o.value):''
    // Al elegir otro cliente se trae su ORCID registrado
    if(r.clienteId&&r.clienteId!==antes){const c=data.clientes.find(x=>x.id===r.clienteId);r.orcid=c&&c.orcid||''}
    const P=document.getElementById('au_pct_'+i),V=document.getElementById('au_val_'+i)
    if(r.tipo==='valor'&&V){r.monto=r2(parseFloat(V.value)||0);r.pct=total?Math.round(r.monto/total*1e6)/1e4:0}
    else if(P){r.tipo='pct';r.pct=parseFloat(P.value)||0;r.monto=montoAutor(r,total)}
    const ex=document.getElementById('au_ex_'+i);if(ex)r.exento=ex.checked
    const exm=document.getElementById('au_exm_'+i);if(exm)r.motivoExento=exm.value.trim()
    const q=document.getElementById('au_cq_'+i);if(q)r.cuotas=q.value
    const f=document.getElementById('au_f1_'+i);if(f)r.primerPago=f.value
    r.rol=rol&&+rol.value===i?'correspondencia':'coautor'
    if(faltaCliente(r)){if(document.getElementById('au_n_'+i)){r.nuevo={nombre:v('au_n_'+i),cedula:v('au_c_'+i),email:v('au_e_'+i),telefono:v('au_t_'+i)};r.nombre=r.nuevo.nombre}}
    else{const cl=data.clientes.find(c=>c.id===r.clienteId);r.nombre=cl?cl.nombre:r.nombre}
  })
  const m=document.querySelector('input[name="au_modo"]:checked');if(m)modal.rec.modo=m.value
}
function _autAgregar(){_autLeer();modal.rec._rows.push({id:uid(),clienteId:'',nombre:'',rol:'coautor',pct:0,monto:0,tipo:'pct',cuotas:'plan',orcid:'',nuevo:{}});_autDraw()}
function _autQuitar(i){_autLeer();const r=modal.rec._rows.splice(i,1)[0];if(r&&r.rol==='correspondencia'&&modal.rec._rows[0])modal.rec._rows[0].rol='correspondencia';_autDraw()}
function _autIguales(){
  _autLeer();const rs=modal.rec._rows.filter(r=>!r.exento),n=rs.length;if(!n){_autDraw();return}
  const t=data.trabajos.find(x=>x.id===modal.rec.trabajoId),total=parseFloat(t&&t.total)||0
  // Con valor total: montos exactos (p. ej. 600 → 200 / 200 / 200); sin él, porcentajes
  if(total>0)repartirPesos(total,rs.map(()=>1)).forEach((m,i)=>{const r=rs[i];r.tipo='valor';r.monto=m;r.pct=Math.round(m/total*1e6)/1e4})
  else{const base=Math.floor(10000/n)/100;rs.forEach((r,i)=>{r.tipo='pct';r.pct=i===0?Math.round((100-base*(n-1))*100)/100:base})}
  _autDraw()
}
// Marcar o quitar la concesión: lo que dejaba de pagar se reparte por igual entre los demás
function _autExento(i,on){
  const r=modal.rec._rows[i];r.exento=on
  if(on){r.pct=0;r.monto=0;r.tipo='pct';if(!modal.rec._rows.some(x=>!x.exento)){alert('Al menos un autor debe pagar.');r.exento=false}}
  _autIguales()
}
// Reparte lo que falta para llegar al total entre los autores que todavía tienen 0
function _autResto(){
  _autLeer();const t=data.trabajos.find(x=>x.id===modal.rec.trabajoId),total=parseFloat(t&&t.total)||0,rs=modal.rec._rows
  const vacios=rs.filter(r=>!r.exento&&!(montoAutor(r,total)>0)),falta=r2(total-rs.reduce((s,r)=>s+montoAutor(r,total),0))
  if(!vacios.length||!(falta>0)){alert(vacios.length?'No falta nada por repartir.':'Todos los autores ya tienen un valor. Deja en 0 a quienes quieras repartirles lo que falta.');return}
  repartirPesos(falta,vacios.map(()=>1)).forEach((m,i)=>{const r=vacios[i];r.tipo='valor';r.monto=m;r.pct=total?Math.round(m/total*1e6)/1e4:0})
  _autDraw()
}
// Reparte un total según pesos (el último con peso absorbe el redondeo)
function repartirPesos(total,pesos){
  const w=pesos.map(p=>Math.max(0,parseFloat(p)||0)),s=w.reduce((a,p)=>a+p,0)
  let ult=-1;w.forEach((p,i)=>{if(p>0)ult=i});if(ult<0)ult=w.length-1
  let acum=0
  return w.map(function(p,i){if(i===ult)return 0;const x=s?r2(total*p/s):0;acum=r2(acum+x);return x}).map((x,i)=>i===ult?r2(total-acum):x)
}
// Montos por porcentaje (el último absorbe el redondeo)
function repartirPct(total,pcts){return repartirPesos(total,pcts)}
function _sumarMeses(f,n){if(!f)return'';const d=new Date(f+'T12:00:00');const dia=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const ult=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(dia,ult));return d.toISOString().slice(0,10)}
// Calcula cómo deben quedar las cuotas sin pagos según los autores y la forma de cobro.
// • Las cuotas del plan (hitos) mantienen sus fechas y su proporción.
// • En "porAutor" cada autor recibe lo que le falta de su parte (su valor menos lo que ya tiene en cuotas pagadas),
//   en las cuotas del plan o en sus propias cuotas (grupo "au_<id>").
function planCuotasAutores(t,autores,modo,titularId){
  const cuotas=data.cuotas.filter(c=>c.trabajoId===t.id)
  const libre=c=>realPaid(c)<=0&&!data.abonos.some(a=>a.cuotaId===c.id)&&!facturasDeCuota(c.id).length
  // Grupos que tienen alguna cuota con pagos o facturas (solo se usa para nombrar el "Saldo adicional").
  // Cada cuota se evalúa sola: que un autor ya haya pagado su parte de un hito no bloquea las de los demás.
  const bloqueados=new Set(cuotas.filter(c=>!libre(c)).map(c=>c.grupo||c.id))
  const libres=cuotas.filter(libre)
  const esPropia=c=>String(c.grupo||'').indexOf('au_')===0
  const totalLibre=r2(libres.reduce((s,c)=>s+(parseFloat(c.acordado)||0),0))
  const base=c=>c.grupo?String(c.label||'Cuota').replace(/ — [^—]*$/,''):(c.label||'Cuota')
  // Hitos del plan (las cuotas propias de un autor no forman parte del plan)
  const grupos={},orden=[]
  libres.filter(c=>!esPropia(c)).forEach(c=>{const g=c.grupo||c.id;if(!grupos[g]){grupos[g]=[];orden.push(g)}grupos[g].push(c)})
  let hitos=orden.map(g=>{const cs=grupos[g],c0=cs[0];return{peso:r2(cs.reduce((s,c)=>s+(parseFloat(c.acordado)||0),0)),label:base(c0),fecha:c0.fechaVencimiento||'',hitoEtapa:c0.hitoEtapa||'',grupo:c0.grupo&&!esPropia(c0)?c0.grupo:''}})
  if(!hitos.length){  // solo hay cuotas propias: se arma un plan con sus fechas
    const porFecha={};libres.forEach(c=>{const f=c.fechaVencimiento||'';porFecha[f]=r2((porFecha[f]||0)+(parseFloat(c.acordado)||0))})
    hitos=Object.keys(porFecha).sort().map((f,i)=>({peso:porFecha[f],label:'Cuota '+(i+1),fecha:f,hitoEtapa:'',grupo:''}))
  }
  const comun=h=>({trabajoId:t.id,trabajoTitulo:t.titulo,fechaVencimiento:h.fecha,pagado:0,estado:'pendiente',hitoEtapa:h.hitoEtapa||''})
  const cl=data.clientes.find(c=>c.id===titularId),nuevas=[]
  if(totalLibre>0&&hitos.length){
    const montosHito=total=>repartirPesos(total,hitos.map(h=>h.peso||1))
    if(modo==='porAutor'){
      // Lo que cada autor ya tiene en cuotas pagadas o facturadas se descuenta de su parte
      const yaTiene=a=>r2(cuotas.filter(c=>!libre(c)).filter(c=>pagadorIdDe(c,t)===a.clienteId).reduce((s,c)=>s+(parseFloat(c.acordado)||0),0))
      const pend=autores.map(a=>Math.max(0,r2((montoAutor(a,t.total)||0)-yaTiene(a))))
      const partes=repartirPesos(totalLibre,pend.some(x=>x>0)?pend:autores.map(a=>a.exento?0:(montoAutor(a,t.total)||1)))
      const enPlan=autores.map((a,i)=>({a:a,m:partes[i]})).filter(x=>!x.a.cuotas||x.a.cuotas==='plan')
      const pool=r2(enPlan.reduce((s,x)=>s+x.m,0))
      if(enPlan.length&&pool>0)montosHito(pool).forEach(function(mh,j){
        const h=hitos[j],gid=h.grupo||('g'+uid())
        repartirPesos(mh,enPlan.map(x=>x.m)).forEach((m,k)=>{const a=enPlan[k].a;if(m>0)nuevas.push(Object.assign({id:uid(),clienteId:a.clienteId,clienteNombre:a.nombre,label:h.label+' — '+a.nombre,acordado:m,grupo:gid},comun(h)))})
      })
      autores.forEach(function(a,i){
        if(!a.cuotas||a.cuotas==='plan'||!(partes[i]>0))return
        const n=Math.max(1,parseInt(a.cuotas)||1),f1=a.primerPago||hitos[0].fecha||new Date().toISOString().slice(0,10)
        // Si el autor ya tiene cuotas propias con pagos, lo que le falta va como "Saldo adicional" en un grupo aparte
        const conPagos=bloqueados.has('au_'+a.id),gid=conPagos?'au_'+a.id+'_'+uid():'au_'+a.id
        repartirPesos(partes[i],Array(n).fill(1)).forEach((m,k)=>nuevas.push(Object.assign({id:uid(),clienteId:a.clienteId,clienteNombre:a.nombre,
          label:(conPagos?'Saldo adicional'+(n>1?' '+(k+1)+'/'+n:''):(n>1?'Cuota '+(k+1)+'/'+n:'Pago único'))+' — '+a.nombre,acordado:m,grupo:gid},comun({fecha:_sumarMeses(f1,k),hitoEtapa:''}))))
      })
    }else{
      montosHito(totalLibre).forEach((m,j)=>{const h=hitos[j];nuevas.push(Object.assign({id:uid(),clienteId:titularId,clienteNombre:cl?cl.nombre:'',label:h.label,acordado:m,grupo:''},comun(h)))})
    }
  }
  // Si el resultado es igual a lo que ya existe, no se cambia nada
  const firma=c=>[c.clienteId||'',r2(c.acordado).toFixed(2),c.label||'',c.fechaVencimiento||''].join('|')
  const antes=libres.map(firma).sort().join('¦'),despues=nuevas.map(firma).sort().join('¦')
  if(antes===despues)return{crear:[],eliminar:[],bloqueadas:cuotas.filter(c=>!libre(c)).length}
  return{crear:nuevas,eliminar:libres.map(c=>c.id),bloqueadas:cuotas.filter(c=>!libre(c)).length}
}
async function submitAutores(){
  _autLeer()
  const d=modal.rec,t=data.trabajos.find(x=>x.id===d.trabajoId);if(!t)return

  }

}

const _xT=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\r/g,'&#xD;')

// Firma XAdES-BES (SRI): RSA-SHA1, ENVELOPED, C14N inclusiva.
// Las tres referencias (comprobante, SignedProperties y KeyInfo) se calculan sobre su forma
// canónica: por eso el XML se arma ya canónico y en los digest se declaran los namespaces heredados.
async function firmarXadesSRI(xmlComprobante,cred){
  await cargarLib(LIB_FORGE,'forge')
  const NS='xmlns:ds="http://www.w3.org/2000/09/xmldsig#" xmlns:etsi="http://uri.etsi.org/01903/v1.3.2#"'
  const sha1=s=>{const m=forge.md.sha1.create();m.update(s,'utf8');return forge.util.encode64(m.digest().getBytes())}
  const b64Hex=h=>forge.util.encode64(forge.util.hexToBytes(h.length%2?'0'+h:h))
  const certDer=forge.asn1.toDer(forge.pki.certificateToAsn1(cred.cert)).getBytes()
  const certB64=forge.util.encode64(certDer)
  const certDigest=forge.util.encode64(forge.md.sha1.create().update(certDer).digest().getBytes())
  const issuer=cred.cert.issuer.attributes.slice().reverse().map(a=>(a.shortName||a.name||('OID.'+a.type))+'='+a.value).join(',')
  const serial=BigInt('0x'+cred.cert.serialNumber).toString(10)
  const n=String(Math.floor(Math.random()*900000)+100000),sigId='Signature'+n
  const tz=-5,ahora=new Date(Date.now()+tz*3600e3).toISOString().slice(0,19)+'-05:00'
  const signedProps='<etsi:SignedProperties Id="'+sigId+'-SignedProperties'+n+'"><etsi:SignedSignatureProperties><etsi:SigningTime>'+ahora+'</etsi:SigningTime>'
    +'<etsi:SigningCertificate><etsi:Cert><etsi:CertDigest><ds:DigestMethod Algorithm="http://www.w3.org/2000/09/xmldsig#sha1"></ds:DigestMethod>'
    +'<ds:DigestValue>'+certDigest+'</ds:DigestValue></etsi:CertDigest><etsi:IssuerSerial><ds:X509IssuerName>'+_xT(issuer)+'</ds:X509IssuerName>'
    +'<ds:X509SerialNumber>'+serial+'</ds:X509SerialNumber></etsi:IssuerSerial></etsi:Cert></etsi:SigningCertificate></etsi:SignedSignatureProperties>'
    +'<etsi:SignedDataObjectProperties><etsi:DataObjectFormat ObjectReference="#Reference-ID-'+n+'"><etsi:Description>contenido comprobante</etsi:Description>'
    +'<etsi:MimeType>text/xml</etsi:MimeType></etsi:DataObjectFormat></etsi:SignedDataObjectProperties></etsi:SignedProperties>'
  const keyInfo='<ds:KeyInfo Id="Certificate'+n+'"><ds:X509Data><ds:X509Certificate>'+certB64+'</ds:X509Certificate></ds:X509Data>'
    +'<ds:KeyValue><ds:RSAKeyValue><ds:Modulus>'+b64Hex(cred.cert.publicKey.n.toString(16))+'</ds:Modulus><ds:Exponent>'+b64Hex(cred.cert.publicKey.e.toString(16))+'</ds:Exponent></ds:RSAKeyValue></ds:KeyValue></ds:KeyInfo>'
  const dm='<ds:DigestMethod Algorithm="http://www.w3.org/2000/09/xmldsig#sha1"></ds:DigestMethod>'
  const signedInfo='<ds:SignedInfo Id="Signature-SignedInfo'+n+'"><ds:CanonicalizationMethod Algorithm="http://www.w3.org/TR/2001/REC-xml-c14n-20010315"></ds:CanonicalizationMethod>'
    +'<ds:SignatureMethod Algorithm="http://www.w3.org/2000/09/xmldsig#rsa-sha1"></ds:SignatureMethod>'
    +'<ds:Reference Id="SignedPropertiesID'+n+'" Type="http://uri.etsi.org/01903#SignedProperties" URI="#'+sigId+'-SignedProperties'+n+'">'+dm
    +'<ds:DigestValue>'+sha1(signedProps.replace('<etsi:SignedProperties','<etsi:SignedProperties '+NS))+'</ds:DigestValue></ds:Reference>'
    +'<ds:Reference URI="#Certificate'+n+'">'+dm+'<ds:DigestValue>'+sha1(keyInfo.replace('<ds:KeyInfo','<ds:KeyInfo '+NS))+'</ds:DigestValue></ds:Reference>'
    +'<ds:Reference Id="Reference-ID-'+n+'" URI="#comprobante"><ds:Transforms><ds:Transform Algorithm="http://www.w3.org/2000/09/xmldsig#enveloped-signature"></ds:Transform></ds:Transforms>'
    +dm+'<ds:DigestValue>'+sha1(xmlComprobante)+'</ds:DigestValue></ds:Reference></ds:SignedInfo>'
  const md=forge.md.sha1.create();md.update(signedInfo.replace('<ds:SignedInfo','<ds:SignedInfo '+NS),'utf8')
  const firma=forge.util.encode64(cred.llave.sign(md))
  const sig='<ds:Signature '+NS+' Id="'+sigId+'">'+signedInfo+'<ds:SignatureValue Id="SignatureValue'+n+'">'+firma+'</ds:SignatureValue>'+keyInfo
    +'<ds:Object Id="'+sigId+'-Object'+n+'"><etsi:QualifyingProperties Target="#'+sigId+'">'+signedProps+'</etsi:QualifyingProperties></ds:Object></ds:Signature>'
  return'<?xml version="1.0" encoding="UTF-8"?>'+xmlComprobante.replace(/<\/factura>$/,sig+'</factura>')
}

async function emitirFacturaUI(){
  _factLeer()
  const r=modal.rec,cfg=cfgFactura(),calc=calcularFactura(r._items,r.conIva)
  const arch=_p12Actual(),clave=v('p12_clave'),mail=document.getElementById('fc_mail'),rec=document.getElementById('p12_rec')
  if(!factGuardada()||!cfg.ruc||!cfg.razonSocial||!cfg.dirMatriz){alert('Primero revisa y guarda tus datos de emisor en Configuración → Facturación electrónica.');return}
  if(!/^\d{13}$/.test(cfg.rucProveedor||'')){alert('Falta el RUC del proveedor del sistema de facturación (obligatorio desde el 26/09/2026). Escríbelo en Configuración → Facturación electrónica.');return}
  if(!r.compradorId||!r.compradorNombre){alert('Completa la identificación y el nombre del cliente.');return}
  if(r.compradorTipoId==='05'&&!cedulaValida(r.compradorId)){alert('La cédula del cliente no es válida.');return}
  if(r.compradorTipoId==='04'&&!/^\d{13}$/.test(r.compradorId)){alert('El RUC del cliente debe tener 13 dígitos.');return}
  if(r.compradorTipoId==='07'&&calc.total>50){alert('A consumidor final solo se puede facturar hasta $50.');return}
  if(r._items.some(it=>!String(it.d||'').trim()||!(parseFloat(it.v)>0)||!(parseFloat(it.c)>0))){alert('Cada línea necesita descripción, cantidad y valor.');return}
  if(!(calc.total>0)){alert('El total debe ser mayor a cero.');return}
  if(!arch){alert('Elige tu archivo de firma electrónica (.p12).');return}
  if(!clave){alert('Escribe la clave de tu certificado.');return}
  const btn=document.getElementById('fc_btn'),paso=t=>{if(btn)btn.innerHTML='<span class="spin">⟳</span> '+t},reset=()=>{if(btn){btn.disabled=false;btn.textContent='🧾 Firmar y enviar al SRI'}}
  if(btn)btn.disabled=true;paso('Abriendo certificado…')
  let cred;try{cred=await leerP12(arch.bytes,clave)}catch(e){reset();alert(e.message);return}
  if(!cred.vigente){reset();alert('Tu certificado no está vigente.');return}
  if(cfg.ruc.slice(0,10)!==String(cred.cedula||'').slice(0,10)&&!confirm('El certificado ('+cred.nombre+(cred.cedula?' · '+cred.cedula:'')+') no parece corresponder al RUC emisor '+cfg.ruc+'. El SRI rechazará la factura si la firma no es del titular o su representante.\n\n¿Continuar de todas formas?')){reset();return}
  if(rec&&rec.checked){try{localStorage.setItem(P12_KEY,JSON.stringify({nombre:arch.nombre,b64:bytesToB64(arch.bytes)}))}catch(e){}}
  const datos={clienteId:r.clienteId||'',trabajoId:r.trabajoId||'',cuotaId:r.cuotaId||'',abonoId:r.abonoId||'',
    compradorTipoId:r.compradorTipoId,compradorId:String(r.compradorId).trim(),compradorNombre:_limpiaTxt(r.compradorNombre),compradorDireccion:_limpiaTxt(r.compradorDireccion),
    compradorEmail:String(r.compradorEmail||'').trim(),compradorTelefono:r.compradorTelefono||'',formaPago:r.formaPago||'20',conIva:!!r.conIva,nota:r.nota||'',
    items:r._items.map(it=>({codigo:_limpiaTxt(it.codigo||'',25),d:_limpiaTxt(it.d),c:parseFloat(it.c)||1,v:parseFloat(it.v)||0,iva:it.iva||'0'})),calc:calc,subtotal:calc.subtotal,iva:calc.iva,total:calc.total,
    infoAdicional:[{n:'Email',v:r.compradorEmail},{n:'Teléfono',v:r.compradorTelefono},{n:'Detalle',v:r.nota},{n:'RUC Proveedor',v:cfg.rucProveedor}]}
  try{
    paso('Reservando número…')
    const p=await apiPost({action:'prepararFactura',id:r.facturaId||'',datos:datos})
    if(!p||!p.ok)throw new Error(p&&p.error||'Sin respuesta del servidor')
    const f=Object.assign({},p.factura,{datos:datos})
    paso('Firmando '+f.numero+'…')
    const xml=await firmarXadesSRI(xmlFactura(f,cfg),cred)
    paso('Enviando al SRI…')
    const e=await apiPost({action:'enviarFactura',id:f.id,xml:xml})
    if(!e||!e.ok)throw new Error(e&&e.error||'Sin respuesta del servidor')
    if(e.estado==='AUTORIZADO'){
      paso('Generando RIDE…')
      const fa=Object.assign({},f,{estado:'AUTORIZADO',numeroAutorizacion:e.numeroAutorizacion,fechaAutorizacion:e.fechaAutorizacion})
      const pdf=await generarRide(fa,cfg)
      const g=await apiPost({action:'guardarRide',id:f.id,base64:bytesToB64(pdf),enviar:!!(mail&&mail.checked)})
      reset();modal=null
      toast('Factura '+f.numero+' autorizada ✓'+(g&&g.emailEnviado?' · enviada al cliente':''))
      descargarBytes(pdf,'Factura_'+f.numero+'.pdf','application/pdf')
    }else{
      reset()
      alert((e.estado==='EN PROCESO'?'⏳ ':'❌ ')+'Factura '+e.numero+': '+(ESTADO_FACT[e.estado]||[0,e.estado])[1]+'\n\n'+(e.mensajes||[]).map(m=>(m.identificador?'['+m.identificador+'] ':'')+m.mensaje+(m.informacionAdicional?'\n   '+m.informacionAdicional:'')).join('\n'))
      if(e.estado!=='EN PROCESO'&&modal)modal.rec.facturaId=f.id
      if(e.estado==='EN PROCESO')modal=null
    }
    await loadData()
  }catch(err){reset();alert('No se pudo emitir la factura.\n\n'+err.message+ayudaErrorServidor(err.message))}
}
function descargarBytes(u8,nombre,mime){
  const url=URL.createObjectURL(new Blob([u8],{type:mime}));const a=document.createElement('a');a.href=url;a.download=nombre;document.body.appendChild(a);a.click();a.remove()
  setTimeout(()=>URL.revokeObjectURL(url),5000)
}

async function guardarConfigFacturacion(){
  _prodLeer()
  const prods=(_prodEdit||cfgFactura().productos).filter(p=>p.codigo||p.d)
  if(!prods.length){alert('Agrega al menos un producto o servicio.');return}
  if(prods.some(p=>!p.codigo||!p.d)){alert('Cada producto necesita código y descripción.');return}
  if(prods.some(p=>!/^[A-Z0-9._-]{1,25}$/.test(p.codigo))){alert('Código del producto: hasta 25 letras o números, sin espacios (se permiten . _ -).');return}
  if(new Set(prods.map(p=>p.codigo)).size!==prods.length){alert('Hay códigos de producto repetidos.');return}
  const c={};Object.keys(FACT_DEFAULT).forEach(k=>{const el=document.getElementById('cff_'+k);c[k]=el?String(el.value).trim():FACT_DEFAULT[k]})
  c.productos=prods.map(p=>({codigo:p.codigo,d:p.d,v:p.v,iva:p.iva}));c.descripcion=prods[0].d;c.codigoServicio=prods[0].codigo;c.codigoIva=prods[0].iva
  if(c.ruc&&!/^\d{13}$/.test(c.ruc)){alert('El RUC debe tener 13 dígitos');return}
  if(!/^\d{13}$/.test(c.rucProveedor)){alert('El RUC del proveedor del sistema de facturación debe tener 13 dígitos.');return}
  if(!/^\d{1,3}$/.test(c.estab)||!/^\d{1,3}$/.test(c.ptoEmi)){alert('Establecimiento y punto de emisión: 3 dígitos (ej. 001)');return}
  c.estab=('000'+c.estab).slice(-3);c.ptoEmi=('000'+c.ptoEmi).slice(-3)
  if(c.ambiente==='2'&&cfgFactura().ambiente!=='2'&&!confirm('Vas a pasar a PRODUCCIÓN: las facturas tendrán validez tributaria. Hazlo solo cuando el SRI te haya autorizado en producción.\n\n¿Continuar?'))return
  const rec={id:'facturacion',valor:JSON.stringify(c)}
  const existe=(data.config||[]).some(x=>x.id==='facturacion')
  data.config=existe?data.config.map(x=>x.id==='facturacion'?rec:x):(data.config||[]).concat([rec])
  const r=await apiPost({action:existe?'actualizar':'insertar',tabla:'Config',id:'facturacion',fila:rec})
  if(r&&r.ok){toast('Datos de facturación guardados ✓');_prodEdit=null}else toast('Error: '+(r&&r.error||'Sin respuesta'),'err')
  draw()
}

const hoyISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
// Nombre de quien paga una cuota, aunque su ficha de cliente no exista
function nombrePagador(c,t,cl){cl=cl||(c?pagadorDe(c,t):null);return cl&&cl.nombre||c&&(c.clienteNombre||(/ — /.test(c.label||'')?String(c.label).split(' — ').pop():''))||t&&t.clienteNombre||'—'}
const saldoCuota=c=>r2(Math.max((parseFloat(c.acordado)||0)-realPaid(c),0))
// Cuotas con saldo cuya fecha de pago ya pasó (incluye las pagadas en parte). corte = fecha ISO
function cuotasVencidas(corte){
  corte=corte||hoyISO()
  return data.cuotas.map(function(c){
    const f=toISO(c.fechaVencimiento||''),s=saldoCuota(c)
    if(!f||f>=corte||!(s>0))return null
    const t=data.trabajos.find(x=>x.id===c.trabajoId);if(!t||t.estado==='Cancelado')return null
    const cl=pagadorDe(c,t),dias=Math.round((new Date(corte+'T12:00:00')-new Date(f+'T12:00:00'))/864e5)
    return{c:c,t:t,cl:cl,nombre:nombrePagador(c,t,cl),fecha:f,saldo:s,dias:dias,pagado:r2(realPaid(c))}
  }).filter(Boolean).sort((a,b)=>b.dias-a.dias)
}

const LIB_XLSX='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
function _rangoPreset(k){
  const d=new Date(hoyISO()+'T12:00:00'),y=d.getFullYear(),m=d.getMonth(),iso=x=>new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)
  if(k==='mes')return[iso(new Date(y,m,1)),hoyISO()]
  if(k==='mesAnt')return[iso(new Date(y,m-1,1)),iso(new Date(y,m,0))]
  if(k==='trim'){const q=Math.floor(m/3)*3;return[iso(new Date(y,q,1)),hoyISO()]}
  if(k==='anio')return[iso(new Date(y,0,1)),hoyISO()]
  if(k==='anioAnt')return[iso(new Date(y-1,0,1)),iso(new Date(y-1,11,31))]
  if(k==='30')return[iso(new Date(d.getTime()-29*864e5)),hoyISO()]
  return[iso(new Date(y,m,1)),hoyISO()]
}
// Reúne los pagos del periodo con sus datos sustanciales
function datosReporteIngresos(desde,hasta,tipo,extra){
  extra=extra||{}
  const filas=(data.abonos||[]).map(function(a){
    const f=toISO(a.fecha||'');if(!f||f<desde||f>hasta)return null
    const c=data.cuotas.find(x=>x.id===a.cuotaId),t=data.trabajos.find(x=>x.id===(a.trabajoId||c&&c.trabajoId))
    if(tipo&&(!t||t.tipo!==tipo))return null
    const cl=c?pagadorDe(c,t):(t?data.clientes.find(x=>x.id===t.clienteId):null)
    const fa=facturasDeAbono(a.id)[0]
    if(extra.cliente&&(cl?cl.id:nombrePagador(c,t,cl))!==extra.cliente)return null
    if(extra.fact==='con'&&!(fa&&fa.estado==='AUTORIZADO'))return null
    if(extra.fact==='sin'&&fa&&fa.estado==='AUTORIZADO')return null
    return{fecha:f,cliente:nombrePagador(c,t,cl),cedula:cl&&cl.cedula||'',trabajo:t?t.titulo:(c&&c.trabajoTitulo)||'—',
      tipo:t&&t.tipo||'—',cuota:c&&c.label||'—',comprobante:a.comprobante||'',nota:a.nota||'',factura:fa?fa.numero+(fa.estado!=='AUTORIZADO'?' ('+(ESTADO_FACT[fa.estado]||[0,fa.estado])[1]+')':''):'',
      facturado:!!(fa&&fa.estado==='AUTORIZADO'),monto:r2(parseFloat(a.monto)||0)}
  }).filter(Boolean).sort((a,b)=>a.fecha.localeCompare(b.fecha))
  const total=r2(filas.reduce((s,x)=>s+x.monto,0))
  const agrupar=k=>{const o={};filas.forEach(x=>{const g=typeof k==='function'?k(x):x[k];o[g]=o[g]||{n:0,monto:0};o[g].n++;o[g].monto=r2(o[g].monto+x.monto)});return o}
  const porMes=agrupar(x=>x.fecha.slice(0,7)),porTipo=agrupar('tipo'),porCliente=agrupar('cliente')
  const facturado=r2(filas.filter(x=>x.facturado).reduce((s,x)=>s+x.monto,0))
  const vencidas=cuotasVencidas(hasta<hoyISO()?_sumarDia(hasta,1):hoyISO())
  const porCobrar=r2(data.cuotas.filter(c=>{const t=data.trabajos.find(x=>x.id===c.trabajoId);return t&&t.estado!=='Cancelado'}).reduce((s,c)=>s+saldoCuota(c),0))
  const fCli=extra.cliente?((data.clientes.find(c=>c.id===extra.cliente)||{}).nombre||extra.cliente):''
  return{desde:desde,hasta:hasta,tipo:tipo||'',filtros:[tipo?'Tipo: '+tipo:'',fCli?'Cliente: '+fCli:'',extra.fact==='con'?'Solo con factura':extra.fact==='sin'?'Solo sin factura':''].filter(Boolean).join(' · '),filas:filas,total:total,n:filas.length,promedio:filas.length?r2(total/filas.length):0,
    porMes:porMes,porTipo:porTipo,porCliente:porCliente,facturado:facturado,sinFactura:r2(total-facturado),
    vencidas:vencidas,totalVencido:r2(vencidas.reduce((s,x)=>s+x.saldo,0)),porCobrar:porCobrar}
}

// ════════════════════════════════════════════════════════════════
// INGRESOS: dashboard dinámico (filtros, gráficos interactivos) + informes Excel/PDF
// ════════════════════════════════════════════════════════════════
const ING={desde:'',hasta:'',agr:'mes',tipo:'',cliente:'',fact:'',proy:true,verTodo:false}
const ING_AZUL='#1E6FB8',ING_ORO='#C9973F'
function _inicioPer(iso,agr){
  const d=new Date(iso+'T12:00:00'),y=d.getFullYear(),m=d.getMonth(),f=x=>new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)
  if(agr==='dia')return iso
  if(agr==='semana'){d.setDate(d.getDate()-(d.getDay()+6)%7);return f(d)}
  if(agr==='mes')return f(new Date(y,m,1,12))
  if(agr==='trimestre')return f(new Date(y,Math.floor(m/3)*3,1,12))
  return f(new Date(y,0,1,12))
}
function _sigPer(iso,agr){
  const d=new Date(iso+'T12:00:00'),f=x=>new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)
  if(agr==='dia')return _sumarDia(iso,1)
  if(agr==='semana')return _sumarDia(iso,7)
  if(agr==='mes')return f(new Date(d.getFullYear(),d.getMonth()+1,1,12))
  if(agr==='trimestre')return f(new Date(d.getFullYear(),d.getMonth()+3,1,12))
  return f(new Date(d.getFullYear()+1,0,1,12))
}
function _etiquetaPer(iso,agr){
  const d=new Date(iso+'T12:00:00')
  if(agr==='dia')return d.getDate()+' '+MESES[d.getMonth()]
  if(agr==='semana')return d.getDate()+' '+MESES[d.getMonth()]
  if(agr==='mes')return MESES[d.getMonth()]+' '+String(d.getFullYear()).slice(2)
  if(agr==='trimestre')return'T'+(Math.floor(d.getMonth()/3)+1)+' '+d.getFullYear()
  return String(d.getFullYear())
}
const _diasEntre=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)
// Agrupación efectiva: si hay demasiados periodos, sube a la siguiente
function _agrEfectiva(desde,hasta,agr){
  const d=_diasEntre(desde,hasta),orden=['dia','semana','mes','trimestre','anio'],lim={dia:62,semana:110,mes:72,trimestre:60,anio:99}
  let i=orden.indexOf(agr);if(i<0)i=2
  while(i<orden.length-1&&d/({dia:1,semana:7,mes:30.4,trimestre:91,anio:365}[orden[i]])>lim[orden[i]])i++
  return orden[i]
}
function _periodos(desde,hasta,agr){
  const out=[];let cur=_inicioPer(desde,agr)
  while(cur<=hasta&&out.length<400){const sig=_sigPer(cur,agr);out.push({ini:cur<desde?desde:cur,fin:_sumarDia(sig,-1)>hasta?hasta:_sumarDia(sig,-1),k:cur,l:_etiquetaPer(cur,agr),real:0,n:0,proy:0});cur=sig}
  return out
}
const _compactUSD=v=>v>=1e6?'$'+(Math.round(v/1e5)/10)+'M':v>=1e3?'$'+(Math.round(v/100)/10)+'K':'$'+Math.round(v)
function _ticks(max){
  if(!(max>0))return[0,1]
  const p=Math.pow(10,Math.floor(Math.log10(max))),paso=[1,2,2.5,5,10].map(x=>x*p).find(s=>max/s<=5)||p*10
  const t=[];for(let v=0;v<=max+paso*0.001;v+=paso)t.push(v);if(t[t.length-1]<max)t.push(t[t.length-1]+paso);return t
}
// Datos del tablero con los filtros actuales
function datosIngresos(){
  if(!ING.desde){const r=_rangoTablero('anio');ING.desde=r[0];ING.hasta=r[1]}
  const R=datosReporteIngresos(ING.desde,ING.hasta,ING.tipo,{cliente:ING.cliente,fact:ING.fact})
  const agr=_agrEfectiva(ING.desde,ING.hasta,ING.agr),per=_periodos(ING.desde,ING.hasta,agr)
  const idx=f=>{for(let i=0;i<per.length;i++)if(f>=per[i].ini&&f<=per[i].fin)return i;return -1}
  R.filas.forEach(x=>{const i=idx(x.fecha);if(i>-1){per[i].real=r2(per[i].real+x.monto);per[i].n++}})
  // Proyección: saldos de cuotas que vencen desde hoy dentro del periodo
  const hoy=hoyISO()
  if(ING.proy)data.cuotas.forEach(function(c){
    const f=toISO(c.fechaVencimiento||''),s=saldoCuota(c);if(!f||f<hoy||f<ING.desde||f>ING.hasta||!(s>0))return
    const t=data.trabajos.find(x=>x.id===c.trabajoId);if(!t||t.estado==='Cancelado')return
    if(ING.tipo&&t.tipo!==ING.tipo)return
    const cl=pagadorDe(c,t);if(ING.cliente&&(cl?cl.id:nombrePagador(c,t,cl))!==ING.cliente)return
    const i=idx(f);if(i>-1)per[i].proy=r2(per[i].proy+s)
  })
  // Periodo anterior de igual duración (para comparar)
  const dur=_diasEntre(ING.desde,ING.hasta)+1,pHasta=_sumarDia(ING.desde,-1),pDesde=_sumarDia(pHasta,-(dur-1))
  const P=datosReporteIngresos(pDesde,pHasta,ING.tipo,{cliente:ING.cliente,fact:ING.fact})
  return{R:R,per:per,agr:agr,ant:{desde:pDesde,hasta:pHasta,total:P.total},proyTotal:r2(per.reduce((s,p)=>s+p.proy,0))}
}
function _ingSet(k,v){ING[k]=v;if(k==='desde'||k==='hasta'){if(ING.desde&&ING.hasta&&ING.desde>ING.hasta){const x=ING.desde;ING.desde=ING.hasta;ING.hasta=x}}ING.verTodo=false;draw()}
// En el tablero "Este año" abarca el año completo para ver también lo que falta cobrar
const _rangoTablero=k=>{if(k==='anio'){const y=new Date().getFullYear();return[y+'-01-01',y+'-12-31']}return _rangoPreset(k)}
function _ingPreset(k){const r=_rangoTablero(k);ING.desde=r[0];ING.hasta=r[1];ING.verTodo=false;draw()}
function _ingLimpiar(){const r=_rangoTablero('anio');Object.assign(ING,{desde:r[0],hasta:r[1],agr:'mes',tipo:'',cliente:'',fact:'',proy:true,verTodo:false});draw()}
function _ingTip(e,html){const t=document.getElementById('ing_tip');if(!t)return;t.innerHTML=html;t.style.display='block'

function _ingTipOff(){const t=document.getElementById('ing_tip');if(t)t.style.display='none'}
function _ingZoom(i){const D=datosIngresos(),p=D.per[i];if(!p)return;ING.desde=p.ini;ING.hasta=p.fin;ING.agr=D.agr==='anio'?'mes':D.agr==='trimestre'?'mes':D.agr==='mes'?'dia':'dia';draw()}
// Gráfico de columnas: cobrado real + proyectado (misma escala, un solo eje)
function _svgIngresos(per,proy){
  const W=900,H=280,ml=54,mr=12,mt=16,mb=34,iw=W-ml-mr,ih=H-mt-mb
  const max=Math.max(1,...per.map(p=>p.real+(proy?p.proy:0))),ticks=_ticks(max),top=ticks[ticks.length-1]
  const n=per.length,slot=iw/n,bw=Math.max(3,Math.min(24,slot*0.62)),y=v=>mt+ih-(v/top)*ih
  const col=(x,y0,y1,color,round,extra)=>{const h=y0-y1;if(h<=0)return'';const r=round?Math.min(4,h,bw/2):0
    return'<path d="M'+x+','+y0+' V'+(y1+r)+(r?' Q'+x+','+y1+' '+(x+r)+','+y1:'')+' H'+(x+bw-r)+(r?' Q'+(x+bw)+','+y1+' '+(x+bw)+','+(y1+r):'')+' V'+y0+' Z" fill="'+color+'"'+(extra||'')+'/>'}
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Ingresos por periodo">'
    +'<defs><pattern id="ingRay" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#E3EDF8"/><line x1="0" y1="0" x2="0" y2="6" stroke="'+ING_AZUL+'" stroke-width="2"/></pattern></defs>'
  ticks.forEach(v=>{s+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#ECEAE4" stroke-width="1"/><text x="'+(ml-8)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="#6b7280">'+_compactUSD(v)+'</text>'})
  const cadaEt=Math.ceil(n/14)
  per.forEach(function(p,i){
    const x=ml+i*slot+(slot-bw)/2,y0=y(0),yr=y(p.real),yp=y(p.real+(proy?p.proy:0))
    s+=col(x,y0,yr,ING_AZUL,!(proy&&p.proy>0))
    if(proy&&p.proy>0)s+=col(x,yr-(p.real>0?2:0),yp,'url(#ingRay)',true)
    if(i%cadaEt===0)s+='<text x="'+(ml+i*slot+slot/2)+'" y="'+(H-12)+'" text-anchor="middle" font-size="11" fill="#6b7280">'+esc(p.l)+'</text>'
    const tip='<strong>'+esc(p.ini===p.fin?fmtDCorto(p.ini):fmtDCorto(p.ini)+' – '+fmtDCorto(p.fin))+'</strong><br/>Cobrado: <strong>'+fmtUSD(p.real)+'</strong> ('+p.n+' pago'+(p.n!==1?'s':'')+')'+(proy&&p.proy>0?'<br/>Por cobrar: '+fmtUSD(p.proy):'')+'<br/><span style="opacity:.7">Clic para ver este periodo</span>'
    s+='<rect x="'+(ml+i*slot)+'" y="'+mt+'" width="'+slot+'" height="'+ih+'" fill="transparent" style="cursor:pointer" onmousemove="_ingTip(event,\''+esc(tip).replace(/'/g,"\\'")+'\')" onmouseleave="_ingTipOff()" onclick="_ingTipOff();_ingZoom('+i+')"/>'
  })
  // Valor del mayor periodo cobrado (etiqueta selectiva)
  const im=per.reduce((b,p,i)=>p.real>per[b].real?i:b,0)
  if(per[im]&&per[im].real>0)s+='<text x="'+(ml+im*slot+slot/2)+'" y="'+(y(per[im].real+(proy?per[im].proy:0))-6)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#0B2545">'+_compactUSD(per[im].real)+'</text>'
  s+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="#CFCBC1" stroke-width="1"/></svg>'
  return s
}
// Barras horizontales (magnitud, un solo color) con clic para filtrar
function _barrasH(obj,total,onclick,activo){
  const ks=Object.keys(obj).sort((a,b)=>obj[b].monto-obj[a].monto),top=ks.slice(0,8),otros=ks.slice(8)
  const max=Math.max(1,...top.map(k=>obj[k].monto))
  let h=top.map(k=>'<div style="display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;margin:5px 0;cursor:pointer'+(activo&&activo!==k?';opacity:.45':'')+'" onclick="'+onclick(k)+'" title="Clic para filtrar">'
    +'<span style="font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(k)+'</span>'
    +'<span style="background:#F1EFEA;border-radius:4px;height:14px;display:block"><span style="display:block;height:14px;width:'+Math.max(2,obj[k].monto/max*100)+'%;background:'+ING_AZUL+';border-radius:0 4px 4px 0"></span></span>'
    +'<span style="font-size:12px;font-weight:700;color:var(--navy);min-width:86px;text-align:right">'+fmtUSD(obj[k].monto)+' <span style="font-weight:400;color:var(--text3)">'+(total?Math.round(obj[k].monto/total*100):0)+'%</span></span></div>').join('')
  if(otros.length)h+='<div style="font-size:11px;color:var(--text3);margin-top:4px">+ '+otros.length+' más ('+fmtUSD(r2(otros.reduce((s,k)=>s+obj[k].monto,0)))+')</div>'
  return h||'<div style="font-size:12px;color:var(--text3)">Sin pagos en el periodo.</div>'

// Datos por autor de un trabajo: valor, pagado y saldo de cada uno
function resumenPorAutor(t){
  const au=autoresDe(t),cs=data.cuotas.filter(c=>c.trabajoId===t.id)
  return au.map(function(a){
    const mias=cs.filter(c=>pagadorIdDe(c,t)===a.clienteId),acordado=r2(mias.reduce((s,c)=>s+(parseFloat(c.acordado)||0),0)),pagado=r2(mias.reduce((s,c)=>s+realPaid(c),0))
    return{a:a,cl:data.clientes.find(c=>c.id===a.clienteId)||null,acordado:acordado,pagado:pagado,saldo:r2(Math.max(acordado-pagado,0)),cuotas:mias.length}
  })
}

const TIPOS_PAGO={transferencia:'🏦 Transferencia / depósito',tarjeta:'💳 Tarjeta de crédito o débito',deuna:'📱 Deuna / billetera digital',paypal:'🌐 PayPal',efectivo:'💵 Efectivo',otro:'➕ Otra forma de pago'}
function cfgFormasPago(){
  const row=(data.config||[]).find(c=>c.id==='formasPago');let p={}
  if(row&&row.valor){try{p=JSON.parse(row.valor)||{}}catch(e){}}
  return{metodos:Array.isArray(p.metodos)?p.metodos:[],enCobros:p.enCobros!==false,nota:p.nota||''}
}
// Texto para WhatsApp con las formas de pago activas (soloCuentas: solo transferencias)
function textoFormasPago(soloCuentas){
  const c=cfgFormasPago(),ms=c.metodos.filter(m=>m.activo!==false&&(!soloCuentas||m.tipo==='transferencia'))
  if(!ms.length)return''
  const L=ms.map(function(m){
    if(m.tipo==='transferencia')return'🏦 *'+(m.banco||'Transferencia')+'*'+(m.tipoCuenta?' · Cuenta '+m.tipoCuenta.toLowerCase():'')
      +(m.numero?'\n   N.° '+m.numero:'')+(m.titular?'\n   Titular: '+m.titular:'')+(m.identificacion?'\n   C.I./RUC: '+m.identificacion:'')+(m.email?'\n   Comprobante a: '+m.email:'')
    const ic=(TIPOS_PAGO[m.tipo]||'➕').split(' ')[0]
    return ic+' *'+(m.nombre||TIPOS_PAGO[m.tipo].replace(/^\S+\s/,''))+'*'+(m.enlace?'\n   '+m.enlace:'')+(m.numero?'\n   '+m.numero:'')+(m.detalle?'\n   '+m.detalle:'')
  })
  return(soloCuentas?'🏦 *Cuenta'+(ms.length>1?'s':'')+' para transferencia:*':'💳 *Formas de pago:*')+'\n\n'+L.join('\n\n')+(c.nota&&!soloCuentas?'\n\n'+c.nota:'')
}

function _fpLeer(){if(!_fpEdit)return;_fpEdit.forEach(function(m,i){['banco','tipoCuenta','numero','titular','identificacion','email','nombre','enlace','detalle'].forEach(function(k){const el=document.getElementById('fp_'+k+'_'+i);if(el)m[k]=String(el.value).trim()})

function _fpTextoPrueba(){const row={id:'formasPago',valor:JSON.stringify({metodos:_fpEdit,nota:v('fp_nota'),enCobros:true})},cfg=data.config;data.config=(cfg||[]).filter(c=>c.id!=='formasPago').concat([row]);const t=textoFormasPago();data.config=cfg;return t}
function _fpAgregar(tipo){_fpLeer();_fpEdit.push({id:uid(),tipo:tipo,activo:true});draw()}
function _fpQuitar(i){_fpLeer();_fpEdit.splice(i,1);draw()}
function _fpMover(i,d){_fpLeer();const x=_fpEdit.splice(i,1)[0];_fpEdit.splice(i+d,0,x);draw()}
async function guardarFormasPago(){
  _fpLeer()
  for(const m of _fpEdit){
    if(m.tipo==='transferencia'&&(!m.banco||!m.numero)){alert('Cada cuenta bancaria necesita el banco y el número de cuenta.');return}
    if(m.tipo!=='transferencia'&&!m.nombre&&!m.enlace&&!m.detalle&&!m.numero){alert('Completa al menos el nombre, el enlace o el detalle de cada forma de pago.');return}
  }
  const ef=document.getElementById('fp_enCobros')
  const rec={id:'formasPago',valor:JSON.stringify({metodos:_fpEdit,nota:v('fp_nota'),enCobros:!!(ef&&ef.checked)})}
  const existe=(data.config||[]).some(x=>x.id==='formasPago')
  data.config=existe?data.config.map(x=>x.id==='formasPago'?rec:x):(data.config||[]).concat([rec])
  const r=await apiPost({action:existe?'actualizar':'insertar',tabla:'Config',id:'formasPago',fila:rec})
  if(r&&r.ok){toast('Formas de pago guardadas ✓');_fpEdit=null}else toast('Error: '+(r&&r.error||'Sin respuesta'),'err')
  draw()
}

async function diagnosticoInstalacion(){
  const R=[],ua=navigator.userAgent
  const add=(ok,t,d)=>R.push({ok:ok,t:t,d:d||''})
  const enApp=esStandalone()
  if(enApp){add(true,'Ya estás usando la app instalada');return R}
  const https=location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)
  add(https,'Conexión segura (https)',https?location.host:location.protocol==='file:'?'Estás abriendo el archivo desde tu equipo. La app solo se instala desde la dirección https de GitHub Pages.':'La dirección no es https.')
  const inApp=/FBAN|FBAV|Instagram|Line\/|WhatsApp|; wv\)|GSA\//i.test(ua)
  const ios=esIOS(),safari=/Safari/i.test(ua)&&!/CriOS|FxiOS|EdgiOS|Chrome|Chromium|Android/i.test(ua)
  const firefox=/Firefox|FxiOS/i.test(ua),chromium=/Chrome|Chromium|Edg\//i.test(ua)&&!/OPR\//.test(ua)
  if(inApp)add(false,'Navegador interno de otra app','Abriste el enlace dentro de WhatsApp, Facebook u otra app. Toca ⋮ o ↗ y elige "Abrir en Chrome" (Android) o "Abrir en Safari" (iPhone).')
  else if(ios)add(true,'iPhone / iPad',safari?'En Safari: Compartir ↑ → "Agregar a pantalla de inicio". En iPhone no aparece un botón de instalar automático.':'Abre la dirección en Safari: Compartir ↑ → "Agregar a pantalla de inicio".')
  else if(firefox)add(false,'Firefox no instala aplicaciones web','Abre la dirección en Google Chrome o Microsoft Edge.')
  else if(safari)add(true,'Safari en Mac','Menú Archivo → "Agregar al Dock" (macOS Sonoma o superior), o usa Chrome/Edge.')
  else add(chromium,'Navegador compatible',chromium?'Chrome / Edge':'Usa Google Chrome o Microsoft Edge.')
  try{
    const r=await fetch('manifest.webmanifest',{cache:'no-store'})
    if(!r.ok)throw new Error('HTTP '+r.status)
    const m=await r.json()
    const iconos=await Promise.all((m.icons||[]).map(i=>fetch(i.src,{cache:'no-store'}).then(x=>x.ok).catch(()=>false)))
    const okIc=iconos.length>0&&iconos.every(Boolean),faltan=(m.icons||[]).filter((i,k)=>!iconos[k]).map(i=>i.src).filter((v,k,a)=>a.indexOf(v)===k)
    add(true,'Manifiesto de la app',m.name)
    add(okIc,'Íconos de la app',okIc?iconos.length+' íconos encontrados':'Faltan en el repositorio: '+faltan.join(', ')+'. Súbelos junto a index.html.')
  }catch(e){add(false,'Manifiesto de la app','No se encontró manifest.webmanifest ('+e.message+'). Súbelo a la misma carpeta que index.html.')}
  if('serviceWorker' in navigator){
    const reg=await navigator.serviceWorker.getRegistration().catch(()=>null)
    add(!!(reg&&(reg.active||reg.waiting||reg.installing)),'Servicio de la app (sw.js)',reg?'Registrado':'No registrado: sube sw.js a la misma carpeta que index.html y recarga la página.')
  }else add(false,'Servicio de la app','Este navegador no lo admite.')
  if(chromium&&!ios&&!inApp)add(!!_installEvt,'Instalación disponible',_installEvt?'Pulsa "📲 Instalar app".'
    :'Chrome no ofreció la instalación todavía. Puede que ya esté instalada (búscala en tus apps), o que la hayas rechazado antes: en computadora usa el ícono ⊕ de la barra de direcciones o ⋮ → "Transmitir, guardar y compartir" → "Instalar página como app"; en Android ⋮ → "Agregar a la pantalla principal" → "Instalar".')
  return R
}

}
// Compara la versión que corre en este equipo con la publicada en GitHub (sin caché)
let _versionPublicada=''
async function buscarActualizacion(manual){
  if(location.protocol==='file:')return
  try{
    const r=await fetch('index.html?v='+Date.now(),{cache:'no-store'});const t=await r.text()
    const m=t.match(/const VERSION='([^']+)'/);_versionPublicada=m?m[1]:''
    if(_versionPublicada&&_versionPublicada!==VERSION){if(user)draw();if(manual&&confirm('Hay una versión nueva ('+_versionPublicada+'). ¿Actualizar ahora?'))forzarActualizacion()}
    else if(manual)toast('Tienes la última versión ('+VERSION+') ✓')
  }catch(e){if(manual)toast('No se pudo comprobar la versión','err')}
}
// Borra la copia guardada de la app en este equipo y recarga la versión publicada
async function forzarActualizacion(){
  try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister()}}catch(e){}
  try{if(window.caches){const ks=await caches.keys();for(const k of ks)await caches.delete(k)}}catch(e){}
  location.replace(location.pathname+'?act='+Date.now()+location.hash)
}
setTimeout(function(){buscarActualizacion(false)},4000);setInterval(function(){buscarActualizacion(false)},30*60*1000)
function actualizarApp(){
  if(_swNuevo&&_swNuevo.waiting)_swNuevo.waiting.postMessage('activar')
  else location.reload()
}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      const avisar=function(){if(reg.waiting&&navigator.serviceWorker.controller){_swNuevo=reg;if(user)draw()}}
      avisar()
      reg.addEventListener('updatefound',function(){
        const w=reg.installing
        if(w)w.addEventListener('statechange',function(){if(w.state==='installed')avisar()})
      })
    }).catch(function(e){console.warn('Service worker no registrado:',e)})
    let recargando=false
    navigator.serviceWorker.addEventListener('controllerchange',function(){if(recargando)return;recargando=true;location.reload()})
  })
}
// Al volver internet, recarga los datos reales
window.addEventListener('online',function(){if(user&&sinConexion){toast('Conexión restablecida');loadData()}})

// ─── INICIO ───────────────────────────────────────────────────────────────────
;(function(){const s=leerSesion();if(s&&!VERIF.activo){SESION=s;user=s.user;loadData()}})()
draw()
</script>
