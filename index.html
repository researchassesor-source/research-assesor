<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#F5F4F0;color:#0B2545;min-height:100vh}
/* Paleta de marca Research Assessor: azul marino (texto), azul hoja (acción), dorado (acento) */
:root{
  --navy:#0B2545;--brand:#0F4C81;--brand-dk:#0B3A63;--brand-lt:#E7EEF6;
  --gold:#B8894A;--gold-dk:#8E6630;--gold-lt:#F5EBDC;--gold-grad:linear-gradient(135deg,#E6C38E 0%,#C99A5B 55%,#A9793D 100%);
  --green:#0e9f6e;--green-bg:#f0fdf4;
  --amber:#d97706;--amber-bg:#fffbeb;
  --red:#e02424;--red-bg:#fef2f2;
  --violet:#8E6630;--violet-bg:#F5EBDC;
  --surface:#fff;--bg:#F5F4F0;--border:#E6E3DC;
  --text:#0B2545;--text2:#4A5568;--text3:#8C94A3;
  --r:12px;--rs:8px;--shadow:0 1px 3px rgba(11,37,69,.06),0 4px 16px rgba(11,37,69,.04)
}

/* ── LOGIN ── */
.lw{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 110% -10%,rgba(201,154,91,.18),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(15,76,129,.14),transparent 60%),#F5F4F0;padding:20px}
.l-brand{display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.l-brand img{width:260px;max-width:78vw;height:auto;display:block}
.l-sub{font-size:13px;color:var(--text3);margin-top:4px;text-align:center;letter-spacing:.3px}
.lb{background:#fff;border-radius:20px;padding:36px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(11,37,69,.10),0 1px 4px rgba(0,0,0,.05);position:relative;overflow:hidden}
.lb::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--gold-grad)}
.lb-title{font-size:22px;font-weight:800;color:var(--text);margin-bottom:4px}
.lb-sub{font-size:13px;color:var(--text3);margin-bottom:28px}
.lf-group{margin-bottom:16px}
.lf-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block;letter-spacing:.3px}
.lf-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--rs);font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;transition:all .15s}
.lf-input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(15,76,129,.1)}
.l-btn{width:100%;padding:13px;border-radius:var(--rs);border:none;cursor:pointer;font-size:15px;font-weight:700;font-family:inherit;background:var(--brand);color:#fff;margin-top:8px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.l-btn:hover{background:var(--brand-dk);transform:translateY(-1px);box-shadow:0 4px 16px rgba(15,76,129,.3)}
.l-err{background:var(--red-bg);border:1px solid #fecaca;border-radius:var(--rs);padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:14px;display:none}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh}
aside{width:230px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.a-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.a-logo img{width:170px;height:auto;display:block}
nav{padding:10px 8px;flex:1}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:2px;border:none;background:none;width:100%;text-align:left;transition:all .12s;position:relative}
.ni:hover{background:#F1F5FA;color:var(--brand)}
.ni.on{background:var(--brand-lt);color:var(--navy);font-weight:700}
.ni.on::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--gold-grad)}
.ni-new{margin-left:auto;background:var(--gold-lt);color:var(--gold-dk);font-size:9px;font-weight:800;padding:1px 6px;border-radius:20px;letter-spacing:.4px}
.ni .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px}
.n-section{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.8px;padding:12px 12px 4px;text-transform:uppercase}
.a-foot{padding:14px;border-top:1px solid var(--border)}
.a-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:#F8F7F3;margin-bottom:8px}
.a-avatar{width:32px;height:32px;border-radius:8px;background:var(--navy);color:#F5EBDC;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.a-uname{font-size:12px;font-weight:700;color:var(--text)}
.a-urole{font-size:11px;color:var(--text3)}
main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.topbar h2{font-size:16px;font-weight:800;flex:1;color:var(--text)}
.page{padding:24px;flex:1}
.m-menu-btn{display:none;background:none;border:1px solid var(--border);border-radius:8px;width:34px;height:34px;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--text2);flex-shrink:0}
.m-overlay{display:none}

/* ── COMPONENTS ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(26,37,64,.13);border-color:var(--brand)}
.kpi-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.kpi-value{font-size:28px;font-weight:800;line-height:1;color:var(--text)}
.kpi-sub{font-size:12px;color:var(--text3);margin-top:4px}
.kpi-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:28px;opacity:.15}
.kpi-bar{height:3px;border-radius:100px;margin-top:10px;background:#f1f5f9;overflow:hidden}
.kpi-bar-f{height:100%;border-radius:100px;transition:width .5s ease}

.card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
.card-hd{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f8fafc}
.card-hd h3{font-size:13px;font-weight:700;color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 16px;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #f1f5f9;background:#FAFAF7}
td{padding:11px 16px;border-bottom:1px solid #f8fafc;vertical-align:middle;color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAF7}
.empty{text-align:center;padding:36px;color:var(--text3);font-size:13px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--rs);border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:all .12s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--brand);color:#fff}.btn-p:hover{background:var(--brand-dk)}
.btn-green{background:var(--green);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn-g{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-g:hover{background:#F1F5FA;color:var(--brand)}
.btn-r{background:var(--red-bg);color:var(--red);border:1px solid #fecaca}
.btn-wa{background:#dcfce7;color:#16a34a;border:1px solid #bbf7d0}
.btn-amber{background:var(--amber-bg);color:var(--amber);border:1px solid #fde68a}

/* ── BADGES ── */
.b{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.bg{background:#dcfce7;color:#15803d}.bb{background:#E3ECF6;color:#0F4C81}
.ba{background:#fef3c7;color:#b45309}.br{background:#fee2e2;color:#dc2626}
.bx{background:#f1f5f9;color:#475569}.bv{background:var(--violet-bg);color:var(--violet)}

/* ── MODAL ── */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:18px;padding:28px;width:100%;max-width:540px;box-shadow:0 24px 60px rgba(0,0,0,.2)}
.modal h3{font-size:16px;font-weight:800;color:var(--brand);margin-bottom:20px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg .full{grid-column:1/-1}
label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
input,select,textarea{width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:var(--rs);font-size:13px;font-family:inherit;color:var(--text);background:#fff;outline:none;transition:border .12s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,76,129,.1)}
textarea{resize:vertical;min-height:64px}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;border-top:1px solid #f1f5f9;padding-top:16px}

/* ── WORK EXPAND ── */
.wcard{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.wcard-hd{padding:14px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;flex-wrap:wrap}
.wcard-hd:hover{background:#FAFAF7}
.pbar{height:5px;border-radius:100px;background:#f1f5f9;overflow:hidden;flex:1;min-width:60px}
.pbar-f{height:100%;border-radius:100px;transition:width .4s}
.mcard{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:10px;padding:16px;display:flex;gap:14px;box-shadow:var(--shadow)}
.datebox{flex-shrink:0;width:52px;text-align:center;border-radius:10px;padding:8px 4px}
.crow{border-radius:9px;margin-bottom:5px;border:1px solid}
.crow-hd{padding:9px 13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ── SYNC ── */
.sp{display:flex;align-items:center;gap:7px;padding:5px 13px;border-radius:20px;font-size:11px;font-weight:600}
.sp-ok{background:#dcfce7;color:#15803d}.sp-ld{background:#fef3c7;color:#b45309}.sp-er{background:#fee2e2;color:#dc2626}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;z-index:200;padding:12px 20px;border-radius:12px;color:#fff;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .2s ease;display:flex;align-items:center;gap:8px}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

/* ── DASHBOARD CHARTS ── */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.dash-grid.three{grid-template-columns:1fr 1fr 1fr}
.chart-wrap{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.chart-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px}
.chart-sub{font-size:11px;color:var(--text3);margin-bottom:16px}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:100px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{border-radius:5px 5px 0 0;width:100%;min-height:4px;transition:all .5s ease}
.bar-label{font-size:9px;color:var(--text3);font-weight:600;white-space:nowrap}
.bar-val{font-size:10px;font-weight:700;color:var(--text2)}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut-legend{flex:1}
.donut-item{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:12px}
.donut-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.progress-item{margin-bottom:10px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:var(--text2)}
.progress-bar{height:6px;background:#f1f5f9;border-radius:100px;overflow:hidden}
.progress-fill{height:100%;border-radius:100px;transition:width .6s ease}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f8fafc;font-size:13px}
.stat-row:last-child{border-bottom:none}
.activity-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #f8fafc;font-size:12px}
.activity-item:last-child{border-bottom:none}
.act-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}

/* ── TOOLBAR ── */
.tb{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}

/* ── ALERT ── */
.alert-venc{background:#fee2e2;border:1px solid #fecaca;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--red);display:flex;align-items:center;justify-content:space-between}

/* ── MARCA: acentos dorados ── */
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--navy) 0%,var(--brand) 40%,#C99A5B 100%);opacity:.55}
.btn-gold{background:var(--gold-grad);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.15)}.btn-gold:hover{filter:brightness(1.05)}
.modal h3{color:var(--navy)}
.modal.wide{max-width:820px}
.sec-t{font-size:11px;font-weight:800;color:var(--gold-dk);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sec-t::after{content:'';flex:1;height:1px;background:var(--border)}
.chk-grid{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;text-transform:none;letter-spacing:0;margin:0;background:#fff}
.chk input{width:auto;margin:0;accent-color:var(--brand)}
.chk:has(input:checked){border-color:var(--brand);background:var(--brand-lt);color:var(--navy)}

/* ── SEGUIMIENTO DE PUBLICACIÓN ── */
.stepper{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:4px 2px 8px}
.step{flex:1;min-width:78px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.step::before{content:'';position:absolute;top:15px;left:-50%;right:50%;height:3px;background:#E6E3DC;z-index:0}
.step:first-child::before{display:none}
.step.done::before,.step.cur::before{background:var(--brand)}
.step-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:#fff;border:2px solid #E6E3DC;position:relative;z-index:1;color:var(--text3)}
.step.done .step-dot{background:var(--brand);border-color:var(--brand);color:#fff;font-size:13px;font-weight:800}
.step.cur .step-dot{background:var(--gold-grad);border-color:#C99A5B;box-shadow:0 0 0 4px rgba(201,154,91,.22)}
.step-l{font-size:10px;font-weight:600;color:var(--text3);margin-top:6px;line-height:1.25;padding:0 3px}
.step.done .step-l{color:var(--text2)}.step.cur .step-l{color:var(--navy);font-weight:800}
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:#E6E3DC}
.tl-i{position:relative;padding:0 0 14px}
.tl-i::before{content:'';position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--brand)}
.tl-i.rej::before{border-color:var(--red)}.tl-i.ok::before{border-color:var(--green);background:var(--green)}
.tl-h{font-size:13px;font-weight:700;color:var(--text);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl-m{font-size:11px;color:var(--text3);margin-top:1px}
.tl-n{font-size:12px;color:var(--text2);margin-top:4px;white-space:pre-wrap;line-height:1.5}
.pub-meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.pub-meta div{background:#FAFAF7;border:1px solid var(--border);border-radius:10px;padding:8px 11px}
.pub-meta>div>span{display:block;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
.pub-meta strong{font-size:12.5px;color:var(--text);word-break:break-word}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:#EFEDE7;border-radius:12px;padding:10px;min-height:120px}
.col-h{font-size:11px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;display:flex;justify-content:space-between;margin-bottom:8px}
.pcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.pcard:hover{transform:translateY(-1px);border-color:var(--brand)}
.idx{display:inline-flex;padding:1px 7px;border-radius:5px;font-size:10px;font-weight:700;background:var(--gold-lt);color:var(--gold-dk);margin:2px 3px 0 0}

/* ── APP INSTALADA: respeta la muesca y la barra inferior del teléfono ── */
.topbar{padding-top:max(14px,env(safe-area-inset-top))}
aside{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.page{padding-bottom:max(24px,env(safe-area-inset-bottom))}
.lw{padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
.toast{bottom:max(20px,env(safe-area-inset-bottom))}
.upd-bar{background:var(--gold-lt);color:var(--gold-dk);font-size:12px;font-weight:700;padding:8px 16px;display:flex;align-items:center;justify-content:center;gap:10px}
.off-bar{background:#FEF3C7;color:#92400E;font-size:12px;font-weight:600;padding:6px 16px;text-align:center}

.fg6{grid-template-columns:repeat(6,1fr)}
.hito-row{display:grid;grid-template-columns:1fr 80px 190px auto;gap:6px;margin-bottom:6px;align-items:center}
@media(max-width:700px){
  .fg6>div{grid-column:1/-1 !important}
  .hito-row{grid-template-columns:1fr 70px auto}.hito-row select{grid-column:1/-1;order:5}
}

/* ── Portal del cliente ── */
.pt{max-width:760px;margin:0 auto;font-size:14px}
.pt-hero{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#0F4C81,#0B2545);color:#fff;border-radius:18px;padding:20px 22px;margin-bottom:14px}
.pt-avatar{width:50px;height:50px;flex-shrink:0;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800}
.pt-hola{font-size:21px;font-weight:800;line-height:1.2}.pt-hero-sub{font-size:13.5px;opacity:.9;margin-top:3px;line-height:1.45}
.pt-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.pt-empty{text-align:center;padding:28px 18px;font-size:15px;line-height:1.7}
.pt-h2{font-size:15px;font-weight:800;color:var(--navy);margin:22px 4px 10px}
.pt-kicker{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--text3)}
.pt-big{font-size:30px;font-weight:800;color:var(--navy);line-height:1.15;margin:2px 0}
.pt-sub{font-size:13.5px;color:var(--text2);line-height:1.5}

.pt-alert{display:flex;gap:14px;align-items:flex-start;border-left:5px solid var(--gold)}
.pt-alert-red{border-left-color:#dc2626;background:#FFF7F7}.pt-alert-red .pt-big{color:#b91c1c}

.pt-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pt-btn{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;border:1px solid transparent;font-family:inherit;min-height:44px}
.pt-btn-ok{background:#15803d;color:#fff}.pt-btn-sec{background:#fff;color:var(--navy);border-color:var(--border)}
.pt-contacto{display:flex;align-items:center;gap:12px;background:#F0FDF4;border:1px solid #bbf7d0;color:#14532d;border-radius:16px;padding:14px 18px;text-decoration:none;margin:18px 0 8px;font-size:13.5px;line-height:1.4}
.pt-work-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.pt-work-t{font-size:16.5px;font-weight:800;color:var(--navy);line-height:1.3}.pt-work-tipo{font-size:12.5px;color:var(--text3);margin-top:3px}
.pt-chip{flex-shrink:0;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:800;white-space:nowrap}
.pt-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}.pt-row-l{font-size:13px;font-weight:700;color:var(--text2)}.pt-row-v{font-size:14px;font-weight:800;color:var(--navy)}
.pt-bar{height:12px;background:#F1EFEA;border-radius:999px;overflow:hidden}.pt-bar>div{height:100%;border-radius:999px;transition:width .4s}
.pt-etapa{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;background:#F8F7F3;border-radius:12px;padding:12px 14px;margin-top:14px}
.pt-etapa-v{font-size:15px;font-weight:800;color:var(--navy);margin-top:2px}.pt-etapa-s{font-size:13px;color:var(--text2);margin-top:2px}
.pt-stepper{margin-top:10px;overflow-x:auto}
.pt-novedad{margin-top:14px;padding-top:12px;border-top:1px solid #f1f5f9}
.pt-nov-t{font-size:14px;font-weight:700;color:var(--navy);margin-top:4px}.pt-nov-n{font-size:13.5px;color:var(--text2);line-height:1.55;margin-top:4px;white-space:pre-line}
.pt-det{margin-top:10px}.pt-det summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--brand);padding:6px 0}
.pt-link-r{text-align:right;margin-top:6px;font-size:13px}.pt-link-r a{color:var(--brand);font-weight:700;text-decoration:none}
.pt-fechas{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text2);margin-top:14px}
.pt-docs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pt-doc{display:inline-flex;align-items:center;gap:5px;background:#F1F5FA;color:var(--brand);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;text-decoration:none;min-height:38px}
.pt-saldo{text-align:center;padding:22px 18px}.pt-saldo .pt-bar{max-width:420px;margin:14px auto 0}
.pt-cuota{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid #f1f5f9}.pt-cuota:last-child{border-bottom:0}
.pt-cuota-ic{font-size:20px;line-height:1.2}.pt-cuota-t{font-size:14px;font-weight:700;color:var(--navy)}.pt-cuota-s{font-size:12.5px;font-weight:700;margin-top:3px}
.pt-cuota-abs{font-size:12px;color:#15803d;margin-top:6px;line-height:1.6}.pt-cuota-m{font-size:16px;font-weight:800;color:var(--navy)}
.pt-tabs{display:none}
.wf-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.wf-lbl{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);min-width:52px}
.wf-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;color:var(--text2);cursor:pointer}
.wf-chip b{font-size:11px;background:#F1EFEA;border-radius:999px;padding:1px 7px;color:var(--text2)}.wf-chip.on{background:var(--navy);border-color:var(--navy);color:#fff}.wf-chip.on b{background:rgba(255,255,255,.25);color:inherit}
.wf-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:4px 0 14px}.wf-sum>div{background:#fff;border:1px solid var(--border);border-radius:12px;padding:9px 12px}
.wf-sum span{display:block;font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}.wf-sum strong{font-size:17px;color:var(--navy)}
.wcard-hd{gap:12px}
.ct-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.ct-tabs button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:12.5px;font-weight:700;color:var(--text2);cursor:pointer}
.ct-tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ct-t{width:100%;font-size:12.5px;border-collapse:collapse}.ct-t td,.ct-t th{padding:7px 10px;border-bottom:1px solid #f1f5f9}.ct-t tfoot td{background:#F8F7F3}
.ct-sec{font-weight:800;color:var(--gold-dk);letter-spacing:.5px;font-size:11.5px;padding-top:12px !important}

function normalizarUsuarioAdmin(r){
  return{
    id:r.id,
    name:r.nombre||r.name||'',
    nombre:r.nombre||r.name||'',
    u:r.usuario||r.u||'',
    username:r.usuario||r.u||'',
    tieneClave:r.tieneClave||'',
    role:r.role||'admin',
    activo:r.activo
  }
}
const TIPO_PUB='Asesoramiento metodológico de publicación'
const TIPO_LIBRO='Asesoría para publicación de libros'
const TIPOS=[TIPO_PUB,TIPO_LIBRO,'Asesoría de tesis/proyectos','Análisis estadístico','Artículo científico','Publicación en revistas','Revisión bibliográfica','Diseño de instrumentos','Otro']
const ESTADOS=['Nuevo','En progreso','Revisión','Completado','Cancelado']

// ─── MODELOS DE CONTRATO POR TIPO DE TRABAJO ─────────────────────────────────
// Cada tipo de trabajo usa un modelo de contrato y un conjunto de campos específicos
// (guardados como JSON en la columna "detalles" de la hoja Trabajos).
function modeloTrabajo(tipo){
  if(tipo===TIPO_PUB||tipo==='Artículo científico'||tipo==='Publicación en revistas')return'publicacion'
  if(tipo===TIPO_LIBRO||tipo==='Publicación de libros'||tipo==='Capítulo de libro')return'libro'
  if(tipo==='Asesoría de tesis/proyectos')return'tesis'
  if(tipo==='Análisis estadístico')return'estadistica'
  if(tipo==='Revisión bibliográfica'||tipo==='Diseño de instrumentos')return'revision'
  return'general'
}
const esPublicacion=t=>!!t&&modeloTrabajo(t.tipo)==='publicacion'
// Ícono, color y nombre de cada familia de trabajos (para listas y filtros)
const TIPO_VIS={
  publicacion:{ic:'📰',l:'Artículos científicos',c:'#0F4C81',bg:'#E3ECF6'},
  libro:{ic:'📖',l:'Libros',c:'#8E6630',bg:'#F5EBDC'},

  revision:{ic:'📚',l:'Revisión e instrumentos',c:'#15803d',bg:'#DCFCE7'},
  general:{ic:'💼',l:'Otros servicios',c:'#475569',bg:'#F1F5F9'}
}
function visTrabajo(t){const m=modeloTrabajo(t&&t.tipo),v=TIPO_VIS[m]||TIPO_VIS.general;return t&&t.tipo==='Diseño de instrumentos'?Object.assign({},v,{ic:'📝'}):v}
function htmlIcoTrabajo(t,px){const v=visTrabajo(t),z=px||38;return'<span title="'+esc(t&&t.tipo||'')+'" style="flex-shrink:0;width:'+z+'px;height:'+z+'px;border-radius:'+Math.round(z*0.3)+'px;background:'+v.bg+';display:inline-flex;align-items:center;justify-content:center;font-size:'+Math.round(z*0.52)+'px;line-height:1">'+v.ic+'</span>'}
// Pendiente: trabajo no terminado ni cancelado · con atraso: tiene cuotas vencidas
const trabajoPendiente=t=>t.estado!=='Completado'&&t.estado!=='Cancelado'
const trabajoConAtraso=t=>data.cuotas.some(c=>c.trabajoId===t.id&&cStat(c)==='vencido')
function detallesDe(t){
  if(!t||!t.detalles)return{}
  if(typeof t.detalles==='object')return t.detalles
  try{return JSON.parse(t.detalles)||{}}catch(e){return{}}
}

// Convierte cualquier string de fecha a YYYY-MM-DD para input type="date"
function toISO(s){
  if(!s||s==='')return''
  s=String(s).trim()
  // Already ISO: 2026-03-15
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10)
  // Google Sheets US format: M/D/YYYY or MM/DD/YYYY
  const m1=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/)
  if(m1)return m1[3]+'-'+m1[1].padStart(2,'0')+'-'+m1[2].padStart(2,'0')
  // DD-MM-YYYY
  const m2=s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/)
  if(m2)return m2[3]+'-'+m2[2].padStart(2,'0')+'-'+m2[1].padStart(2,'0')
  // Sheets Date object string: "Sun Apr 07 2026 00:00:00 GMT..."
  const m3=s.match(/(\d{4}) (\d{2}:\d{2}:\d{2})/)
  if(m3){try{const d=new Date(s);if(!isNaN(d.getTime())){const y=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0');return y+'-'+mo+'-'+dy}}catch(e){}}
  // ISO with time: 2026-04-07T10:30:00
  const m4=s.match(/^(\d{4}-\d{2}-\d{2})T/)
  if(m4)return m4[1]
  // Native parse fallback
  try{const d=new Date(s);if(!isNaN(d.getTime())){const y=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0');return y+'-'+mo+'-'+dy}}catch(e){}
  return''
}

// Formatea fecha larga: "Lunes, 30 de marzo 2026"
function fmtD(s){
  if(!s||s==='---'||s==='')return'—'
  const iso=toISO(s)
  if(!iso||iso==='')return s||'—'
  try{
    // Parse as local date (avoid UTC shift)
    const p=iso.split('-')
    const d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]))
    if(isNaN(d.getTime()))return s
    return DIAS_FULL[d.getDay()]+', '+d.getDate()+' de '+MESES_FULL[d.getMonth()].toLowerCase()+' '+d.getFullYear()
  }catch(e){return s}
}

// Formato corto: "15 mar 2026"
function fmtDCorto(s){
  if(!s||s==='')return'—'
  const iso=toISO(s)
  if(!iso)return s
  try{
    const p=iso.split('-')
    const d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]))
    if(isNaN(d.getTime()))return s
    return d.getDate()+' '+MESES_FULL[d.getMonth()].slice(0,3).toLowerCase()+' '+d.getFullYear()
  }catch(e){return s}
}

// Cargar desde localStorage o usar defaults
function cargarTpls(){
  try{
    const saved=localStorage.getItem('wa_tpls_v5')
    if(!saved) return WA_TPLS_DEFAULT.map(function(t){return Object.assign({},t)})
    const parsed=JSON.parse(saved)
    // Check emoji integrity: broken char or missing emoji in default templates
    const hasBroken=parsed.some(function(t){
      return t.msg&&(t.msg.indexOf('\uFFFD')>-1||t.msg.indexOf('\u0000')>-1)
    })
    if(hasBroken){
      localStorage.removeItem('wa_tpls_v5')
      return WA_TPLS_DEFAULT.map(function(t){return Object.assign({},t)})
    }
    // Merge: keep user's custom templates, but refresh default templates
    // that have broken emojis (no emoji chars when they should have them)
    var merged=parsed.map(function(t){
      // Renovación de marca: corrige el nombre antiguo en plantillas guardadas
      if(t.msg&&t.msg.indexOf('Research Assesor')>-1) t=Object.assign({},t,{msg:t.msg.replace(/Research Assesor/g,'Research Assessor')})
      var def=WA_TPLS_DEFAULT.find(function(d){return d.id===t.id})
      if(def){
        // If saved template lacks emojis that default has, use default
        var defHasEmoji=/[\u{1F300}-\u{1FFFF}]/u.test(def.msg)
        var savedHasEmoji=/[\u{1F300}-\u{1FFFF}]/u.test(t.msg)
        if(defHasEmoji&&!savedHasEmoji) return Object.assign({},def)
      }
      return t
    })
    // Add any default templates not in saved
    WA_TPLS_DEFAULT.forEach(function(d){
      if(!merged.some(function(t){return t.id===d.id})) merged.push(Object.assign({},d))
    })
    return merged
  }catch(e){return WA_TPLS_DEFAULT.map(function(t){return Object.assign({},t)})}
}
function guardarTpls(tpls){
  try{localStorage.setItem('wa_tpls_v5',JSON.stringify(tpls))}catch(e){}
}

// Solo "ping" y "verificar" son públicos (GET). Todo lo demás va por POST con la
// sesión (token firmado por el servidor); sin sesión, el servidor no entrega datos.
async function apiGet(action){
  action=action||'getData'
  if(action==='getData')return apiPost({action:'getData'})
  try{
    const r=await fetch(API+'?action='+action+'&t='+Date.now())
    return await r.json()
  }catch(e){return{error:e.message}}
}

async function apiPost(body){
  if(SESION&&SESION.token&&!body.token)body=Object.assign({token:SESION.token},body)
  try{
    const r=await fetch(API,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(body)
    })
    const text=await r.text()
    let j
    try{j=JSON.parse(text)}
    catch(pe){return{error:'Respuesta no JSON: '+text.slice(0,100)}}
    // Sesión vencida o revocada (cambio de contraseña, usuario desactivado): volver al inicio de sesión
    const tokUsado=body.token||(body.auth&&body.auth.token)
    if(j&&j.codigo==='SIN_SESION'&&user&&SESION&&tokUsado===SESION.token)setTimeout(function(){if(SESION&&SESION.token===tokUsado)cerrarSesion('Tu sesión expiró. Vuelve a iniciar sesión.')},0)
    return j
  }catch(e){
    console.error('[apiPost] fetch error:',e.name,e.message,body&&body.action)
    return{error:e.message+'  ('+e.name+')'}
  }
}

function leerSesion(){
  try{const s=JSON.parse(localStorage.getItem(SES_KEY)||'null');if(s&&s.token&&s.user&&(s.user.exp||0)>Date.now())return s}catch(e){}

}

// Contraseña aleatoria legible (para portales de clientes y colaboradores)
function claveAleatoria(n){
  const abc='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=new Uint32Array(n||10)
  crypto.getRandomValues(r);return Array.from(r,x=>abc[x%abc.length]).join('')
}

    const snap=modal&&modal===_modalDibujado?_capturarModal():null

let _modalDibujado=null
function _claveCampo(el){return el.id||(el.name?el.name+'|'+el.value:'')}
function _capturarModal(){
  const m=document.querySelector('.modal');if(!m)return null
  const o={}
  m.querySelectorAll('input,select,textarea').forEach(function(el){
    const k=_claveCampo(el);if(!k)return
    o[k]=el.type==='checkbox'?el.checked:el.value
  })
  return o
}
// Redibuja el formulario abierto desde su estado (modal.rec): los campos que coinciden con "re" toman el valor
// del estado; los demás (clave del certificado, casillas sueltas) conservan lo escrito.
function drawDesdeEstado(re){
  const snap=_capturarModal()||{};Object.keys(snap).forEach(function(k){if(re.test(k))delete snap[k]})
  _modalDibujado=null;draw();_restaurarModal(snap);_modalDibujado=modal
}
const _factDraw=()=>drawDesdeEstado(/^(fi_|fc_(?!mail$))/)
function _restaurarModal(o){
  const m=document.querySelector('.modal');if(!m)return
  m.querySelectorAll('input,select,textarea').forEach(function(el){
    const k=_claveCampo(el);if(!(k in o))return
    if(el.type==='checkbox')el.checked=o[k];else el.value=o[k]
  })
}

// Compute real paid per cuota from abonos (authoritative source)
function abonoPaid(cuotaId){
  return(data.abonos||[]).reduce(function(s,a){
    return a.cuotaId===cuotaId?s+parseFloat(a.monto||0):s
  },0)
}
// Use abonos as source of truth; fallback to c.pagado if no abonos recorded
function realPaid(c){
  var fromAbonos=abonoPaid(c.id)
  // If abonos exist for this cuota, use that sum; else use c.pagado field
  return fromAbonos>0?fromAbonos:parseFloat(c.pagado||0)
}
function cStat(c){
  var paid=realPaid(c),acordado=parseFloat(c.acordado||0)
  if(paid>=acordado&&acordado>0)return'pagado'
  if(paid>0)return'parcial'
  if(c.fechaVencimiento&&new Date(c.fechaVencimiento)<new Date())return'vencido'
  return'pendiente'
}
function cColor(s){return{pagado:'green',parcial:'blue',vencido:'red',pendiente:'amber'}[s]||'gray'}
function wBal(t){
  const cs=data.cuotas.filter(c=>c.trabajoId===t.id)
  const paid=cs.reduce((s,c)=>s+realPaid(c),0)
  const total=parseFloat(t.total||0)
  const bal=Math.max(total-paid,0)
  return{total,paid,bal,pct:total>0?Math.min(Math.round(paid/total*100),100):0}
}
function waUrl(phone,msg){
  const c=String(phone||'').replace(/\D/g,'')
  const ec=c.startsWith('0')?'593'+c.slice(1):c.startsWith('593')?c:'593'+c
  return'https://wa.me/'+ec+'?text='+encodeURIComponent(msg)
}
function waTpl(id,vars){
  WA_TPLS=cargarTpls()
  const t=WA_TPLS.find(x=>x.id===id)||WA_TPLS[0]
  vars=Object.assign({formas_pago:textoFormasPago(),cuentas:textoFormasPago(true)},vars||{})
  let msg=t.msg
  // Recordatorios y avisos de pago: se agregan las formas de pago antes de la firma (si se activó en Configuración)
  if(cfgFormasPago().enCobros&&t.categoria==='cobros'&&t.id!=='paid'&&vars.formas_pago&&!/{{(formas_pago|cuentas)}}/.test(msg)){
    const i=msg.lastIndexOf('\n\n—');msg=i>-1?msg.slice(0,i)+'\n\n{{formas_pago}}'+msg.slice(i):msg+'\n\n{{formas_pago}}'
  }
  return msg.replace(/{{(\w+)}}/g,(_,k)=>vars[k]!==undefined?String(vars[k]):'').replace(/\n{3,}/g,'\n\n').trim()
}
function toast(msg,err){
  const d=document.createElement('div');d.className='toast'
  d.style.background=err?'var(--red)':'var(--green)'
  d.innerHTML=(err?'<span>✗</span>':'<span>✓</span>')+' '+esc(msg)
  document.body.appendChild(d);setTimeout(()=>d.remove(),3000)
}

async function loadData(){
  loading=true;syncMsg='Cargando...';syncErr=false;draw()
  const r=await apiGet('getData')
  if(r&&!r.error){
    data=mapData(r)
    guardarCopiaLocal(data)
    sinConexion=false
    // Listas de accesos (sin contraseñas: el servidor nunca las envía)
    window._clientUsers=r.usuariosCliente||[]
    window._appUsers=(r.usuarios||[]).map(normalizarUsuarioAdmin)
    if(r.user&&user){user=Object.assign({},user,r.user)}
    syncMsg='✓ '+new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})
    syncErr=false
  }else{
    syncMsg='Error conexión'+(r&&r.error?' — '+r.error:'');syncErr=true
    if(r&&r.codigo==='SIN_SESION'){loading=false;return}
    if(r&&r.codigo==='CAMBIAR_CLAVE'){loading=false;syncMsg='';syncErr=false;openModal('clave',{obligatorio:true});return}
    const errRed=!r||r.error==='Failed to fetch'||r.error==='NetworkError'||/network|fetch|load failed/i.test(r.error||'')
    // Sin internet: usar la última copia guardada en este dispositivo (solo lectura)
    const copia=errRed?leerCopiaLocal():null
    if(copia){
      data=mapData(copia.data);sinConexion=true
      syncMsg='📴 Sin conexión — datos del '+new Date(copia.t).toLocaleString('es-EC',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})
    }else if(window._demoData&&errRed){
      // Demo solo si hay error de red total y nunca se cargaron datos reales aquí
      data=mapData(window._demoData)
      syncMsg='⚡ Modo demo — sin conexión al Sheets'
    }
  }
  loading=false;draw()
}

async function saveRec(tabla,rec,isNew){
  // Optimistic update: update UI immediately, then sync in background
  const key=tabla.toLowerCase()
  if(data[key]){
    data[key]=isNew?[...data[key],rec]:data[key].map(x=>x.id===rec.id?rec:x)
  }
  modal=null;syncMsg='Guardando...';syncErr=false;draw()
  try{
    const r=await apiPost({action:isNew?'insertar':'actualizar',tabla,fila:rec,id:rec.id})
    if(r&&r.ok){
      syncMsg='✓ '+new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})
      toast('Guardado ✓')
      // Silent background reload - don't block UI
      apiGet('getData').then(function(rd){
        if(rd&&!rd.error){
          data=mapData(rd)
          syncMsg='✓ '+new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})
          draw()
        }
      })
    }else{
      const msg=r&&r.error?r.error:'Sin respuesta'
      syncMsg='Error: '+msg;syncErr=true
      toast('Error: '+msg,'err')
      draw()
    }
  }catch(err){
    syncMsg='Error: '+err.message;syncErr=true
    toast('Error: '+err.message,'err');draw()
  }
}
async function delRec(tabla,id,msg){
  if(!confirm(msg||'¿Eliminar este registro?'))return
  // Optimistic: remove from UI immediately
  const key=tabla.toLowerCase()
  if(data[key]) data[key]=data[key].filter(function(x){return x.id!==id})
  syncMsg='Eliminando...';syncErr=false;draw()
  try{
    const r=await apiPost({action:'eliminar',tabla,id})
    if(r&&r.ok){
      toast('Eliminado ✓');syncMsg='✓ Eliminado'
      apiGet('getData').then(function(rd){
        if(rd&&!rd.error){
          data=mapData(rd)
          draw()
        }
      })
    }else{
      const msg2=r&&r.error?r.error:'Sin respuesta'
      syncMsg='Error: '+msg2;syncErr=true
      toast('Error: '+msg2,'err')
      await loadData()  // reload to restore removed item
    }
  }catch(err){
    syncMsg='Error: '+err.message;syncErr=true
    toast('Error: '+err.message,'err')
    await loadData()
  }
}

// El servidor valida usuario y contraseña (administradores, colaboradores y clientes)
// y entrega una sesión firmada; la app nunca recibe ni compara contraseñas.
async function doLogin(){
  const u=v('lu').trim(),p=v('lp')
  const e=document.getElementById('lerr'),btn=document.getElementById('l_btn')
  if(!u||!p){e.textContent='Escribe tu usuario y contraseña';e.style.display='block';return}
  e.style.display='none';if(btn){btn.disabled=true;btn.textContent='Verificando…'}
  const r=await apiPost({action:'login',usuario:u,clave:p})
  if(btn){btn.disabled=false;btn.textContent='Ingresar →'}
  if(!r||!r.ok||!r.token){
    const red=!r||/fetch|network|load failed/i.test(r.error||'')
    e.textContent=red?'Sin conexión con el servidor. Revisa tu internet.':(r.error||'No se pudo iniciar sesión')
    if(!red&&r&&/Acci[oó]n no reconocida|desconocida/i.test(r.error||''))e.textContent='El servidor todavía no tiene la versión de seguridad (Apps Script v7.8).'
    e.style.display='block';return
  }
  guardarSesion(r.token,r.user);user=r.user
  // Accesos directos del ícono instalado (?p=propuestas, etc.)
  const pIni=new URLSearchParams(location.search).get('p')
  if(user.role==='admin'||user.role==='lector'){if(pIni&&NAV_MAIN.some(n=>n.id===pIni))page=pIni;else page='dashboard'}
  // Contraseña heredada de una versión anterior: el servidor no entrega datos hasta cambiarla
  if(r.debeCambiar){openModal('clave',{obligatorio:true});return}
  await loadData()
}

// Gráfico de barras (real/proyectado por mes) dibujado en SVG con coordenadas fijas,
// para no depender de que el navegador resuelva alturas en % dentro de flexbox anidado.
function barsChartSvg(allMonths,maxVal){
  const svgW=700,svgH=130,colW=svgW/allMonths.length,barW=colW*0.55,baseY=110,maxBarH=76
  let s='<svg viewBox="0 0 '+svgW+' '+svgH+'" preserveAspectRatio="none" style="width:100%;height:130px;display:block">'
  allMonths.forEach(function(m,i){
    const isProj=m.isFuture
    const val=isProj?m.proj:m.real
    const hasVal=val>0
    const cx=i*colW+colW/2
    if(!hasVal){
      s+='<text x="'+cx+'" y="'+(baseY-20)+'" font-size="8" fill="#94a3b8" text-anchor="middle" font-weight="700">—</text>'
      s+='<line x1="'+cx+'" y1="'+(baseY-14)+'" x2="'+cx+'" y2="'+baseY+'" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>'
      s+='<circle cx="'+cx+'" cy="'+baseY+'" r="4" fill="#fff" stroke="#94a3b8" stroke-width="2"/>'
      return
    }
    const h=Math.max(Math.round(val/maxVal*maxBarH),6)
    const y=baseY-h
    const fill=isProj?'rgba(126,58,242,.45)':(m.isCurrent?'var(--brand)':'rgba(15,76,129,.65)')
    const lblFill=isProj?'var(--violet)':(m.isCurrent?'var(--brand)':'#6b7280')
    s+='<rect x="'+(cx-barW/2)+'" y="'+y+'" width="'+barW+'" height="'+h+'" rx="4" fill="'+fill+'"'+(isProj?' stroke="var(--violet)" stroke-width="2" stroke-dasharray="4,3"':'')+'>'
      +'<title>'+(isProj?'Proyectado':'Cobrado')+': $'+val+'</title></rect>'
    s+='<text x="'+cx+'" y="'+(y-6)+'" font-size="8" fill="'+lblFill+'" text-anchor="middle" font-weight="700">$'+fmt(val)+'</text>'
  })
  s+='</svg>'
  return s
}
function htmlDash(){
  // Primera carga (aún sin datos): mostrar skeleton en vez de KPIs y gráfico en $0.
  // En refrescos posteriores (loading=true pero ya hay datos) se sigue mostrando lo último cargado.
  if(loading&&!data.clientes.length&&!data.trabajos.length){
    return'<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 20px;color:var(--text3)">'
      +'<div class="spin" style="font-size:30px;margin-bottom:14px">⟳</div>'
      +'<div style="font-size:14px;font-weight:600">Cargando dashboard…</div>'
      +'</div>'
  }
  const {clientes,trabajos,cuotas,abonos,reuniones}=data
  const now=new Date()
  const hoy=now.toISOString().split('T')[0]
  const mesActual=now.getMonth(), anioActual=now.getFullYear()

  // ── KPI calcs ──
  const cobrado    =abonos.reduce((s,a)=>s+parseFloat(a.monto||0),0)
  const totalFact  =cuotas.reduce((s,c)=>s+parseFloat(c.acordado||0),0)
  const pendiente  =cuotas.filter(c=>cStat(c)!=='pagado').reduce((s,c)=>s+Math.max(parseFloat(c.acordado||0)-realPaid(c),0),0)
  const vencidas   =cuotas.filter(c=>cStat(c)==='vencido')
  const activos    =trabajos.filter(t=>t.estado!=='Completado'&&t.estado!=='Cancelado').length
  const completados=trabajos.filter(t=>t.estado==='Completado').length
  const cobPct     =totalFact>0?Math.round(cobrado/totalFact*100):0
  const proxR      =reuniones.filter(r=>toISO(r.fecha||'')>=hoy).sort((a,b)=>toISO(a.fecha||'').localeCompare(toISO(b.fecha||''))).slice(0,3)

  // ── 12 meses de datos (6 pasados + mes actual + 5 futuros) ──
  const allMonths = Array.from({length:14},(_,i)=>{
    const d=new Date(now); d.setDate(1); d.setMonth(d.getMonth()-8+i)
    const m=d.getMonth(), y=d.getFullYear()
    const isPast=y<anioActual||(y===anioActual&&m<mesActual)
    const isCurrent=y===anioActual&&m===mesActual
    const isFuture=y>anioActual||(y===anioActual&&m>mesActual)

    // Cobrado real en ese mes
    const real=abonos.reduce((s,a)=>{
      const _af=toISO(a.fecha||'');const ad=_af?new Date(_af+'T12:00:00'):new Date(NaN)
      return(ad.getMonth()===m&&ad.getFullYear()===y)?s+parseFloat(a.monto||0):s
    },0)

    // Proyectado: cuotas pendientes/parciales con vencimiento en ese mes
    const proj=cuotas.filter(c=>{
      const st=cStat(c)
      if(st==='pagado')return false
      const _cv=toISO(c.fechaVencimiento||'');const dv=_cv?new Date(_cv+'T12:00:00'):new Date(NaN)
      return dv.getMonth()===m&&dv.getFullYear()===y
    }).reduce((s,c)=>s+(parseFloat(c.acordado||0)-parseFloat(c.pagado||0)),0)

    return{label:MESES[m],m,y,real:Math.round(real),proj:Math.round(proj),isPast,isCurrent,isFuture}
  })

  // Meses pasados (incluye actual)
  const pastMonths   = allMonths.filter(x=>x.isPast||x.isCurrent)
  const futureMonths = allMonths.filter(x=>x.isFuture)

  // Ingresos reales del mes actual — calculado directamente para mayor confiabilidad
  const ingresoMesActual=abonos.reduce((s,a)=>{
    const _af=toISO(a.fecha||'');if(!_af)return s
    const ad=new Date(_af+'T12:00:00')
    return(ad.getMonth()===mesActual&&ad.getFullYear()===anioActual)?s+parseFloat(a.monto||0):s
  },0)
  // Ingresos mes anterior
  const _prevM=mesActual===0?11:mesActual-1, _prevY=mesActual===0?anioActual-1:anioActual
  const ingresoMesAnterior=abonos.reduce((s,a)=>{
    const _af=toISO(a.fecha||'');if(!_af)return s
    const ad=new Date(_af+'T12:00:00')
    return(ad.getMonth()===_prevM&&ad.getFullYear()===_prevY)?s+parseFloat(a.monto||0):s

  // Proyección total futura

  // Mejor mes futuro

  // Variación mes a mes

  const maxVal=Math.max(...allMonths.map(x=>Math.max(x.real,x.proj)),1)

  // ── Estado cuotas ──

  const totalTrab=Math.max(trabajos.length,1)

  const tipoDist={}
  trabajos.forEach(t=>{const k=t.tipo||'Otro';tipoDist[k]=(tipoDist[k]||0)+1})
  const topTipos=Object.entries(tipoDist).sort((a,b)=>b[1]-a[1]).slice(0,5)
  let h=''

    +'<div class="kpi" style="cursor:pointer" onclick="cSt=\'Todos\';goTo(\'cobros\')"><div class="kpi-label">Mes '+MESES[mesActual]+'</div><div class="kpi-value" style="color:var(--brand)">$'+fmt(ingresoMesActual)+'</div><div class="kpi-sub"><span style="color:'+(variacion>=0?'var(--green)':'var(--red)')+'">'+(variacion>=0?'▲':'▼')+' '+Math.abs(variacion)+'%</span> vs mes anterior</div><div class="kpi-icon">📈</div></div>'
    +'<div class="kpi" style="cursor:pointer" onclick="cSt=\'pendiente\';goTo(\'cobros\')"><div class="kpi-label">Proyección futura</div><div class="kpi-value" style="color:var(--violet)">$'+fmt(proyeccionTotal)+'</div><div class="kpi-sub">próximos 5 meses</div><div class="kpi-icon">🔮</div></div>'
    +'<div class="kpi" style="cursor:pointer" onclick="cSt=\'vencido\';goTo(\'cobros\')"><div class="kpi-label">Por cobrar</div><div class="kpi-value" style="color:var(--amber)">$'+fmt(pendiente)+'</div><div class="kpi-sub">'+(vencidas.length>0?'<span style="color:var(--red)">⚠ '+vencidas.length+' vencidas — clic para ver</span>':'✅ al día')+'</div><div class="kpi-icon">⏰</div></div>'
    +'</div>'

  // ══ GRÁFICO PRINCIPAL: Ingresos reales + Proyección ══════════════════
  h+='<div class="chart-wrap" style="margin-bottom:16px">'
    +'<div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px">'
    +'<div><div class="chart-title">Ingresos reales vs Proyección de cobros</div>'
    +'<div class="chart-sub">Últimos 6 meses cobrados · Mes actual · Próximos 5 meses proyectados</div></div>'
    

    // ── CHART: una sola fila combinada — real donde ya pasó, proyectado en el futuro ──
    // Así ningún mes queda con espacio vacío en los extremos.
    +'<div style="display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap">'
    +'<div style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:2px;background:var(--brand);display:inline-block"></span><span style="font-size:10px;font-weight:700;color:var(--text3)">COBRADO REAL</span></div>'

  function donutSvg(segs,total,cx,cy,r){
    if(!total)return'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#f1f5f9" stroke-width="18"/>'
    let angle=-90,svg=''
    segs.forEach(([val,color])=>{
      if(!val)return
      const sweep=val/total*360,rad=Math.PI/180
      const x1=cx+r*Math.cos(angle*rad),y1=cy+r*Math.sin(angle*rad)
      angle+=sweep
      const x2=cx+r*Math.cos(angle*rad),y2=cy+r*Math.sin(angle*rad)
      svg+=`<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${sweep>180?1:0} 1 ${x2} ${y2} Z" fill="${color}" opacity=".9"/>`
    })

        +(r.link?'<a href="'+esc(r.link)+'" target="_blank" class="btn btn-g btn-sm" style="text-decoration:none">🎥</a>':'')

  const actTrab=trabajos.filter(t=>t.estado!=='Completado'&&t.estado!=='Cancelado').slice(0,4)

}

// ─── COBROS ───────────────────────────────────────────────────────────────────
function htmlCobros(){
  const q=search.toLowerCase(),_btnRep='<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn btn-g btn-sm" style="margin-right:6px" onclick="goTo(\'ingresos\')">📈 Ver tablero de ingresos</button><button class="btn btn-p btn-sm" onclick="openModal(\'reporteIngresos\',{})">📊 Informe de ingresos (Excel / PDF)</button></div>'
  const _ordT={};data.trabajos.forEach((t,i)=>{_ordT[t.id]=i})
  const rows=data.cuotas.map(c=>{
    const t=data.trabajos.find(x=>x.id===c.trabajoId)
    const cl=t?pagadorDe(c,t):null
    const st=cStat(c)
    return{...c,_t:t,_cl:cl,_st:st}
  }).filter(c=>{
    // Skip cuotas with no trabajo asociado (huérfanas)
    if(!c._t)return false
    // Skip if no client info at all
    if(!c._cl&&!(c.clienteNombre||c._t.clienteNombre))return false
    // Apply filters
    const nameMatch=(c._cl&&c._cl.nombre||c.clienteNombre||'')+(c._t&&c._t.titulo||c.trabajoTitulo||'')
    return(cSt==='Todos'||cSt===c._st)&&(!q||nameMatch.toLowerCase().includes(q))
  })
    // Del trabajo ingresado más recientemente al más antiguo; dentro de cada trabajo, cuota 1, 2, 3…
    .sort((a,b)=>(_ordT[b.trabajoId]||0)-(_ordT[a.trabajoId]||0)||new Date(a.fechaVencimiento)-new Date(b.fechaVencimiento))

  const cobrado=data.abonos.reduce((s,a)=>s+parseFloat(a.monto||0),0)
  const pendiente=data.cuotas.filter(c=>cStat(c)!=='pagado').reduce((s,c)=>s+Math.max(parseFloat(c.acordado||0)-realPaid(c),0),0)
  const vencido=data.cuotas.filter(c=>cStat(c)==='vencido').reduce((s,c)=>s+Math.max(parseFloat(c.acordado||0)-realPaid(c),0),0)
  const total=data.cuotas.reduce((s,c)=>s+parseFloat(c.acordado||0),0)

  let h=_btnRep+'<div class="kpis">'
    +'<div class="kpi" style="cursor:pointer" onclick="cSt=\'Todos\';draw()"><div class="kpi-label">Total facturado</div><div class="kpi-value">$'+fmt(total)+'</div><div class="kpi-sub">'+data.cuotas.length+' cuotas</div><div class="kpi-icon">📋</div></div>'
    +'<div class="kpi" style="cursor:pointer" onclick="cSt=\'pagado\';draw()"><div class="kpi-label">Cobrado</div><div class="kpi-value" style="color:var(--green)">$'+fmt(cobrado)+'</div><div class="kpi-sub">clic para ver pagadas</div><div class="kpi-icon">✅</div></div>'
    +'<div class="kpi" style="cursor:pointer" onclick="cSt=\'pendiente\';draw()"><div class="kpi-label">Por cobrar</div><div class="kpi-value" style="color:var(--amber)">$'+fmt(pendiente)+'</div><div class="kpi-sub">clic para ver pendientes</div><div class="kpi-icon">⏰</div></div>'
    +(vencido>0?'<div class="kpi" style="cursor:pointer;animation:pulse 2s infinite" onclick="cSt=\'vencido\';draw()"><div class="kpi-label">⚠️ Vencido</div><div class="kpi-value" style="color:var(--red)">$'+fmt(vencido)+'</div><div class="kpi-sub">clic para ver vencidas</div><div class="kpi-icon">🚨</div></div>':'')
    +'</div>'
  h+='<div class="tb"><input id="srch" placeholder="Buscar..." oninput="search=this.value;drawPage()" value="'+esc(search)+'" style="max-width:240px"/>'
    +['Todos','vencido','pendiente','parcial','pagado'].map(s=>'<button class="btn btn-sm '+(cSt===s?'btn-p':'btn-g')+'" onclick="cSt=\''+s+'\';drawPage()">'+s.charAt(0).toUpperCase()+s.slice(1)+'</button>').join('')
    +'<button class="btn btn-g btn-sm" style="margin-left:auto" onclick="exportCobros()">⬇ CSV</button></div>'
    +htmlCobrosFilterBadge()
  if(!rows.length)return h+'<div class="card"><p class="empty">Sin resultados</p></div>'
  rows.forEach(c=>{
    const st=c._st,_rp=realPaid(c),saldo=Math.max(parseFloat(c.acordado||0)-_rp,0)
    const today=new Date(),due=new Date(c.fechaVencimiento)
    const days=Math.ceil((due-today)/86400000)
    const bgc={pagado:'#dcfce7',parcial:'#E3ECF6',vencido:'#fee2e2',pendiente:'#fef3c7'}[st]||'#f9fafb'
    const bdc={pagado:'#bbf7d0',parcial:'#C9D9EB',vencido:'#fecaca',pendiente:'#fde68a'}[st]||'#e2e8f0'
    const phone=c._cl&&c._cl.telefono
    h+='<div style="background:'+bgc+';border:1px solid '+bdc+';border-radius:10px;margin-bottom:8px;overflow:hidden">'
      +'<div style="display:flex;align-items:center;gap:10px;padding:11px 15px;flex-wrap:wrap">'
      +'<div style="flex:1;min-width:150px"><strong style="font-size:13px">'+esc(c._cl&&c._cl.nombre||c.clienteNombre||'—')+'</strong>'
      +'<div style="font-size:11px;color:var(--text3)">'+esc(c._t&&c._t.titulo||c.trabajoTitulo||'—')+' — '+esc(c.label||'—')+'</div></div>'
      +'<div style="text-align:center;min-width:80px"><div style="font-weight:700;font-size:14px">$'+fmt(c.acordado)+'</div>'
      +(_rp>0?'<div style="font-size:10px;color:var(--green)">+$'+fmt(_rp)+'</div>':'')
      +(saldo>0&&st!=='pagado'?'<div style="font-size:11px;font-weight:600;color:var(--amber)">Saldo $'+fmt(saldo)+'</div>':'')
      +'</div>'
      +'<div style="text-align:center;min-width:85px"><div style="font-size:12px">'+fmtDCorto(c.fechaVencimiento||'')+'</div>'
      +(st!=='pagado'?'<div style="font-size:11px;color:'+(days<0?'var(--red)':days<=3?'var(--amber)':'var(--text3)')+'">'+(days<0?Math.abs(days)+'d vencido':days===0?'Hoy':'en '+days+'d')+'</div>':'')
      +'</div>'+bdg(st,cColor(st))
      +'<div style="display:flex;gap:5px;flex-wrap:wrap">'
      +(st!=='pagado'?'<button class="btn btn-green btn-sm" onclick="openModal(\'abono\',{cuotaId:\''+c.id+'\',trabajoId:\''+c.trabajoId+'\',label:\''+esc(c.label)+'\',acordado:\''+esc(c.acordado)+'\',pagado:\''+esc(c.pagado)+'\'})" >💵 Pago</button>':'' )
      +(phone?waBtnsCobros(c.id,c.trabajoId,phone,st):'')
      +'<button class="btn btn-g btn-sm" title="Editar cuota" onclick="editarCuota(\''+c.id+'\',\''+c.trabajoId+'\')" >✏️</button>'
      +'<button class="btn btn-r btn-sm" title="Eliminar cuota" onclick="delRec(\'Cuotas\',\''+c.id+'\',\'¿Eliminar esta cuota?\')" >🗑</button>'
      +'</div></div>'
    const abs=data.abonos.filter(a=>a.cuotaId===c.id)
    if(abs.length){
      h+='<div style="border-top:1px solid '+bdc+';padding:8px 15px">'
        +'<div style="font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.4px;margin-bottom:6px">PAGOS REGISTRADOS</div>'
        +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
        +abs.map(a=>{
          const _fd=toISO(a.fecha||'');const _fl=_fd?fmtDCorto(a.fecha):'—'
          return'<div style="background:#fff;border:1px solid #bbf7d0;border-radius:10px;padding:10px 14px;min-width:170px;max-width:240px">'
            +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'
            +'<span style="font-size:17px;font-weight:800;color:var(--green)">💸 $'+fmt(a.monto)+'</span>'
            +'<span style="display:flex;gap:4px">'
            +'<button class="btn btn-g btn-sm" style="padding:2px 7px;font-size:11px" title="Editar pago" onclick="editarAbono(\''+a.id+'\',\''+a.cuotaId+'\',\''+a.trabajoId+'\')">✏️</button>'
            +'<button class="btn btn-r btn-sm" style="padding:2px 7px;font-size:11px" title="Eliminar pago" onclick="eliminarAbono(\''+a.id+'\',\''+a.cuotaId+'\','+a.monto+')">🗑</button>'
            +'</span></div>'
            +'<div style="display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:11px">'
            +'<span style="font-weight:700;color:var(--text3)">📅 FECHA</span>'
            +'<span style="font-weight:600;color:var(--text2)">'+_fl+'</span>'
            +(a.comprobante
              ?'<span style="font-weight:700;color:var(--text3)">🆔 REF</span>'
               +'<span style="font-weight:700;color:#0369a1;background:#E3ECF6;border-radius:4px;padding:1px 5px">'+esc(a.comprobante)+'</span>'
              :'')
            +(a.nota?'<span style="color:var(--text3)">📝</span><span style="color:var(--text3)">'+esc(a.nota)+'</span>':'')
            +'</div>'+htmlFacturaDePago(a)+'</div>'
        }).join('')
        +'</div></div>'
    }
    h+='</div>'
  })
  return h
}

function waRec(cuotaId,trabajoId,phone,tplId){
  const c=data.cuotas.find(x=>x.id===cuotaId)
  const t=data.trabajos.find(x=>x.id===trabajoId)
  const cl=c&&t?pagadorDe(c,t):null
  if(!c||!phone)return
  const saldo=parseFloat(c.acordado||0)-parseFloat(c.pagado||0)
  // Total saldo pendiente del trabajo (solo lo que paga esta persona)
  const pid=pagadorIdDe(c,t),cuotasTrabajo=data.cuotas.filter(x=>x.trabajoId===trabajoId&&pagadorIdDe(x,t)===pid)
  const saldoTotal=cuotasTrabajo.reduce(function(s,x){return s+(parseFloat(x.acordado||0)-parseFloat(x.pagado||0))},0)
  const msg=waTpl(tplId,{
    nombre:cl&&cl.nombre||'',
    trabajo:t&&t.titulo||'',
    cuota:c.label||'',
    monto:fmt(c.acordado),
    pagado:fmt(c.pagado||0),
    saldo:fmt(saldo),
    saldo_total:fmt(saldoTotal),
    fecha:c.fechaVencimiento||''
  })
  window.open(waUrl(phone,msg),'_blank')
}
function exportCobros(){
  let csv='\uFEFFCliente,Trabajo,Cuota,Acordado,Pagado,Saldo,Vencimiento,Estado\n'
  data.cuotas.forEach(c=>{
    const t=data.trabajos.find(x=>x.id===c.trabajoId)
    const cl=t?data.clientes.find(x=>x.id===t.clienteId):null
    const saldo=parseFloat(c.acordado||0)-parseFloat(c.pagado||0)
    csv+='"'+[cl&&cl.nombre||'',t&&t.titulo||'',c.label||'',c.acordado||0,c.pagado||0,saldo.toFixed(2),c.fechaVencimiento||'',cStat(c)].join('","')+'"\n'
  })
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv)
  a.download='cobros_'+new Date().toISOString().slice(0,10)+'.csv';a.click()
}

// ─── DEUDORES ─────────────────────────────────────────────────────────────────
function htmlDeudores(){
  // Agrupa cuotas pendientes/parciales/vencidas por cliente
  const porCliente={}
  data.cuotas.forEach(c=>{
    if(cStat(c)==='pagado')return
    const t=data.trabajos.find(x=>x.id===c.trabajoId)
    const pid=t?pagadorIdDe(c,t):''
    if(!t||!pid)return
    const saldo=Math.max(parseFloat(c.acordado||0)-realPaid(c),0)
    if(saldo<=0)return
    const cl=data.clientes.find(x=>x.id===pid)
    if(!porCliente[pid])porCliente[pid]={cliente:cl,cuotas:[],total:0,vencidas:false}
    const st=cStat(c)
    porCliente[pid].cuotas.push({...c,_t:t,_saldo:saldo,_st:st})
    porCliente[pid].total+=saldo
    if(st==='vencido')porCliente[pid].vencidas=true
  })
  const q=search.toLowerCase()
  let lista=Object.values(porCliente).filter(d=>d.total>0&&(!q||(d.cliente&&d.cliente.nombre||'').toLowerCase().includes(q)))
  lista.sort((a,b)=>(b.vencidas-a.vencidas)||(b.total-a.total))

  const totalGeneral=lista.reduce((s,d)=>s+d.total,0)
  const nVencidos=lista.filter(d=>d.vencidas).length

function waDeudor(clienteId){
  const cl=data.clientes.find(c=>c.id===clienteId)
  if(!cl||!cl.telefono){toast('Cliente sin teléfono registrado','err');return}
  const trabajosCl=data.trabajos.filter(t=>esDelCliente(t,clienteId))
  const idsTrab=trabajosCl.map(t=>t.id)
  const cuotasPend=data.cuotas.filter(c=>idsTrab.includes(c.trabajoId)&&pagadorIdDe(c)===clienteId&&cStat(c)!=='pagado'&&Math.max(parseFloat(c.acordado||0)-realPaid(c),0)>0)
    .sort((a,b)=>new Date(a.fechaVencimiento)-new Date(b.fechaVencimiento))
  if(!cuotasPend.length){toast('Este cliente no tiene saldo pendiente','err');return}
  let totalSaldo=0
  const lineas=cuotasPend.map(c=>{
    const t=trabajosCl.find(x=>x.id===c.trabajoId)
    const pag=realPaid(c),saldo=Math.max(parseFloat(c.acordado||0)-pag,0)
    totalSaldo+=saldo
    return'📚 *'+(t?t.titulo:'')+'* — '+(c.label||'Cuota')
      +'\n   💰 Valor: $'+fmt(c.acordado)+(pag>0?' · Cancelado: $'+fmt(pag):'')+' · Saldo: $'+fmt(saldo)
      +'\n   📅 Vence: '+fmtDCorto(c.fechaVencimiento||'')
  }).join('\n\n')
  const msg='Hola '+cl.nombre+' 👋\n\nTe escribo para recordarte el estado de tus cuotas pendientes:\n\n'
    +lineas
    +'\n\n💵 *Total pendiente: $'+fmt(totalSaldo)+'*'
    +'\n\nSi ya realizaste algún pago, por favor envíame el comprobante para actualizarlo. Cualquier consulta, aquí estoy. 🙏'
    +(textoFormasPago()?'\n\n'+textoFormasPago():'')
    +'\n\n— Edison Bonifaz | Research Assessor'
  window.open(waUrl(cl.telefono,msg),'_blank')
}

function calUrl(r,clName){
  const tt=encodeURIComponent((r.titulo||'Reunión')+(clName?' — '+clName:''))
  const fechaISO=toISO(r.fecha||'')
  const dt=fechaISO.replace(/-/g,'')
  const horaClean=cleanHora(r.hora)
  const [hh,mm]=(horaClean!=='—'?horaClean:'10:00').split(':')
  const eh=String(parseInt(hh)+1).padStart(2,'0')
  const mmPad=(mm||'00').padStart(2,'0')
  return'https://calendar.google.com/calendar/r/eventedit?text='+tt+'&dates='+dt+'T'+hh+mmPad+'00/'+dt+'T'+eh+mmPad+'00&location='+encodeURIComponent(r.link||'')+'&details='+encodeURIComponent('Research Assessor\n'+(r.link||''))
}
function waMeet(rid){

  const msg=waTpl('meeting',{nombre:cl.nombre||'',fecha:fechaFmt,hora:horaFmt,plat:r.plataforma||'',link:r.link||''})
  window.open(waUrl(cl.telefono,msg),'_blank')
}
async function genMeet(titulo,fecha,hora){
  // Try Apps Script createMeet action
  try{
    const d=await apiPost({action:'createMeet',title:titulo,date:fecha||'',time:hora||'10:00',duration:60})
    if(d&&d.error&&/fetch|network/i.test(d.error))throw new TypeError(d.error)
    if(d&&d.ok&&d.meetLink)return d.meetLink
    // If script doesn't support createMeet yet, throw specific error
    if(d&&d.error&&d.error.includes('desconocida')){
      throw new Error('NEEDS_REDEPLOY')
    }
    if(d&&d.error)throw new Error(d.error)
  }catch(fe){
    if(fe.message==='NEEDS_REDEPLOY'||fe.name==='TypeError'){
      throw new Error('NEEDS_REDEPLOY')
    }
    throw fe
  }
  throw new Error('Sin enlace Meet en la respuesta del servidor.')
}

function submitCliente(id,conPropuesta){
  const nombre=v('f0');if(!nombre){alert('Nombre obligatorio');return}
  const selInst=document.getElementById('f3'),inpInst=document.getElementById('f3b')
  const selCiud=document.getElementById('f4'),inpCiud=document.getElementById('f4b')
  const institucion=selInst&&selInst.value==='Otra'?(inpInst&&inpInst.value||'Otra'):selInst&&selInst.value||''
  const ciudad=selCiud&&selCiud.value==='Otra'?(inpCiud&&inpCiud.value||'Otra'):selCiud&&selCiud.value||''
  const orcid=v('forc')?normalizarOrcid(v('forc')):''
  if(orcid&&!orcidValido(orcid)){alert('El ORCID no es válido ('+orcid+'). Son 16 dígitos, el último puede ser X. Ej.: 0000-0002-1825-0097');return}
  const rec={id:id||uid(),nombre,cedula:v('fc'),telefono:v('f1'),email:v('f2'),orcid,
    direccion:v('fd'),institucion,ciudad,area:v('fa'),notas:v('f5'),
    facturar:v('ff')==='1'?'1':'0',facturaNombre:v('ffn'),facturaIdentificacion:v('ffi'),facturaDireccion:v('ffd'),facturaEmail:v('ffe'),
    createdAt:id?(modal.rec.createdAt||''):new Date().toISOString()}
  if(rec.facturaIdentificacion&&!/^\d{10}(\d{3})?$/.test(rec.facturaIdentificacion)&&!confirm('La identificación para la factura ('+rec.facturaIdentificacion+') no parece una cédula (10 dígitos) ni un RUC (13). ¿Guardar de todas formas?'))return
  saveRec('Clientes',rec,!id)
  // Alta completa: los datos del cliente pasan directo a su propuesta de publicaciones
  if(conPropuesta)nuevaPropuesta(rec.id)
  else volverAlContrato()
}

const MODELO_TIT={libro:'📖 Detalles de la publicación del libro',publicacion:'📰 Detalles de la publicación científica',tesis:'🎓 Detalles de la asesoría de tesis',estadistica:'📊 Detalles del análisis estadístico',revision:'📚 Detalles de la revisión / instrumento',general:'📋 Detalles del servicio'}
// Autores registrados (estructura de la pantalla 👥) de un trabajo, si los tiene
function _autoresRegistrados(t){let a=[];try{a=JSON.parse(t&&t.autores||'[]')||[]}catch(e){}return Array.isArray(a)?a:[]}
function htmlDetCampos(modelo,det,t){
  det=det||{}
  const reg=t&&t.id?_autoresRegistrados(t):[],clT=t&&t.clienteId?data.clientes.find(c=>c.id===t.clienteId):null
  const campos=(DET_CAMPOS[modelo]||DET_CAMPOS.general).concat(DET_EXTRA)
  let h='<div style="margin-top:14px;padding:14px;background:#FAFAF7;border:1px solid var(--border);border-radius:12px">'
    +'<div style="font-size:13px;font-weight:800;color:var(--navy);margin-bottom:2px">'+MODELO_TIT[modelo]+'</div>'
    +'<div style="font-size:11px;color:var(--text3);margin-bottom:4px">Estos datos se usan en el contrato y en el seguimiento.</div>'
    +'<div class="fg">'
  campos.forEach(function(f){
    if(f.sec){h+='<div class="full sec-t">'+esc(f.sec)+'</div>';return}
    const id='det_'+f.k,val=det[f.k]
    const cls=f.full?' class="full"':''
    let inp
    // Autores: si ya están registrados se muestran (se editan en 👥 Autores); si no, empieza con el cliente
    if(f.k==='autores'){
      if(reg.length){h+='<div class="full"><label>'+esc(f.l)+'</label><input id="'+id+'" readonly style="background:#F5F4F0;color:var(--text2)" value="'+esc(autoresDe(t).map(a=>a.nombre).join('; '))+'"/>'
        +'<div style="font-size:11px;color:var(--text3);margin-top:3px">Se editan en <strong>👥 Autores registrados</strong> (más abajo), con su ORCID, cédula y lo que paga cada uno.</div></div>';return}
      const ini=val||(clT?clT.nombre:'')
      h+='<div class="full"><label>'+esc(f.l)+'</label><input id="'+id+'" value="'+esc(ini)+'" placeholder="Primero el cliente (autor principal); luego los coautores, separados por coma"/>'
        +'<div style="font-size:11px;color:var(--text3);margin-top:3px">El cliente va como autor principal. Agrega los coautores separados por coma: al guardar se registran como clientes y se te pedirá su ORCID.</div></div>';return
    }
    if(f.k==='numAutores'&&reg.length>1){h+='<div'+cls+'><label>'+esc(f.l)+'</label><input id="'+id+'" readonly style="background:#F5F4F0" value="'+nAutoresTrabajo(t)+'"/></div>';return}
    if(f.t==='select'){
      inp='<select id="'+id+'"><option value="">—</option>'+f.o.map(function(o){return'<option'+(val===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'
    }else if(f.t==='multi'){
      const arr=Array.isArray(val)?val:String(val||'').split(/\s*[,;]\s*/).filter(Boolean)
      inp='<div class="chk-grid">'+f.o.map(function(o){
        return'<label class="chk"><input type="checkbox" name="'+id+'" value="'+esc(o)+'"'+(arr.indexOf(o)>-1?' checked':'')+'/>'+esc(o)+'</label>'
      }).join('')+'</div>'
    }else if(f.t==='textarea'){
      inp='<textarea id="'+id+'" rows="2" placeholder="'+esc(f.ph||'')+'">'+esc(val||'')+'</textarea>'
    }else{
      const typ=f.t==='date'?'date':f.t==='number'?'number':f.t==='url'?'url':'text'
      const vv=f.t==='date'?toISO(val||''):(val||'')
      inp='<input id="'+id+'" type="'+typ+'"'+(typ==='number'?' min="0" step="any"':'')+' value="'+esc(vv)+'" placeholder="'+esc(f.ph||'')+'"/>'
    }
    h+='<div'+cls+'><label>'+esc(f.l)+'</label>'+inp+'</div>'
  })
  return h+'</div></div>'
}
function leerDetCampos(modelo){
  const out={}
  ;(DET_CAMPOS[modelo]||DET_CAMPOS.general).concat(DET_EXTRA).forEach(function(f){
    if(f.sec)return
    if(f.t==='multi'){
      out[f.k]=Array.from(document.querySelectorAll('input[name="det_'+f.k+'"]:checked')).map(function(x){return x.value})
    }else{
      const el=document.getElementById('det_'+f.k)
      if(el)out[f.k]=el.value
    }
  })
  return out
}

let _volverContrato=null  // si se edita desde el contrato, al guardar o cancelar se vuelve a él
function _fichaGrid(pares){
  const f=pares.filter(p=>p[1]!==undefined&&p[1]!==null&&String(p[1]).trim()!=='')
  return f.length?'<div class="pub-meta">'+f.map(p=>'<div'+(p[2]?' style="grid-column:1/-1"':'')+'><span>'+esc(p[0])+'</span>'
    +'<strong style="font-size:12.5px;white-space:pre-line;word-break:break-word'+(String(p[1]).indexOf('— falta')===0?';color:var(--amber)':'')+'">'+esc(p[1])+'</strong></div>').join('')+'</div>':''
}
function fichaCliente(c){
  if(!c)return''
  return _fichaGrid([['Nombre completo',c.nombre],['Cédula / RUC',c.cedula||'— falta'],['Teléfono / WhatsApp',c.telefono||'— falta'],['Email',c.email||'— falta'],['ORCID',c.orcid||'—'],
    ['Dirección',c.direccion||'— falta',1],['Institución',c.institucion],['Ciudad',c.ciudad],['Área / programa / grupo',c.area,1],['Notas',c.notas,1],
    ['Factura electrónica',pideFactura(c)?'Sí pide factura'+(c.facturaNombre&&c.facturaIdentificacion?' — a nombre de '+c.facturaNombre+' ('+c.facturaIdentificacion+')':''):'No pide factura',1],
    ['Registrado',c.createdAt?fmtDCorto(String(c.createdAt).slice(0,10)):'']])
}
function fichaDetalles(t){
  const det=detallesDe(t),pares=[]
  ;(DET_CAMPOS[modeloTrabajo(t.tipo)]||DET_CAMPOS.general).concat(DET_EXTRA).forEach(function(f){
    if(f.sec)return
    let val=det[f.k]
    if(Array.isArray(val))val=_lista(val)
    if(val===undefined||val===null||String(val).trim()==='')return
    if(f.t==='date')val=fmtDCorto(val)
    pares.push([f.l,val,f.full||f.t==='textarea'])
  })
  return pares.length?_fichaGrid(pares)
    :'<div style="font-size:12px;color:var(--text3)">Todavía no se registran los datos específicos del contrato (revista, fechas de entrega, condiciones…). Pulsa "Editar" para completarlos.</div>'
}
function editarDesdeContrato(tipo,tid){
  const t=data.trabajos.find(x=>x.id===tid);if(!t)return
  const cl=data.clientes.find(c=>c.id===t.clienteId)
  if(tipo==='cliente'&&!cl){toast('Este trabajo no tiene cliente asignado','err');return}
  _volverContrato=tid

async function submitTrabajo(id,isEdit,sinVolver){
  _autorClientePrev=null
  const titulo=v('f0'),clienteId=v('f1')
  if(!titulo){alert('Título obligatorio');return}
  if(!clienteId){alert('Selecciona un cliente');return}
  const cl=data.clientes.find(c=>c.id===clienteId)
  const total=parseFloat(v('f4'))||0
  const workId=id||uid()
  const tipo=v('f2')
  const prevRec=id?(modal.rec||{}):{}
  const rec={id:workId,clienteId,clienteNombre:cl&&cl.nombre||'',titulo,tipo,estado:v('f3'),total,progreso:v('f5'),fechaInicio:v('f6'),fechaFin:v('f7'),notas:v('f8'),carpeta:v('f9'),
    detalles:JSON.stringify((function(det){
      if(!_autoresRegistrados(prevRec).length&&'autores' in det){
        const nom=cl&&cl.nombre||'',txt=String(det.autores||'').trim()
        if(nom&&_normNom(txt).indexOf(_normNom(nom))<0)det.autores=nom+(txt?', '+txt:'')
        if('numAutores' in det&&!(parseInt(det.numAutores)>0))det.numAutores=String(Math.max(1,nombresAutoresTexto({detalles:JSON.stringify(det)}).length))
      }
      return det})(leerDetCampos(modeloTrabajo(tipo)))),
    etapa:prevRec.etapa||'',contratoUrl:prevRec.contratoUrl||'',contratoFecha:prevRec.contratoFecha||'',
    autores:prevRec.autores||'',modoCobro:prevRec.modoCobro||'',
    createdAt:id?(prevRec.createdAt||''):new Date().toISOString()}
  // Si cambia el cliente titular, pasa a ser el autor encargado / de correspondencia
  if(rec.autores&&id&&clienteId!==prevRec.clienteId){
    let au=[];try{au=JSON.parse(rec.autores)||[]}catch(e){}
    const ya=au.find(a=>a.clienteId===clienteId),resp=au.find(a=>a.rol==='correspondencia')
    if(ya&&resp&&ya!==resp){resp.rol='coautor';ya.rol='correspondencia'}
    else if(resp){resp.clienteId=clienteId;resp.nombre=cl&&cl.nombre||resp.nombre;resp.orcid=cl&&cl.orcid||''}
    rec.autores=JSON.stringify(au)
  }
  // Capture plan values BEFORE draw() clears the modal inputs
  const planN=parseInt(v('tp_n'))||1
  const planD=v('tp_d')||new Date().toISOString().split('T')[0]
  const planManual=document.getElementById('plan_manual')
  const usaManual=planManual&&planManual.style.display!=='none'
  const crearCuotas=!isEdit&&(total>0||usaManual)
  const volver=_volverContrato
  await saveRec('Trabajos',rec,!id)
  if(id)sincronizarPropuestaDeTrabajo(id)
  if(sinVolver)return true
  if(volver&&isEdit&&!modal){_volverContrato=volver;volverAlContrato();return}
  if(crearCuotas){
    let cuotasACrear=[]
    if(usaManual){
      // Cuotas manuales
      cuotasACrear=getCuotasManual()
      if(cuotasACrear.length===0){await loadData();return}
    }else{
      // Cuotas automáticas
      const pc=Math.floor(total*100/planN)/100
      const last=Math.round((total-pc*(planN-1))*100)/100
      for(let i=0;i<planN;i++){
        const dt=new Date(planD);dt.setMonth(dt.getMonth()+i)
        const lb=i===0?'Anticipo':'Cuota '+(i+1)+(i===planN-1&&planN>1?' (final)':'')
        cuotasACrear.push({label:lb,monto:i===planN-1?last:pc,fecha:dt.toISOString().split('T')[0]})
      }
    }
    toast('Creando '+cuotasACrear.length+' cuota'+(cuotasACrear.length>1?'s':'')+'...')
    for(let i=0;i<cuotasACrear.length;i++){
      const c=cuotasACrear[i]
      await apiPost({action:'insertar',tabla:'Cuotas',fila:{
        id:uid(),trabajoId:workId,
        clienteId:clienteId,
        clienteNombre:cl&&cl.nombre||'',
        trabajoTitulo:titulo,
        label:c.label,
        fechaVencimiento:c.fecha,
        acordado:c.monto,
        pagado:0,estado:'pendiente'
      }})
    }
    await loadData()
    toast('✓ Trabajo y '+cuotasACrear.length+' cuota'+(cuotasACrear.length>1?'s':'')+' creadas')
    const tn=data.trabajos.find(x=>x.id===workId)
    if(tn&&autoresPendientes(tn).length){abrirAutores(workId,{luegoContrato:true});toast('Registra a los coautores y define cuánto paga cada uno')}
    else abrirContrato(workId)
  }else if(!isEdit){
    const tn=data.trabajos.find(x=>x.id===workId)
    if(tn&&autoresPendientes(tn).length)abrirAutores(workId)
  }
}

function submitCuota(trabajoId,cuotaId){
