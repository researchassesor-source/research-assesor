      msg += 'POST: '+(j.ok?'✅ OK':'❌ '+JSON.stringify(j))+'\n'
      if(j.ok){
        // Clean up
        await apiPost({action:'eliminar',tabla:'Clientes',id:tid})
        msg += 'CLEANUP: ✅\n'
      }
    }catch(pe){msg+='POST parse error: '+pe.message+'\n'}
  }catch(e){msg+='POST ERROR: '+e.name+': '+e.message+'\n'}
  alert(msg)
}

// Reparar hojas — corrige headers si son incorrectos
async function repararHojas(){
  if(!confirm('Esto corregirá la estructura de las hojas en Google Sheets.\n\n⚠️ Los datos existentes se conservan.\n\n¿Continuar?'))return
  syncing=true;syncMsg='Reparando hojas...';draw()
  try{
    const d=await apiPost({action:'repararHojas'})
    if(d.ok){
      alert('✅ Hojas reparadas:\n\n'+(d.reparado||[]).join('\n'))
      await loadData()
    }else{
      alert('❌ Error: '+( d.error||'Desconocido'))
    }
  }catch(e){alert('Error de red: '+e.message)}
  syncing=false;draw()
}

// ── Generador Word (JSZip) ────────────────────────────────────────
function descargarReporte(clienteId){
  const cl=data.clientes.find(x=>x.id===clienteId)
  if(!cl){toast('Cliente no encontrado','err');return}
  const trabajosCl=data.trabajos.filter(t=>esDelCliente(t,clienteId))
  if(!trabajosCl.length){toast('Este cliente no tiene trabajos registrados','err');return}
  _cargarJSZip(function(){_generarDocx(cl,trabajosCl,'cliente')})
}

function descargarReporteTrabajo(trabajoId){
  const t=data.trabajos.find(x=>x.id===trabajoId)
  if(!t){toast('Trabajo no encontrado','err');return}
  const cl=data.clientes.find(x=>x.id===t.clienteId)
  _cargarJSZip(function(){_generarDocx(cl,[t],'trabajo')})
}

function _cargarJSZip(cb){
  if(window.JSZip){cb();return}
  toast('Preparando descarga...')
  const s=document.createElement('script')
  s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'
  s.onload=function(){cb()}
  s.onerror=function(){toast('Error cargando JSZip — verifica conexión','err')}
  document.head.appendChild(s)
}

function _xml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}
function _fmtM(n){return'$'+(parseFloat(n)||0).toFixed(2)}
function _fmtFecha(){
  const d=new Date()
  return d.getDate().toString().padStart(2,'0')+'/'+(d.getMonth()+1).toString().padStart(2,'0')+'/'+d.getFullYear()
}

function _p(text,opts){
  opts=opts||{}
  const sz=opts.sz||22
  const bold=opts.bold?'<w:b/>':''
  const color=opts.color?'<w:color w:val="'+opts.color+'"/>' : ''
  const before=opts.before||0
  const after=opts.after!==undefined?opts.after:80
  const align=opts.align?'<w:jc w:val="'+opts.align+'"/>':''
  const keep=opts.keep?'<w:keepNext/>':''  // no separar este párrafo de lo que sigue (p. ej. una tabla)
  return'<w:p><w:pPr>'+keep+'<w:spacing w:before="'+before+'" w:after="'+after+'"/>'+align+'</w:pPr>'
    +'<w:r><w:rPr>'+bold+'<w:sz w:val="'+sz+'"/><w:szCs w:val="'+sz+'"/>'+DOC_RF+''+color+'</w:rPr>'
    +'<w:t xml:space="preserve">'+_xml(text)+'</w:t></w:r></w:p>'
}

// ── MEMBRETE (plantilla "Proforma publicaciones") ─────────────────
// A4, logo en el encabezado y ondas de marca + datos de contacto en el pie.
// Todos los documentos Word (contratos, reportes, proformas) lo usan.
const DOC_TEXT_W=9638  // ancho útil en twips: A4 (11906) − márgenes de 2 cm
const DOC_SECT='<w:sectPr><w:headerReference w:type="default" r:id="rIdHdr"/><w:footerReference w:type="default" r:id="rIdFtr"/>'
  +'<w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="2000" w:right="1134" w:bottom="2700" w:left="1134" w:header="400" w:footer="500" w:gutter="0"/></w:sectPr>'
// Imagen flotante detrás del texto, posicionada respecto de la página (EMU)
function _anclaImg(rid,id,x,y,cx,cy){
  return'<w:r><w:drawing><wp:anchor distT="0" distB="0" distL="0" distR="0" simplePos="0" relativeHeight="'+(251658240+id)+'" behindDoc="1" locked="0" layoutInCell="1" allowOverlap="1">'
    +'<wp:simplePos x="0" y="0"/><wp:positionH relativeFrom="page"><wp:posOffset>'+x+'</wp:posOffset></wp:positionH>'
    +'<wp:positionV relativeFrom="page"><wp:posOffset>'+y+'</wp:posOffset></wp:positionV>'
    +'<wp:extent cx="'+cx+'" cy="'+cy+'"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:wrapNone/><wp:docPr id="'+id+'" name="Membrete '+id+'"/>'
    +'<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr>'
    +'<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">'
    +'<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="0" name="img'+id+'"/><pic:cNvPicPr/></pic:nvPicPr>'
    +'<pic:blipFill><a:blip r:embed="'+rid+'"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>'
    +'<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+cx+'" cy="'+cy+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic>'
    +'</a:graphicData></a:graphic></wp:anchor></w:drawing></w:r>'
}
const _NS_HF='xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"'
// opts.qrB64: QR de verificación (contrato emitido) → esquina superior derecha de cada página
function _headerXml(opts){
  opts=opts||{}
  // Logo 7 cm de ancho, a 1 cm del borde superior e izquierdo
  const cx=2520000,cy=Math.round(2520000*149/420)
  const q=820000 // QR de 2,3 cm
  return'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:hdr '+_NS_HF+'><w:p><w:pPr><w:spacing w:before="0" w:after="0"/></w:pPr>'
    +_anclaImg('rIdLogo',101,500000,300000,cx,cy)
    +(opts.qrB64?_anclaImg('rIdQR',103,7560310-500000-q,260000,q,q):'')
    +'</w:p></w:hdr>'
}
// opts.codigo: código de verificación impreso en el pie de todas las páginas
function _footerXml(opts){
  opts=opts||{}
  const pr=prestador()
  const lin=[pr.direccion?'Dirección: '+pr.direccion:'',pr.telefono?'Celular: '+pr.telefono:'',pr.web?'Sitio web: '+pr.web:''].filter(Boolean)
  // Ondas de marca: ancho completo de la página, pegadas al borde inferior (A4 = 7560310 × 10692130 EMU)
  const cx=7560310,cy=Math.round(7560310*406/478)
  const par=function(t,img){
    return'<w:p><w:pPr><w:spacing w:before="0" w:after="0"/><w:jc w:val="center"/></w:pPr>'+(img||'')
      +(t?'<w:r><w:rPr><w:rFonts w:ascii="'+DOC_FONT+'" w:hAnsi="'+DOC_FONT+'"/><w:b/><w:color w:val="215E99"/><w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr><w:t xml:space="preserve">'+_xml(t)+'</w:t></w:r>':'')+'</w:p>'
  }
  const ver=opts.codigo?'<w:p><w:pPr><w:spacing w:before="0" w:after="40"/><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="'+DOC_FONT+'" w:hAnsi="'+DOC_FONT+'"/><w:color w:val="0B2545"/><w:sz w:val="15"/><w:szCs w:val="15"/></w:rPr>'
    +'<w:t xml:space="preserve">'+_xml('Código de verificación: '+opts.codigo+' · Verifique su autenticidad escaneando el código QR')+'</w:t></w:r></w:p>':''
  const img=_anclaImg('rIdOndas',102,0,10692130-cy,cx,cy)
  return'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr '+_NS_HF+'>'+ver
    +(lin.length?lin.map(function(t,i){return par(t,i===0?img:'')}).join(''):par('',img))+'</w:ftr>'
}

function _hline(){
  return'<w:p><w:pPr><w:spacing w:before="120" w:after="60"/>'
    +'<w:pBdr><w:bottom w:val="single" w:sz="4" w:space="1" w:color="0F4C81"/></w:pBdr>'
    +'</w:pPr></w:p>'
}

// Las tablas se escalan al ancho útil de la página; _cell usa el mismo factor (no hay tablas anidadas)
let _tblF=1
function _tblStart(widths,borde){
  const bruto=widths.reduce(function(s,w){return s+w},0)
  _tblF=bruto>DOC_TEXT_W?DOC_TEXT_W/bruto:1
  widths=widths.map(function(w){return Math.floor(w*_tblF)})
  const total=widths.reduce(function(s,w){return s+w},0)
  const b=borde||{c:'CCCCCC',sz:2}
  const lado=function(n){return'<w:'+n+' w:val="single" w:sz="'+b.sz+'" w:space="0" w:color="'+b.c+'"/>'}
  return'<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"/><w:tblW w:w="'+total+'" w:type="dxa"/>'
    +'<w:tblBorders>'+['top','left','bottom','right','insideH','insideV'].map(lado).join('')+'</w:tblBorders></w:tblPr>'
    +'<w:tblGrid>'+widths.map(function(w){return'<w:gridCol w:w="'+w+'"/>'}).join('')+'</w:tblGrid>'
}

function _cell(text,w,opts){
  opts=opts||{}
  const fill=opts.head?'0F4C81':opts.gray?'F5F7FA':'FFFFFF'
  const txtColor=opts.head?'FFFFFF':(opts.color||'000000')
  const bold=(opts.head||opts.bold)?'<w:b/>':''
  const sz=opts.sz||20
  const align=opts.align||'left'
  return'<w:tc><w:tcPr><w:tcW w:w="'+Math.floor(w*_tblF)+'" w:type="dxa"/>'
    +'<w:shd w:val="clear" w:color="auto" w:fill="'+fill+'"/>'
    +'<w:tcMar><w:top w:w="80" w:type="dxa"/><w:left w:w="120" w:type="dxa"/>'
    +'<w:bottom w:w="80" w:type="dxa"/><w:right w:w="120" w:type="dxa"/></w:tcMar>'
    +'</w:tcPr><w:p><w:pPr>'+(opts.keep?'<w:keepNext/>':'')
    +'<w:spacing w:before="0" w:after="0"/><w:jc w:val="'+align+'"/></w:pPr>'
    +'<w:r><w:rPr>'+bold+'<w:sz w:val="'+sz+'"/><w:szCs w:val="'+sz+'"/>'
    +''+DOC_RF+''
    +'<w:color w:val="'+txtColor+'"/></w:rPr>'
    +'<w:t xml:space="preserve">'+_xml(text)+'</w:t></w:r></w:p></w:tc>'
}

function _generarDocx(cl,trabajos,modo){
  const cuotasByTrabajo={}
  data.cuotas.forEach(function(c){
    if(!cuotasByTrabajo[c.trabajoId])cuotasByTrabajo[c.trabajoId]=[]
    cuotasByTrabajo[c.trabajoId].push(c)
  })
  const fecha=_fmtFecha()
  let body=''

  // Cabecera
  body+=_p('Coordinación de Investigación',{sz:18,color:'555555',align:'right',after:20})
  body+=_p('Fecha: '+fecha,{sz:18,color:'555555',align:'right',after:0})
  body+=_hline()
  body+=_p('RESUMEN DE TRABAJOS Y PLAN DE PAGOS',{sz:28,bold:true,color:'0F4C81',align:'center',before:80,after:60})

  // Datos del cliente
  body+=_p('DATOS DEL CLIENTE',{sz:24,bold:true,color:'0F4C81',before:100,after:40})
  body+=_hline()
  const campos=[
    ['Nombre',cl&&cl.nombre||'—'],['Cédula / RUC',cl&&cl.cedula||'—'],
    ['Teléfono',cl&&cl.telefono||'—'],['Email',cl&&cl.email||'—'],
    ['Institución',cl&&cl.institucion||'—'],['Ciudad',cl&&cl.ciudad||'—'],
    ['Dirección',cl&&cl.direccion||'—']
  ].filter(function(r){return r[1]&&r[1]!=='—'})
  if(campos.length){
    body+=_tblStart([2200,4000,2200,4000])
    for(var ci=0;ci<campos.length;ci+=2){
      body+='<w:tr>'
      body+=_cell(campos[ci][0],2200,{bold:true,gray:true})
      body+=_cell(campos[ci][1],4000,{})
      if(campos[ci+1]){
        body+=_cell(campos[ci+1][0],2200,{bold:true,gray:true})
        body+=_cell(campos[ci+1][1],4000,{})
      }else{
        body+=_cell('',6200,{})
      }
      body+='</w:tr>'
    }
    body+='</w:tbl><w:p><w:pPr><w:spacing w:before="0" w:after="100"/></w:pPr></w:p>'
  }

  // Tabla de trabajos
  body+=_p('TRABAJOS',{sz:24,bold:true,color:'0F4C81',before:100,after:40})
  body+=_hline()
  body+=_tblStart([400,3800,2000,1500,1500,1500,1700])
  body+='<w:tr>'
  body+=_cell('N°',400,{head:true,align:'center'})
  body+=_cell('Trabajo / Servicio',3800,{head:true})
  body+=_cell('Tipo',2000,{head:true})
  body+=_cell('Estado',1500,{head:true})
  body+=_cell('Total',1500,{head:true,align:'right'})
  body+=_cell('Cobrado',1500,{head:true,align:'right'})
  body+=_cell('Saldo',1700,{head:true,align:'right'})
  body+='</w:tr>'
  var gTotal=0,gCob=0
  trabajos.forEach(function(t,i){
    const cs=cuotasByTrabajo[t.id]||[]
    const cob=cs.reduce(function(s,c){return s+parseFloat(c.pagado||0)},0)
    const tot=parseFloat(t.total||0)
    const sal=tot-cob
    gTotal+=tot;gCob+=cob
    const gray=i%2!==0
    body+='<w:tr>'
    body+=_cell(String(i+1),400,{gray:gray,align:'center'})
    body+=_cell(t.titulo,3800,{gray:gray})
    body+=_cell(t.tipo||'—',2000,{gray:gray})
    body+=_cell(t.estado||'—',1500,{gray:gray})
    body+=_cell(_fmtM(tot),1500,{gray:gray,align:'right'})
    body+=_cell(_fmtM(cob),1500,{gray:gray,align:'right',color:cob>0?'15803D':'000000'})
    body+=_cell(_fmtM(sal),1700,{gray:gray,align:'right',color:sal>0?'B45309':'15803D',bold:sal>0})
    body+='</w:tr>'
  })
  body+='<w:tr>'
  body+=_cell('',400,{gray:true})
  body+=_cell('TOTAL',3800,{bold:true,gray:true})
  body+=_cell('',2000,{gray:true})
  body+=_cell('',1500,{gray:true})
  body+=_cell(_fmtM(gTotal),1500,{bold:true,gray:true,align:'right'})
  body+=_cell(_fmtM(gCob),1500,{bold:true,gray:true,align:'right',color:'15803D'})
  body+=_cell(_fmtM(gTotal-gCob),1700,{bold:true,gray:true,align:'right',color:'B45309'})
  body+='</w:tr></w:tbl>'
  body+='<w:p><w:pPr><w:spacing w:before="0" w:after="100"/></w:pPr></w:p>'

  // Plan de pagos por trabajo
  body+=_p('PLAN DE PAGOS PROYECTADO',{sz:24,bold:true,color:'0F4C81',before:100,after:40})
  body+=_hline()
  trabajos.forEach(function(t){
    const cs=(cuotasByTrabajo[t.id]||[]).slice().sort(function(a,b){return new Date(a.fechaVencimiento)-new Date(b.fechaVencimiento)})
    if(!cs.length)return
    body+=_p(t.titulo,{sz:22,bold:true,color:'0F4C81',before:100,after:30})
    body+=_tblStart([2500,2000,2000,2000,2000,1900])
    body+='<w:tr>'
    body+=_cell('Cuota',2500,{head:true})
    body+=_cell('Vencimiento',2000,{head:true,align:'center'})
    body+=_cell('Acordado',2000,{head:true,align:'right'})
    body+=_cell('Pagado',2000,{head:true,align:'right'})
    body+=_cell('Saldo',2000,{head:true,align:'right'})
    body+=_cell('Estado',1900,{head:true,align:'center'})
    body+='</w:tr>'
    var tA=0,tP=0
    cs.forEach(function(c,i){
      const ac=parseFloat(c.acordado||0),pa=parseFloat(c.pagado||0),sa=ac-pa
      const st=c.estado||'pendiente'
      tA+=ac;tP+=pa
      const gray=i%2!==0
      const sc=st==='pagado'?'15803D':st==='vencido'?'DC2626':'B45309'
      body+='<w:tr>'
      body+=_cell(c.label||'Cuota',2500,{gray:gray})
      body+=_cell(c.fechaVencimiento||'—',2000,{gray:gray,align:'center'})
      body+=_cell(_fmtM(ac),2000,{gray:gray,align:'right'})
      body+=_cell(_fmtM(pa),2000,{gray:gray,align:'right',color:pa>0?'15803D':'555555'})
      body+=_cell(_fmtM(sa),2000,{gray:gray,align:'right',color:sa>0?'B45309':'15803D'})
      body+=_cell(st.toUpperCase(),1900,{gray:gray,align:'center',color:sc,bold:true})
      body+='</w:tr>'
    })
    body+='<w:tr>'
    body+=_cell('SUBTOTAL',2500,{bold:true,gray:true})
    body+=_cell('',2000,{gray:true})
    body+=_cell(_fmtM(tA),2000,{bold:true,gray:true,align:'right'})
    body+=_cell(_fmtM(tP),2000,{bold:true,gray:true,align:'right',color:'15803D'})
    body+=_cell(_fmtM(tA-tP),2000,{bold:true,gray:true,align:'right',color:'B45309'})
    body+=_cell('',1900,{gray:true})
    body+='</w:tr></w:tbl>'
    body+='<w:p><w:pPr><w:spacing w:before="0" w:after="80"/></w:pPr></w:p>'
  })

  // Pie
  body+=_hline()
  body+=_p('Documento generado por Research Assessor · '+fecha,{sz:16,color:'999999',align:'center',before:80,after:0})
  body+='<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>'

  const nombre=(cl&&cl.nombre||'cliente').replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s]/g,'').trim().replace(/\s+/g,'_')
  const suffix=modo==='trabajo'?('_'+trabajos[0].titulo.slice(0,20).replace(/[^a-zA-Z0-9]/g,'_')):'_todos_trabajos'
  _descargarDocx(body,'Reporte_'+nombre+suffix+'_'+fecha.replace(/\//g,'-')+'.docx')
}

// ── Ensamblado DOCX compartido (JSZip) ─────────────────────────────
// opts (contrato emitido): {qrB64, codigo, titulo} → QR en el encabezado, código en el pie y metadatos
function _docxZipFromBody(body,opts){
  opts=opts||{}
  const zip=new window.JSZip()
  zip.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Default Extension="jpg" ContentType="image/jpeg"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'+(opts.codigo?'<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>':'')+'</Types>')
  zip.folder('_rels').file('.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'+(opts.codigo?'<Relationship Id="rIdCore" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>':'')+'</Relationships>')
  // Metadatos: Word los copia al PDF (título, asunto, palabras clave); así se reconoce el contrato al subir el PDF firmado
  if(opts.codigo)zip.folder('docProps').file('core.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">'
    +'<dc:title>'+_xml((opts.titulo||'Contrato')+' · '+opts.codigo)+'</dc:title><dc:subject>'+_xml('Código de verificación '+opts.codigo)+'</dc:subject><cp:keywords>'+_xml(opts.codigo)+'</cp:keywords><dc:creator>Research Assessor</dc:creator></cp:coreProperties>')
  const wf=zip.folder('word')
  wf.folder('_rels').file('document.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rIdHdr" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header1.xml"/><Relationship Id="rIdFtr" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/></Relationships>')
  // Membrete: encabezado con logo y pie con ondas + contacto

function _descargarDocx(body,filename){

function _ctxContrato(trabajoId,silencioso){
  const t=data.trabajos.find(x=>x.id===trabajoId)

  const cl=data.clientes.find(x=>x.id===t.clienteId)
  const cuotas=data.cuotas.filter(c=>c.trabajoId===trabajoId).slice().sort(function(a,b){return new Date(a.fechaVencimiento)-new Date(b.fechaVencimiento)})

}
// Quiénes firman el contrato: siempre el autor encargado / de correspondencia y, si se eligieron, los demás autores
const _listaPc=a=>a.length<2?a.join(''):a.slice(0,-1).join('; ')+'; y, '+a[a.length-1]
function firmantesDe(t){
  const au=autoresDe(t)
  let fs=au.filter(a=>a.rol==='correspondencia'||a.firma)
  if(!fs.length)fs=au.slice(0,1)
  fs=fs.slice().sort((a,b)=>(b.rol==='correspondencia')-(a.rol==='correspondencia'))
  return fs.map(a=>{const cl=data.clientes.find(c=>c.id===a.clienteId);return Object.assign({},cl||{},{id:a.clienteId,nombre:cl&&cl.nombre||a.nombre||'',autorId:a.id,rol:a.rol,orcid:a.orcid||(cl&&cl.orcid)||''})})
}
function htmlFirmantesContrato(t,emitido){
  const au=autoresDe(t),pend=autoresPendientes(t)
  if(au.length<2&&!pend.length)return''
  const fs=firmantesDe(t),ids=new Set(fs.map(x=>x.autorId)),varios=fs.length>1,resp=au.find(a=>a.rol==='correspondencia')||au[0]
  let h='<div style="border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:#fff">'

      +'<label class="chk" style="margin-top:6px"><input type="radio" name="ctf_modo"'+(varios?' checked':'')+(emitido?' disabled':'')+' onchange="guardarFirmantes(\''+t.id+'\',\'varios\')"/> <strong>Varios autores</strong> (elige quiénes firman)</label>'
    if(varios)h+='<div style="display:grid;gap:4px;margin:8px 0 0 24px">'+au.map(a=>'<label class="chk" style="margin:0"><input type="checkbox" id="ctf_'+esc(a.id)+'"'+(ids.has(a.id)?' checked':'')+(a.rol==='correspondencia'||emitido?' disabled':'')+' onchange="guardarFirmantes(\''+t.id+'\',\'sel\')"/> '+esc(a.nombre||'—')+(a.rol==='correspondencia'?' <span style="font-size:11px;color:var(--gold-dk)">(encargado, siempre firma)</span>':'')+(data.clientes.some(c=>c.id===a.clienteId&&c.cedula)?'':' <span style="font-size:11px;color:#b45309">· sin cédula</span>')+'</label>').join('')+'</div>'

      +(emitido?' <strong>El contrato ya fue emitido:</strong> para cambiar los firmantes emite una nueva versión.':'')+'</div>'
  }

async function guardarFirmantes(tid,modo){
  const t=data.trabajos.find(x=>x.id===tid);if(!t)return
  let au=[];try{au=JSON.parse(t.autores||'[]')||[]}catch(e){}
  if(!Array.isArray(au)||!au.length)au=autoresDe(t)
  if(modo==='uno')au=au.map(a=>Object.assign({},a,{firma:false}))
  else if(modo==='varios')au=au.map(a=>Object.assign({},a,{firma:true}))
  else au=au.map(a=>{const cb=document.getElementById('ctf_'+a.id);return Object.assign({},a,{firma:a.rol==='correspondencia'||!!(cb&&cb.checked)})})
  const val=JSON.stringify(au)
  data.trabajos=data.trabajos.map(x=>x.id===tid?Object.assign({},x,{autores:val}):x)
  draw()
  const r=await apiPost({action:'actualizar',tabla:'Trabajos',id:tid,fila:{autores:val}})
  if(r&&r.ok)toast('Firmantes del contrato guardados ✓');else toast('Error: '+(r&&r.error||'Sin respuesta'),'err')
}

function _tablaKV(filas){
  const fs=filas.filter(function(f){return f&&f[1]!==undefined&&f[1]!==null&&String(f[1]).trim()!==''})

  let s=_tblStart([3600,6400])

function _lista(arr){
  arr=(Array.isArray(arr)?arr:String(arr||'').split(/\s*[,;]\s*/)).filter(Boolean)
  if(arr.length<2)return arr.join('')
  return arr.slice(0,-1).join(', ')+' y '+arr[arr.length-1]
}

// Extrae HH:MM de cualquier formato de hora/fecha de Sheets
function cleanHora(h){
  if(!h||h==='')return'—'
  h=String(h).trim()
  // Already HH:MM or HH:MM:SS
  var m1=h.match(/^(\d{1,2}:\d{2})/)
  if(m1)return m1[1]
  // ISO with time: 1899-12-30T18:30:00 or 2026-04-01T18:30:00
  var m2=h.match(/T(\d{2}:\d{2})/)
  if(m2)return m2[1]
  // "Sat Dec 30 1899 18:30:00 GMT..." - any string with HH:MM:SS pattern
  var m3=h.match(/\b(\d{2}:\d{2}):\d{2}\b/)
  if(m3)return m3[1]
  // "Sat Dec 30 1899 18:30..." 
  var m4=h.match(/\b(\d{1,2}:\d{2})\b/)
  if(m4)return m4[1]
  return'—'
}

// Fecha de hoy en hora local (no UTC) para comparaciones correctas
function fechaHoyLocal(){
  var n=new Date()
  return[n.getFullYear(),String(n.getMonth()+1).padStart(2,'0'),String(n.getDate()).padStart(2,'0')].join('-')
}

async function submitEditAbono(abonoId, cuotaId, trabajoId, montoAnterior){
  const nuevoMonto=parseFloat(document.getElementById('ea0')&&document.getElementById('ea0').value||0)
  if(!nuevoMonto||nuevoMonto<=0){alert('Monto inválido');return}
  // Read ALL values before draw()

function drawPage(){
  var pc=document.getElementById('page-content')
  if(!pc){draw();return}
  // Capture active element before re-render
  var ae=document.activeElement
  var sid=ae&&ae.id?ae.id:'srch'  // fallback to 'srch' (search box)
  var isInput=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')
  var ss=isInput&&ae.selectionStart!=null?ae.selectionStart:null
  var se=isInput&&ae.selectionEnd!=null?ae.selectionEnd:null
  var curVal=isInput?ae.value:null
  // Re-render only the content area
  pc.innerHTML=htmlPage()
  // Restore focus and cursor
  var el=document.getElementById(sid)
  if(!el&&isInput) el=document.getElementById('srch')
  if(el&&isInput){
    el.focus()
    if(ss!=null&&el.setSelectionRange){
      try{el.setSelectionRange(ss,se)}catch(e){}
    }
  }
}

// ════════════════════════════════════════════════════════════════
// PUBLICACIONES — seguimiento del asesoramiento metodológico de publicación
// Hoja "Seguimientos": cada fila es un avance (etapa + fecha + nota) de un trabajo.
// La etapa actual se deriva del último avance y se guarda en Trabajos.etapa.
// ════════════════════════════════════════════════════════════════
let pubQ='',pubVista='tablero'

function isoLocal(d){return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function fechaLocal(s){const p=toISO(s||'').split('-');return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):null}
function diasHasta(s){const d=fechaLocal(s);if(!d)return null;const h=fechaLocal(fechaHoyLocal());return Math.round((d-h)/86400000)}
function sumarDias(s,n){const d=fechaLocal(s)||new Date();d.setDate(d.getDate()+n);return isoLocal(d)}

function segsDe(trabajoId,soloCliente){
  return(data.seguimientos||[]).filter(function(s){
    return s.trabajoId===trabajoId&&(!soloCliente||String(s.visibleCliente)!=='0')
  }).sort(function(a,b){
    const fa=toISO(a.fecha||''),fb=toISO(b.fecha||'')
    if(fa!==fb)return fa<fb?-1:1
    return String(a.createdAt||'').localeCompare(String(b.createdAt||''))
  })
}
function _etapaDeSegs(ss){
  for(let i=ss.length-1;i>=0;i--){
    if(ss[i].etapa==='rechazado')return'seleccion'
    if(ss[i].etapa)return ss[i].etapa
  }
  return''
}
function etapaActual(t){return t.etapa||_etapaDeSegs(segsDe(t.id))}
function reenviosUsados(tid){return segsDe(tid).filter(s=>s.etapa==='rechazado').length}
function reenviosMax(t){const x=detallesDe(t).reenviosMax;if(x===''||x===undefined)return 2;return parseInt(x)||0}
function diasSinMov(t){
  const ss=segsDe(t.id)
  const ref=ss.length?ss[ss.length-1].fecha:(t.fechaInicio||String(t.createdAt||'').slice(0,10))
  const d=diasHasta(ref)
  return d===null?0:-d
}

function htmlStepper(t){
  const cur=etapaActual(t)
  const ci=ETAPAS_PUB.findIndex(e=>e.id===cur)
  return'<div class="stepper">'+ETAPAS_PUB.map(function(e,i){
    const st=ci<0?'':i<ci?'done':i===ci?(cur==='publicado'?'done':'cur'):''
    return'<div class="step '+st+'"><div class="step-dot">'+(st==='done'?'✓':e.ic)+'</div><div class="step-l">'+esc(e.c)+'</div></div>'
  }).join('')+'</div>'
}

function htmlTimeline(t,soloCliente){
  const ss=segsDe(t.id,soloCliente).slice().reverse()
  if(!ss.length)return'<p style="font-size:12px;color:var(--text3);padding:6px 0">Aún no hay avances registrados.</p>'
  return'<div class="tl">'+ss.map(function(s){
    const e=etapaInfo(s.etapa)||{l:s.etapa||'Nota',ic:'📝'}
    const cls=s.etapa==='rechazado'?' rej':(s.etapa==='aceptado'||s.etapa==='publicado')?' ok':''
    return'<div class="tl-i'+cls+'"><div class="tl-h">'+e.ic+' '+esc(e.l)
      +(!soloCliente&&String(s.visibleCliente)==='0'?'<span class="b bx">solo interno</span>':'')
      +(!soloCliente?'<span style="margin-left:auto;display:flex;gap:4px">'
        +'<button class="btn btn-g btn-sm" style="padding:2px 7px" title="Editar" onclick="openModal(\'seguimiento\','+jss(s)+')">✏️</button>'
        +'<button class="btn btn-r btn-sm" style="padding:2px 7px" title="Eliminar" onclick="eliminarSeguimiento(\''+esc(s.id)+'\')">🗑</button></span>':'')
      +'</div>'
      +'<div class="tl-m">'+fmtD(s.fecha)+(s.revista?' · 📰 '+esc(s.revista):'')+(s.responsable&&!soloCliente?' · '+esc(s.responsable):'')+'</div>'
      +(s.nota?'<div class="tl-n">'+esc(s.nota)+'</div>':'')
      +'</div>'
  }).join('')+'</div>'
}

function htmlPubMeta(t){
  const d=detallesDe(t)
  const idx=(Array.isArray(d.indexacion)?d.indexacion:[]).map(x=>'<span class="idx">'+esc(x)+'</span>').join('')
  const apc=d.apcIncluido?(d.apcIncluido.split(' — ')[0]+(parseFloat(d.apcMonto)>0?' · $'+fmt(d.apcMonto):'')):'—'
  const items=[

  ]
  return'<div class="pub-meta">'+items.map(i=>'<div><span>'+i[0]+'</span><strong>'+i[1]+'</strong></div>').join('')+'</div>'

function msgPubAvance(t,seg){
  const cl=data.clientes.find(c=>c.id===t.clienteId)
  const ss=segsDe(t.id,true)
  const s=seg||ss[ss.length-1]||{}
  const et=etapaInfo(s.etapa||etapaActual(t))
  const det=detallesDe(t)
  let fecha=fmtDCorto(s.fecha||fechaHoyLocal())
  let tplId='pub_avance'
  if(s.etapa==='correcciones'){
    tplId='pub_revision'
    fecha=fmtDCorto(sumarDias(s.fecha||fechaHoyLocal(),parseInt(det.plazoRespuesta)||15))
  }
  const msg=waTpl(tplId,{nombre:cl&&cl.nombre||'',trabajo:t.titulo,etapa:et?et.l:'En preparación',revista:s.revista||det.revista||'Por definir',
    fecha:fecha,nota:s.nota||'',avance:parseInt(t.progreso)||0,prestador:prestador().nombre})
  // Sin nota: quita la línea "📝" vacía
  return msg.replace(/^📝 *$\n?/gm,'').replace(/\n{3,}/g,'\n\n')
}

  return'<div class="kpi"><div class="kpi-label">'+label+'</div><div class="kpi-value" style="color:'+color+'">'+val+'</div><div class="kpi-sub">'+sub+'</div><div class="kpi-icon">'+ic+'</div></div>'
}

  const cl=data.clientes.find(c=>c.id===t.clienteId)

    +'<div>'+(Array.isArray(d.indexacion)?d.indexacion.slice(0,3):[]).map(x=>'<span class="idx">'+esc(x)+'</span>').join('')+(d.cuartil&&d.cuartil!=='No aplica'?'<span class="idx" style="background:var(--brand-lt);color:var(--brand)">'+esc(d.cuartil)+'</span>':'')+'</div>'

// Recalcula etapa/progreso/estado del trabajo a partir de sus avances
function recalcularTrabajoPub(t,rec){
  const et=_etapaDeSegs(segsDe(t.id))
  const info=ETAPAS_PUB.find(e=>e.id===et)
  const det=Object.assign({},detallesDe(t))
  if(rec&&rec.revista&&rec.etapa!=='rechazado')det.revista=rec.revista
  let estado=t.estado
  if(et==='publicado')estado='Completado'
  else if((!estado||estado==='Nuevo')&&et)estado='En progreso'
  return Object.assign({},t,{etapa:et,progreso:info?String(info.pct):(t.progreso||'0'),estado:estado,detalles:JSON.stringify(det)})
}
// Cierra una operación de varias escrituras: informa y recarga en segundo plano
function finSync(results,okMsg){
  const bad=results.find(r=>!r||!r.ok)
  if(bad){
    syncMsg='Error: '+(bad&&bad.error||'Sin respuesta');syncErr=true
    toast('Error: '+(bad&&bad.error||'Sin respuesta'),'err');draw();return
  }
  syncMsg='✓ '+new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'});syncErr=false
  toast(okMsg);draw()
  apiGet('getData').then(function(rd){if(rd&&!rd.error){data=mapData(rd);draw()}})
}

async function submitSeguimiento(id,tid){
  const t=data.trabajos.find(x=>x.id===tid);if(!t)return
  const cl=data.clientes.find(c=>c.id===t.clienteId)
  const prev=id?(data.seguimientos.find(s=>s.id===id)||{}):{}
  const vis=document.getElementById('sg_v'),wa=document.getElementById('sg_w')
  const rec={id:id||uid(),trabajoId:tid,etapa:v('sg_e'),fecha:v('sg_f')||fechaHoyLocal(),nota:v('sg_n'),
    responsable:v('sg_p'),revista:v('sg_r'),visibleCliente:vis&&vis.checked?'1':'0',
    createdAt:prev.createdAt||new Date().toISOString()}
  const avisar=!!(wa&&wa.checked&&rec.visibleCliente==='1')
  data.seguimientos=id?data.seguimientos.map(s=>s.id===id?rec:s):data.seguimientos.concat([rec])
  const tUpd=recalcularTrabajoPub(t,rec)
  data.trabajos=data.trabajos.map(x=>x.id===tid?tUpd:x)
  // WhatsApp se abre antes de cualquier await para que el navegador no bloquee la ventana
  if(avisar&&cl&&cl.telefono)window.open(waUrl(cl.telefono,msgPubAvance(tUpd,rec)),'_blank')
  modal={type:'pub_detalle',rec:{trabajoId:tid}};syncMsg='Guardando...';syncErr=false;draw()
  // Cuotas vinculadas a esta etapa (hitos de la propuesta): vencen el día del avance
  const cuotasHito=data.cuotas.filter(c=>c.trabajoId===tid&&c.hitoEtapa&&c.hitoEtapa===rec.etapa&&cStat(c)!=='pagado')
  cuotasHito.forEach(function(c){c.fechaVencimiento=rec.fecha})
  const r1=await apiPost({action:id?'actualizar':'insertar',tabla:'Seguimientos',id:rec.id,fila:rec})
  const r2=await apiPost({action:'actualizar',tabla:'Trabajos',id:tid,fila:{etapa:tUpd.etapa,progreso:tUpd.progreso,estado:tUpd.estado,detalles:tUpd.detalles}})
  const rs=[r1,r2]
  for(const c of cuotasHito)rs.push(await apiPost({action:'actualizar',tabla:'Cuotas',id:c.id,fila:{fechaVencimiento:rec.fecha}}))
  finSync(rs,cuotasHito.length?'Avance registrado ✓ · cuota "'+cuotasHito[0].label.slice(0,40)+'" vence el '+fmtDCorto(rec.fecha):'Avance registrado ✓')
}

async function eliminarSeguimiento(sid){
  const s=data.seguimientos.find(x=>x.id===sid);if(!s)return
  if(!confirm('¿Eliminar este avance del historial?'))return
  const t=data.trabajos.find(x=>x.id===s.trabajoId)
  data.seguimientos=data.seguimientos.filter(x=>x.id!==sid)
  const tUpd=t?recalcularTrabajoPub(t,null):null
  if(tUpd)data.trabajos=data.trabajos.map(x=>x.id===tUpd.id?tUpd:x)
  syncMsg='Eliminando...';draw()
  const rs=[await apiPost({action:'eliminar',tabla:'Seguimientos',id:sid})]
  if(tUpd)rs.push(await apiPost({action:'actualizar',tabla:'Trabajos',id:tUpd.id,fila:{etapa:tUpd.etapa,progreso:tUpd.progreso,estado:tUpd.estado}}))
  finSync(rs,'Avance eliminado ✓')
}

function copiarTexto(btn,txt){
  const ok=function(){const o=btn.textContent;btn.textContent='✓ Copiado';setTimeout(function(){btn.textContent=o},2000)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok).catch(function(){prompt('Copia el enlace:',txt)})
  else prompt('Copia el enlace:',txt)
}

  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin">⟳</span> Guardando en Drive...'}
  _cargarJSZip(async function(){

// PROPUESTAS (PROFORMAS) — varios artículos por cliente
// Flujo: alta del cliente → propuesta → el cliente acepta un artículo →
// se crea el trabajo de publicación con detalles, cuotas por hito y contrato.
// Hoja "Propuestas": articulos y hitos se guardan como JSON.
// ════════════════════════════════════════════════════════════════
const HITOS_DEFAULT=[
  {l:'Al firmar: protocolo y registro en la plataforma PROSPERO',pct:30,etapa:''},
  {l:'Al enviar el manuscrito. Envío en las plataformas OJS',pct:30,etapa:'envio'},
  {l:'Al recibir la carta de aceptación',pct:40,etapa:'aceptado'}
]
const NOTA_PROPUESTA='Los autores eligen la posición según su acuerdo interno.'
const _json=function(s,def){if(Array.isArray(s))return s;try{const x=JSON.parse(s||'');return Array.isArray(x)?x:def}catch(e){return def}}
const artsDe=p=>_json(p&&p.articulos,[])
// Nº de autores de un trabajo para el "valor por autor" (los que pagan; si no hay autores registrados, el dato del detalle)
function nAutoresTrabajo(t){const au=autoresDe(t);if(au.length>1)return Math.max(1,au.filter(a=>!a.exento).length);return parseInt(detallesDe(t).numAutores)||1}
// Artículos aceptados cuyo valor o número de autores ya no coincide con su trabajo
function desajustesPropuesta(p){
  return artsDe(p).map(function(a){
    if(a.estado!=='aceptado'||!a.trabajoId)return null
    const t=data.trabajos.find(x=>x.id===a.trabajoId);if(!t)return null
    const vt=r2(parseFloat(t.total)||0),va=r2(parseFloat(a.total)||0),nt=nAutoresTrabajo(t),na=parseInt(a.autores)||1
    return vt!==va||nt!==na?{a:a,t:t,vt:vt,va:va,nt:nt,na:na}:null
  }).filter(Boolean)
}
// Copia a la propuesta el valor y los autores actuales de los trabajos creados desde ella
async function sincronizarPropuesta(pid,silencioso){
  const p=data.propuestas.find(x=>x.id===pid);if(!p)return
  const ds=desajustesPropuesta(p);if(!ds.length)return
  const arts=artsDe(p).map(a=>{const d=ds.find(x=>x.a.id===a.id);return d?Object.assign({},a,{total:d.vt,autores:d.nt}):a})
  const val=JSON.stringify(arts)
  data.propuestas=data.propuestas.map(x=>x.id===pid?Object.assign({},x,{articulos:val}):x)
  if(!silencioso)draw()
  const r=await apiPost({action:'actualizar',tabla:'Propuestas',id:pid,fila:{articulos:val}})
  if(!silencioso){if(r&&r.ok)toast('Propuesta actualizada con los valores de sus trabajos ✓');else toast('Error: '+(r&&r.error||'Sin respuesta'),'err')}
}
// Tras cambiar un trabajo, su propuesta de origen se actualiza sola
function sincronizarPropuestaDeTrabajo(tid){
  const p=(data.propuestas||[]).find(x=>artsDe(x).some(a=>a.trabajoId===tid));if(p)sincronizarPropuesta(p.id,true)
}
const hitosDe=p=>{const h=_json(p&&p.hitos,[]);return h.length?h:HITOS_DEFAULT.map(x=>Object.assign({},x))}
const porAutor=a=>{const n=parseInt(a.autores)||1;return(parseFloat(a.total)||0)/n}
// "2.000 USD" (formato de la plantilla)
function fmtUSD(n){
  n=Math.round((parseFloat(n)||0)*100)/100
  const ent=Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')
  const dec=Math.round((n-Math.floor(n))*100)
  return ent+(dec?','+String(dec).padStart(2,'0'):'')+' USD'
}
function tiempoTxt(a){
  const mn=parseInt(a.tMin),mx=parseInt(a.tMax)
  if(mn&&mx&&mx!==mn)return mn+'–'+mx+' meses'
  if(mn||mx)return(mn||mx)+' meses'
  return'—'
}
// Reparte un monto según los porcentajes; el último hito absorbe el redondeo
function repartir(monto,hitos){
  let acum=0
  return hitos.map(function(h,i){
    if(i===hitos.length-1)return Math.round((monto-acum)*100)/100
    const x=Math.round(monto*(parseFloat(h.pct)||0))/100;acum+=x;return x
  })
}
function estadoPropuesta(p){
  const arts=artsDe(p)
  const acept=arts.filter(a=>a.estado==='aceptado').length
  const desc=arts.filter(a=>a.estado==='descartado').length
  if(arts.length&&acept+desc===arts.length)return acept?'Aceptada':'Rechazada'
  if(acept)return'Parcial'
  return p.docUrl?'Enviada':(p.estado==='Enviada'?'Enviada':'Borrador')
}
const COLOR_PROP={Borrador:'gray',Enviada:'blue',Parcial:'amber',Aceptada:'green',Rechazada:'red'}

function _propLeer(){
  const d=modal&&modal.rec;if(!d)return null
  const A=['tipo','titulo','revista','indexacion','cuartil','tipoArticulo','editorial','tipoObra','formato','paginas','detalle','total','autores','tMin','tMax']
  d._arts=d._arts.map(function(a,i){
    const o=Object.assign({},a)
    A.forEach(function(k){const el=document.getElementById('pa_'+i+'_'+k);if(el)o[k]=el.value})
    return o
  })
  d._hitos=d._hitos.map(function(x,i){
    const o=Object.assign({},x)
    ;['l','pct','etapa'].forEach(function(k){const el=document.getElementById('ph_'+i+'_'+k);if(el)o[k]=el.value})
    o.pct=parseFloat(o.pct)||0
    return o
  })
  ;[['clienteId','pp_cl'],['area','pp_a'],['titulo','pp_t'],['fecha','pp_f'],['validez','pp_v'],['notas','pp_n']].forEach(function(p){
    const el=document.getElementById(p[1]);if(el)d[p[0]]=el.value
  })
  return d
}
// Agregar/quitar filas: se lee el formulario y se redibuja con un modal nuevo (sin restaurar valores viejos)
function _propRedibujar(){const d=modal.rec;modal={type:'propuesta',rec:d};draw()}
function _propAgregar(k,tipo){_propLeer();modal.rec[k].push(k==='_arts'?{id:uid(),estado:'propuesto',tipo:tipo||TIPO_PUB,autores:modeloTrabajo(tipo||TIPO_PUB)==='publicacion'?((modal.rec._arts.find(x=>modeloTrabajo(x.tipo||TIPO_PUB)==='publicacion')||{}).autores||1):1}:{l:'',pct:0,etapa:''});_propRedibujar()}
function _propQuitar(k,i){_propLeer();modal.rec[k].splice(i,1);_propRedibujar()}
function _propPorAutor(i){
  const t=parseFloat(v('pa_'+i+'_total'))||0,n=parseInt(v('pa_'+i+'_autores'))||1
  const el=document.getElementById('pa_'+i+'_pa');if(el)el.textContent='Por autor: '+fmtUSD(t/n)
}
function _propSumaHitos(){
  let s=0;document.querySelectorAll('[id^="ph_"][id$="_pct"]').forEach(function(el){s+=parseFloat(el.value)||0})
  const el=document.getElementById('ph_suma');if(el){el.textContent='Total: '+fmt(s)+' %';el.style.color=Math.abs(s-100)<0.01?'var(--green)':'var(--red)'}
}
function _propTituloAuto(){
  const t=document.getElementById('pp_t');if(!t||t.dataset.auto!=='1')return
  const a=v('pp_a').trim();t.value='Propuesta de publicaciones'+(a?' para '+a:'')
}
function _propClienteCambia(){
  const cl=data.clientes.find(c=>c.id===v('pp_cl'))
  const a=document.getElementById('pp_a')
  if(cl&&cl.area&&a&&!a.value){a.value=cl.area;_propTituloAuto()}
}
async function submitPropuesta(verDoc){
  const d=_propLeer();if(!d)return
  if(!d.clienteId){alert('Selecciona un cliente');return}
  const arts=d._arts.filter(a=>String(a.titulo||'').trim())
  if(!arts.length){alert('Agrega al menos un trabajo con título');return}
  const suma=d._hitos.reduce((s,x)=>s+(parseFloat(x.pct)||0),0)
  if(Math.abs(suma-100)>0.01&&!confirm('Los porcentajes de pago suman '+fmt(suma)+' % (no 100 %). ¿Guardar de todas formas?'))return
  const cl=data.clientes.find(c=>c.id===d.clienteId)
  const isNew=!d.id
  const rec={id:d.id||uid(),clienteId:d.clienteId,clienteNombre:cl&&cl.nombre||'',titulo:d.titulo||'Propuesta de publicaciones',
    area:d.area||'',fecha:d.fecha||fechaHoyLocal(),validez:d.validez||'15',notas:d.notas||'',
    articulos:JSON.stringify(arts.map(function(a){const m=modeloTrabajo(a.tipo||TIPO_PUB);return{id:a.id||uid(),tipo:a.tipo||TIPO_PUB,titulo:a.titulo.trim(),
      revista:m==='publicacion'?a.revista||'':'',indexacion:m==='publicacion'?a.indexacion||'':'',cuartil:m==='publicacion'?a.cuartil||'':'',tipoArticulo:m==='publicacion'?a.tipoArticulo||'':'',
      editorial:m==='libro'?a.editorial||'':'',tipoObra:m==='libro'?a.tipoObra||'':'',formato:m==='libro'?a.formato||'':'',paginas:m==='libro'?a.paginas||'':'',detalle:m!=='publicacion'&&m!=='libro'?a.detalle||'':'',
      total:parseFloat(a.total)||0,autores:parseInt(a.autores)||1,tMin:parseInt(a.tMin)||'',tMax:parseInt(a.tMax)||'',estado:a.estado||'propuesto',trabajoId:a.trabajoId||''}})),
    hitos:JSON.stringify(d._hitos.filter(x=>String(x.l||'').trim())),
    docUrl:d.docUrl||'',docFecha:d.docFecha||'',createdAt:d.createdAt||new Date().toISOString()}
  rec.estado=estadoPropuesta(rec)

// Convierte un artículo aceptado en trabajo de publicación (+ cuotas por hito) y abre su contrato
async function aceptarArticulo(pid,aid){
  const p=data.propuestas.find(x=>x.id===pid);if(!p)return
  const arts=artsDe(p),a=arts.find(x=>x.id===aid);if(!a)return
  const hitos=hitosDe(p)
  const tipoT=a.tipo||TIPO_PUB,modT=modeloTrabajo(tipoT)
  if(!confirm('Se creará el trabajo "'+a.titulo.slice(0,70)+'…" ('+tipoT+') con '+hitos.length+' cuota(s) y su contrato.\n\n¿Continuar?'))return
  const cl=data.clientes.find(c=>c.id===p.clienteId)
  const hoy=fechaHoyLocal()
  const mesesFin=parseInt(a.tMax)||parseInt(a.tMin)||12
  const fin=(function(){const d=fechaLocal(hoy);d.setMonth(d.getMonth()+mesesFin);return isoLocal(d)})()
  const mMin=parseInt(a.tMin)||mesesFin
  const cuart=CUARTILES.indexOf(a.cuartil)>-1?a.cuartil:''
  const idx=String(a.indexacion||'').split(/\s*[,;]\s*/).filter(Boolean)
  const tid=uid(),total=parseFloat(a.total)||0,nA=parseInt(a.autores)||1
  const comunes={area:p.area||'',autores:cl&&cl.nombre||'',numAutores:String(nA),frecuencia:'Quincenal',propuestaId:pid,
    clausulasExtra:(nA>1?'El valor por autor es de '+fmtUSD(total/nA)+' ('+nA+' autores). ':'')+(p.notas||'')}
  const det=modT==='publicacion'?Object.assign({tipoArticulo:a.tipoArticulo||'',revista:a.revista||'',cuartil:cuart,indexacion:idx,reenviosMax:'2'},comunes)
    :modT==='libro'?Object.assign({tipoObra:a.tipoObra||'',editorial:a.editorial||'',formato:a.formato||'',paginas:a.paginas||''},comunes)
    :Object.assign({alcanceTxt:a.detalle||''},comunes)
  const t={id:tid,clienteId:p.clienteId,clienteNombre:cl&&cl.nombre||'',titulo:a.titulo,tipo:tipoT,estado:'Nuevo',total:total,progreso:'0',
    fechaInicio:hoy,fechaFin:fin,notas:'Creado desde la propuesta: '+(p.titulo||''),carpeta:'',detalles:JSON.stringify(det),etapa:'',contratoUrl:'',contratoFecha:'',createdAt:new Date().toISOString(),
    autores:JSON.stringify([{id:'a'+uid(),clienteId:p.clienteId,nombre:cl&&cl.nombre||'',rol:'correspondencia',pct:100,tipo:'pct',cuotas:'plan',orcid:cl&&cl.orcid||''}]),modoCobro:'responsable'}
  // Fechas estimadas de cada hito (se ajustan solas al registrar la etapa vinculada)
  const FRAC={diagnostico:.1,ajuste:.25,seleccion:.35,envio:.45,revision:.55,correcciones:.7,aceptado:.9,publicado:1}
  const montos=repartir(total,hitos)
  const cuotas=hitos.map(function(hh,i){
    const f=i===0?0:(FRAC[hh.etapa]!==undefined?FRAC[hh.etapa]:i/(hitos.length-1))
    const dt=fechaLocal(hoy);dt.setMonth(dt.getMonth()+Math.round(mMin*f))
    return{id:uid(),trabajoId:tid,clienteId:p.clienteId,clienteNombre:cl&&cl.nombre||'',trabajoTitulo:a.titulo,
      label:(parseFloat(hh.pct)||0)+' % — '+hh.l,fechaVencimiento:isoLocal(dt),acordado:montos[i],pagado:0,estado:'pendiente',hitoEtapa:modT==='publicacion'?hh.etapa||'':''}
  })
  const arts2=arts.map(x=>x.id===aid?Object.assign({},x,{estado:'aceptado',trabajoId:tid}):x)
  const pUpd=Object.assign({},p,{articulos:JSON.stringify(arts2)});pUpd.estado=estadoPropuesta(pUpd)
  // Optimista
  data.trabajos=data.trabajos.concat([t]);data.cuotas=data.cuotas.concat(cuotas)
  data.propuestas=data.propuestas.map(x=>x.id===pid?pUpd:x)
  syncMsg='Creando trabajo...';syncErr=false
  // Con varios autores se abre primero la pantalla de autores (nombre, cédula, ORCID y cuánto paga cada uno); luego el contrato
  if(nA>1){abrirAutores(tid,{luegoContrato:true,vacias:nA-1});toast('Registra a los '+(nA-1)+' coautor(es) con su ORCID')}
  else abrirContrato(tid)
  const rs=[await apiPost({action:'insertar',tabla:'Trabajos',fila:t})]
  for(const c of cuotas)rs.push(await apiPost({action:'insertar',tabla:'Cuotas',fila:c}))
  rs.push(await apiPost({action:'actualizar',tabla:'Propuestas',id:pid,fila:{articulos:pUpd.articulos,estado:pUpd.estado}}))
  finSync(rs,'Trabajo creado con '+cuotas.length+' cuota(s) ✓')
}

function _construirProforma(p){
  const cl=data.clientes.find(c=>c.id===p.clienteId)
  const arts=artsDe(p).filter(a=>a.estado!=='descartado')
  const hitos=hitosDe(p)
  const S=22 // 11 pt, como la plantilla

  let body=''
  body+=_p(String(p.titulo||'Propuesta de publicaciones').toUpperCase(),{sz:28,bold:true,color:'000000',align:'center',before:120,after:60})
  body+=_p((cl?'Dirigida a: '+cl.nombre+(cl.institucion?' — '+cl.institucion:'')+'   ·   ':'')+'Fecha: '+fmtDCorto(p.fecha||fechaHoyLocal())
    +(p.validez?'   ·   Validez: '+p.validez+' días':''),{sz:18,color:'555555',align:'center',after:200})
  const soloArt=arts.every(a=>modeloTrabajo(a.tipo||TIPO_PUB)==='publicacion')

    arts.forEach(function(a,i){
      body+='<w:tr><w:trPr><w:cantSplit/></w:trPr>'
        +celda(String(i+1),W[0])+celda(a.titulo,W[1])+celda(a.revista||'—',W[2])+celda(a.cuartil||'—',W[3])
        +celda(fmtUSD(a.total),W[4])+celda(fmtUSD(porAutor(a)),W[5])+celda(tiempoTxt(a),W[6])+'</w:tr>'
    })
    body+='</w:tbl>'
  }else{
    const W=[400,3300,1500,1900,1000,1000,900]
    body+=_tblStart(W,negro)
    body+='<w:tr><w:trPr><w:cantSplit/><w:tblHeader/></w:trPr>'+['#','Trabajo','Tipo','Detalle','Total','Por autor','Tiempo'].map((x,i)=>celda(x,W[i],{bold:true})).join('')+'</w:tr>'
    arts.forEach(function(a,i){const m=modeloTrabajo(a.tipo||TIPO_PUB)
      body+='<w:tr><w:trPr><w:cantSplit/></w:trPr>'
        +celda(String(i+1),W[0])+celda(a.titulo,W[1])+celda(({publicacion:'Artículo científico',libro:'Libro',tesis:'Tesis / proyecto',estadistica:'Análisis estadístico',revision:'Revisión / instrumentos'})[m]||'Servicio',W[2])
        +celda(detalleItemProp(a)+(m==='publicacion'&&a.cuartil?' · '+a.cuartil:'')+(m==='libro'&&a.formato?' · '+a.formato:''),W[3])
        +celda(fmtUSD(a.total),W[4])+celda(fmtUSD(porAutor(a)),W[5])+celda(tiempoTxt(a),W[6])+'</w:tr>'
    })
    body+='</w:tbl>'
  }
  body+=_p('Forma de pago sugerida (por autor):',{sz:S,bold:true,color:'000000',before:160,after:80})
  hitos.forEach(function(h){
    body+='<w:p><w:pPr><w:spacing w:before="0" w:after="100"/><w:ind w:left="720" w:hanging="360"/></w:pPr>'
      +'<w:r><w:rPr>'+DOC_RF+'<w:sz w:val="'+S+'"/></w:rPr><w:t xml:space="preserve">•\t</w:t></w:r>'
      +'<w:r><w:rPr>'+DOC_RF+'<w:sz w:val="'+S+'"/></w:rPr><w:t xml:space="preserve">'+_xml(fmt(h.pct)+' % '+String(h.l||'').replace(/^al /i,'al ').replace(/^Al /,'al '))+'</w:t></w:r></w:p>'
  })
  // Ejemplo con el primer artículo, como en la plantilla ("en un Q2 serían 150 + 150 + 200 USD por autor")
  const ej=arts[0]

    const partes=repartir(porAutor(ej),hitos).map(x=>fmtUSD(x).replace(' USD',''))

  return{body:body,filename:'Proforma_'+nombre+'_'+String(p.fecha||fechaHoyLocal()).slice(0,10)+'.docx'}

}

// Explica cómo resolver los errores más comunes del Apps Script (permisos de Drive/correo, versión, administrador)
function ayudaErrorServidor(msg){
  msg=String(msg||'')
  if(/permiso|permission|authoriz|DriveApp|MailApp|googleapis\.com\/auth/i.test(msg))
    return'\n\n— CÓMO SOLUCIONARLO —\nEl Apps Script todavía no tiene todos los permisos (por ejemplo, crear archivos en Google Drive).\n1. Abre el proyecto en script.google.com.\n2. En la barra superior elige la función "autorizarPermisos" y pulsa ▶ Ejecutar.\n3. En la pantalla de Google marca TODAS las casillas (o "Seleccionar todo") y pulsa Continuar (si aparece "Google no verificó esta app": Configuración avanzada → Ir a…).\n4. Vuelve aquí e inténtalo de nuevo.'
  if(/admin|contraseña/i.test(msg))return'\n\nRevisa que iniciaste sesión con un usuario administrador.'
  return'\n\nSi el problema es del servidor, revisa en Configuración → Verificar que el Apps Script sea v7.9 y tenga los permisos concedidos.'
}

// AUDITORÍA DE CONTRATOS — código QR, firma electrónica y verificación
// Flujo: revisar → Aprobar y emitir (código + QR + huella SHA-256 en el servidor)

const LIB_QR='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'
const LIB_FORGE='https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js'
function cargarLib(url,glob){
  return new Promise(function(res,rej){
    if(window[glob])return res(window[glob])
    const s=document.createElement('script');s.src=url
    s.onload=function(){window[glob]?res(window[glob]):rej(new Error('No se pudo cargar '+glob))}
    s.onerror=function(){rej(new Error('Sin conexión para cargar '+glob))}
    document.head.appendChild(s)
  })
}
const cargarJSZipP=()=>new Promise(r=>_cargarJSZip(r))
const bufHex=buf=>Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')
async function sha256Hex(u8){return bufHex(await crypto.subtle.digest('SHA-256',u8))}
function bytesToB64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function bytesToLatin1(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return s}
// Código no adivinable: RA-AAAA-XXXXXXXX (sin letras confundibles)
function genCodigo(){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=new Uint8Array(8);crypto.getRandomValues(r)
  return'RA-'+new Date().getFullYear()+'-'+Array.from(r).map(x=>A[x%A.length]).join('')
}
const urlVerificacion=codigo=>urlApp()+'?v='+encodeURIComponent(codigo)
async function qrPngB64(texto,nivel){
  await cargarLib(LIB_QR,'qrcode')
  // UTF-8 para que tildes y Ñ (p. ej. en el nombre del firmante) se lean bien
  if(qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs['UTF-8'])qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8']
  const q=qrcode(0,nivel||'M');q.addData(texto,'Byte');q.make()
  const n=q.getModuleCount(),px=10,m=4,c=document.createElement('canvas')
  c.width=c.height=(n+2*m)*px
  const g=c.getContext('2d');g.fillStyle='#FFFFFF';g.fillRect(0,0,c.width,c.height);g.fillStyle='#0B2545'
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect((k+m)*px,(r+m)*px,px,px)
  return c.toDataURL('image/png').split(',')[1]
}

function fmtFechaHora(iso){
  if(!iso)return'—'

  return d.toLocaleString('es-EC',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})
}

function elegirP12(input){
  const f=input.files&&input.files[0];input.value=''
  if(!f)return
  if(!/\.(p12|pfx)$/i.test(f.name)&&!confirm('El archivo no tiene extensión .p12 / .pfx. ¿Usarlo de todas formas?'))return
  f.arrayBuffer().then(function(b){_p12Cache={nombre:f.name,bytes:new Uint8Array(b)};draw()})
}
function _p12Actual(){
  if(_p12Cache)return _p12Cache
  const r=p12Recordado()
  return r?{nombre:r.nombre,bytes:Uint8Array.from(atob(r.b64),c=>c.charCodeAt(0)),recordado:true}:null
}

function descargarEmitido(codigo){
  const x=window._emitidos&&window._emitidos[codigo];if(!x)return false
  const url=URL.createObjectURL(new Blob([x.u8],{type:x.mime||'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}))
  const a=document.createElement('a');a.href=url;a.download=x.nombre;document.body.appendChild(a);a.click();a.remove()
  setTimeout(()=>URL.revokeObjectURL(url),5000);return true
}

// ── Análisis de firmas electrónicas del PDF (PAdES / CMS) ──
// Lee cada firma: firmante y emisor del certificado, fecha, si el documento no cambió
// después de firmar y si la firma criptográfica es válida. No valida la cadena de la
// entidad certificadora (eso lo hacen los validadores oficiales de firma electrónica).
const OID_HASH={'1.3.14.3.2.26':'SHA-1','2.16.840.1.101.3.4.2.1':'SHA-256','2.16.840.1.101.3.4.2.2':'SHA-384','2.16.840.1.101.3.4.2.3':'SHA-512'}
const FORGE_MD={'SHA-1':'sha1','SHA-256':'sha256','SHA-384':'sha384','SHA-512':'sha512'}
function _textosAsn1(n,out){
  if(!n)return out
  if(Array.isArray(n.value))n.value.forEach(x=>_textosAsn1(x,out))
  else if(typeof n.value==='string'&&n.value.length<200)out.push(n.value)
  return out
}
async function analizarPdfFirmas(u8,codigo){
  const txt=bytesToLatin1(u8)
  const out={esPdf:txt.slice(0,5)==='%PDF-',firmas:[],codigoEncontrado:false}
  if(codigo){
    const u16=Array.from(codigo).map(ch=>'\x00'+ch).join('')
    const hx=Array.from(codigo).map(ch=>'00'+ch.charCodeAt(0).toString(16).toUpperCase()).join('')
    out.codigoEncontrado=txt.indexOf(codigo)>-1||txt.indexOf(u16)>-1||txt.toUpperCase().indexOf(hx)>-1
  }
  const re=/\/ByteRange\s*\[\s*(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s*\]/g
  const vistos={};let m
  while((m=re.exec(txt))){
    const br=[+m[1],+m[2],+m[3],+m[4]],k=br.join(',')
    if(vistos[k]||br[2]+br[3]>u8.length)continue
    vistos[k]=1
    const f={byteRange:br,cubreFinal:br[2]+br[3]===u8.length}
    try{await _analizarCMS(f,u8,txt)}catch(e){f.error=e.message||String(e)}
    out.firmas.push(f)
  }
  // En orden de firma: la que termina antes en el archivo es la más antigua
  out.firmas.sort((a,b)=>(a.byteRange[2]+a.byteRange[3])-(b.byteRange[2]+b.byteRange[3]))
  out.firmas.forEach((f,i)=>{f.orden=i+1})
  // Si la última firma no llega al final del archivo, hubo cambios después de firmar
  const ult=out.firmas.reduce((a,f)=>!a||f.byteRange[2]+f.byteRange[3]>a.byteRange[2]+a.byteRange[3]?f:a,null)
  out.modificadoDespues=!!ult&&!ult.cubreFinal
  return out
}
async function _analizarCMS(f,u8,txt){
  await cargarLib(LIB_FORGE,'forge')
  const A=forge.asn1,br=f.byteRange
  const hex=txt.slice(br[0]+br[1],br[2]).replace(/[^0-9a-fA-F]/g,'')
  const ci=A.fromDer(forge.util.createBuffer(forge.util.hexToBytes(hex)),{parseAllBytes:false,strict:false})
  if(A.derToOid(ci.value[0].value)!=='1.2.840.113549.1.7.2')throw new Error('No es una firma CMS')
  const sd=ci.value[1].value[0],hijos=sd.value
  const certsNode=hijos.find(n=>n.tagClass===A.Class.CONTEXT_SPECIFIC&&n.type===0)
  const si=hijos[hijos.length-1].value[0]
  const algHash=OID_HASH[A.derToOid(si.value[2].value[0].value)]
  if(!algHash)throw new Error('Algoritmo de resumen no soportado')
  const attrs=si.value.find(n=>n.tagClass===A.Class.CONTEXT_SPECIFIC&&n.type===0)
  const sigNode=si.value.filter(n=>n.tagClass===A.Class.UNIVERSAL&&n.type===A.Type.OCTETSTRING).pop()
  // Huella del contenido firmado (todo el PDF excepto el hueco de la firma)
  const cont=new Uint8Array(br[1]+br[3]);cont.set(u8.subarray(br[0],br[0]+br[1]),0);cont.set(u8.subarray(br[2],br[2]+br[3]),br[1])
  const dig=bufHex(await crypto.subtle.digest(algHash,cont))
  let md=null,fecha=null
  if(attrs)attrs.value.forEach(function(a){
    const oid=A.derToOid(a.value[0].value),v=a.value[1].value[0]
    if(oid==='1.2.840.113549.1.9.4')md=forge.util.bytesToHex(v.value)
    if(oid==='1.2.840.113549.1.9.5')fecha=v.type===A.Type.UTCTIME?A.utcTimeToDate(v.value):A.generalizedTimeToDate(v.value)
  })
  f.algoritmo=algHash;f.fecha=fecha?fecha.toISOString():''
  f.integridad=attrs?md===dig:null
  // Certificado del firmante (por número de serie)
  const sid=si.value[1]
  const serial=sid.type===A.Type.SEQUENCE?forge.util.bytesToHex(sid.value[1].value):null
  let certAsn=null
  if(certsNode)for(const c of certsNode.value){
    const tbs=c.value[0],idx=tbs.value[0].tagClass===A.Class.CONTEXT_SPECIFIC?1:0
    if(!serial||forge.util.bytesToHex(tbs.value[idx].value)===serial){certAsn=c;break}
  }
  if(!certAsn&&certsNode)certAsn=certsNode.value[0]
  if(!certAsn)throw new Error('La firma no incluye el certificado')
  const cert=forge.pki.certificateFromAsn1(certAsn)
  const campo=(ent,n)=>{const x=ent.getField(n);return x?String(x.value):''}
  f.nombre=campo(cert.subject,'CN')
  f.emisor=campo(cert.issuer,'O')||campo(cert.issuer,'CN')
  f.validoDesde=cert.validity.notBefore.toISOString();f.validoHasta=cert.validity.notAfter.toISOString()
  // Identificación (cédula/RUC): en el sujeto o en las extensiones del certificado ecuatoriano
  const textos=cert.subject.attributes.map(a=>String(a.value))
  ;(cert.extensions||[]).forEach(function(e){try{_textosAsn1(A.fromDer(e.value,{strict:false}),textos)}catch(x){}})
  const ced=textos.join(' ').match(/\b(\d{10}(?:001)?)\b/)
  f.cedula=ced?ced[1]:''
  // Firma criptográfica (RSA PKCS#1 v1.5) sobre los atributos firmados
  let digBytes
  if(attrs){const m2=forge.md[FORGE_MD[algHash]].create();m2.update(A.toDer(A.create(A.Class.UNIVERSAL,A.Type.SET,true,attrs.value)).getBytes());digBytes=m2.digest().getBytes()}
  else digBytes=forge.util.hexToBytes(dig)
  try{f.firmaValida=!!cert.publicKey.verify(digBytes,sigNode.value)}catch(e){f.firmaValida=false}
  if(fecha)f.certVigente=fecha>=cert.validity.notBefore&&fecha<=cert.validity.notAfter
}
function textoFirma(f){
  if(f.error)return'Firma '+f.orden+': no se pudo leer ('+f.error+')'
  return'Firma '+f.orden+': '+(f.nombre||'—')+(f.cedula?' · C.I. '+f.cedula:'')+(f.emisor?' · emitido por '+f.emisor:'')
    +(f.fecha?' · '+fmtFechaHora(f.fecha):'')
    +' · '+(f.firmaValida&&f.integridad!==false?'firma válida':'⚠ firma NO válida')
    +(f.integridad===false?' (documento modificado)':'')+(f.certVigente===false?' (certificado no vigente)':'')
}
const slimFirma=f=>({orden:f.orden,nombre:f.nombre||'',cedula:f.cedula||'',emisor:f.emisor||'',fecha:f.fecha||'',valida:!!(f.firmaValida&&f.integridad!==false),error:f.error||''})

// ── Subir PDF firmado ──
async function subirFirmadoUI(codigo,etapa,input){
  const file=input.files&&input.files[0];input.value=''
  if(!file)return
  if(file.size>20*1024*1024){alert('El PDF supera los 20 MB');return}
  const reg=(data.contratos||[]).find(c=>c.id===codigo);if(!reg)return
  const t=data.trabajos.find(x=>x.id===reg.trabajoId),cl=t&&data.clientes.find(c=>c.id===t.clienteId),pr=prestador()
  toast('Analizando el PDF y sus firmas…')
  let an
  try{const u8=new Uint8Array(await file.arrayBuffer());an=await analizarPdfFirmas(u8,codigo);an.u8=u8}catch(e){alert('No se pudo leer el archivo: '+e.message);return}
  if(!an.esPdf){alert('El archivo no es un PDF.');return}
  if(etapa==='prestador'&&!an.firmas.length){alert('Este PDF no tiene firma electrónica.\n\nFírmalo con un certificado de firma electrónica y vuelve a subirlo.');return}
  const avisos=[]
  if(!an.codigoEncontrado)avisos.push('No se pudo confirmar el código '+codigo+' dentro del PDF. Revisa que el PDF muestre el QR y ese código en el pie de página: si el cliente generó un documento nuevo, no es el contrato emitido.')

    +'\n\n¿Registrar este PDF como contrato firmado '+(etapa==='ambos'?'POR AMBAS PARTES':'POR EL PRESTADOR')+'?'))return

    base64:bytesToB64(an.u8),firmas:JSON.stringify(an.firmas.map(slimFirma)),resumenFirmas:an.firmas.map(f=>(f.nombre||'—')+(f.firmaValida&&f.integridad!==false?' ✓':' ⚠')).join('; '),
    notificar:!!(mail&&mail.checked),emailCliente:cl&&cl.email||'',urlVerificar:urlVerificacion(codigo)})
  if(!r||!r.ok){syncErr=true;syncMsg='Error';draw();alert('No se pudo registrar el PDF firmado.\n\n'+(r&&r.error||'Sin respuesta'));return}
  const cambios=etapa==='ambos'
    ?{estado:'firmado',fechaFirmaAmbos:r.fecha,hashFirmaAmbos:r.hash,urlFirmaAmbos:r.url,firmasAmbos:JSON.stringify(an.firmas.map(slimFirma))}
    :{estado:'firmado_prestador',fechaFirmaPrestador:r.fecha,hashFirmaPrestador:r.hash,urlFirmaPrestador:r.url,firmasPrestador:JSON.stringify(an.firmas.map(slimFirma))}
  data.contratos=data.contratos.map(c=>c.id===codigo?Object.assign({},c,cambios):c)
  if(t)data.trabajos=data.trabajos.map(x=>x.id===t.id?Object.assign({},x,{contratoUrl:r.url}):x)
  if(modal&&modal.rec)modal.rec._hist=null
  syncMsg='✓ Firma registrada';toast(etapa==='ambos'?'Contrato firmado por ambas partes ✓':'Tu firma quedó registrada ✓');draw()
}

async function compararCopia(input){
  const file=input.files&&input.files[0];input.value='';if(!file||!VERIF.res)return
  const u8=new Uint8Array(await file.arrayBuffer()),hash=await sha256Hex(u8),c=VERIF.res.contrato

  if(bytesToLatin1(u8.subarray(0,5))==='%PDF-'){try{an=await analizarPdfFirmas(u8,c.codigo)}catch(e){}}
  VERIF.cmp={nombre:file.name,hash:hash,coincide:coincide,an:an};draw()

      if(k.an&&k.an.firmas.length)h+='<div style="font-size:12px;margin-top:6px">'+k.an.firmas.map(f=>'<div style="margin-top:3px">'+(f.firmaValida&&f.integridad!==false?'✅':'⚠️')+' '+esc(textoFirma(f))+'</div>').join('')+(k.an.modificadoDespues?'<div style="color:var(--red);margin-top:4px">⚠️ El PDF tiene cambios posteriores a la última firma.</div>':'')+'</div>'
    }
    h+='<div class="sec-t">Historial de auditoría</div>'+htmlEventos(r)
  }else{
    h+='<p style="margin-top:14px;font-size:13px;color:var(--text3)">Escribe el código impreso junto al código QR del contrato, o escanea el QR con la cámara del teléfono.</p>'
  }

  return h
}
function _cajaVerif(color,tit,txt){

// ════════════════════════════════════════════════════════════════
// PDF — generado en el navegador a partir del mismo contenido del Word
// (párrafos y tablas de WordprocessingML) con el membrete: logo, QR, ondas y pie.
// ════════════════════════════════════════════════════════════════
const LIB_PDFLIB='https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js'
const W_NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main'
const TW=t=>(parseFloat(t)||0)/20               // twips → puntos
const hexRgb=h=>{h=String(h||'000000').replace('#','');const n=parseInt(h.length===6?h:'000000',16);return PDFLib.rgb(((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255)}
function _wHijo(el,n){for(const c of el.childNodes)if(c.nodeType===1&&c.localName===n)return c;return null}
function _wAttr(el,n){return el?el.getAttributeNS(W_NS,n)||el.getAttribute('w:'+n):null}
// Interpreta el subconjunto de WordprocessingML que generan los documentos de la app
function _modeloBody(body){
  const xml='<w:document xmlns:w="'+W_NS+'" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>'
    +body.replace(/<w:sectPr>[\s\S]*?<\/w:sectPr>/g,'')+'</w:body></w:document>'
  const doc=new DOMParser().parseFromString(xml,'application/xml')
  if(doc.getElementsByTagName('parsererror').length)throw new Error('Documento no válido')
  const par=function(p){
    const pPr=_wHijo(p,'pPr'),sp=pPr&&_wHijo(pPr,'spacing'),jc=pPr&&_wHijo(pPr,'jc'),ind=pPr&&_wHijo(pPr,'ind'),bd=pPr&&_wHijo(pPr,'pBdr')
    const bot=bd&&_wHijo(bd,'bottom')
    const runs=[]
    for(const r of p.childNodes){
      if(r.nodeType!==1||r.localName!=='r')continue
      const rPr=_wHijo(r,'rPr'),t=_wHijo(r,'t');if(!t)continue
      const sz=rPr&&_wHijo(rPr,'sz'),co=rPr&&_wHijo(rPr,'color')
      runs.push({text:t.textContent.replace(/\t/g,'  '),bold:!!(rPr&&_wHijo(rPr,'b')),size:sz?parseFloat(_wAttr(sz,'val'))/2:11,color:co?_wAttr(co,'val'):'000000'})
    }
    return{type:'p',runs:runs,before:TW(sp&&_wAttr(sp,'before')),after:sp&&_wAttr(sp,'after')!=null?TW(_wAttr(sp,'after')):4,
      align:(jc&&_wAttr(jc,'val'))||'left',keep:!!(pPr&&_wHijo(pPr,'keepNext')),
      indLeft:TW(ind&&_wAttr(ind,'left')),hanging:TW(ind&&_wAttr(ind,'hanging')),
      border:bot?{color:_wAttr(bot,'color')||'0F4C81',size:(parseFloat(_wAttr(bot,'sz'))||4)/8}:null}
  }
  const tabla=function(tb){
    const grid=_wHijo(tb,'tblGrid'),widths=[]
    for(const g of grid.childNodes)if(g.nodeType===1)widths.push(TW(_wAttr(g,'w')))
    const tblPr=_wHijo(tb,'tblPr'),bs=tblPr&&_wHijo(tblPr,'tblBorders'),top=bs&&_wHijo(bs,'top')
    const rows=[]
    for(const tr of tb.childNodes){
      if(tr.nodeType!==1||tr.localName!=='tr')continue
      const trPr=_wHijo(tr,'trPr'),cells=[]
      for(const tc of tr.childNodes){
        if(tc.nodeType!==1||tc.localName!=='tc')continue
        const tcPr=_wHijo(tc,'tcPr'),shd=tcPr&&_wHijo(tcPr,'shd'),w=tcPr&&_wHijo(tcPr,'tcW')
        const paras=[];for(const p of tc.childNodes)if(p.nodeType===1&&p.localName==='p')paras.push(par(p))
        cells.push({w:TW(w&&_wAttr(w,'w')),fill:shd?_wAttr(shd,'fill'):'FFFFFF',paras:paras,keep:paras.some(x=>x.keep)})
      }
      rows.push({header:!!(trPr&&_wHijo(trPr,'tblHeader')),cells:cells,keep:cells.some(c=>c.keep)})
    }
    return{type:'tbl',widths:widths,borde:{color:_wAttr(top,'color')||'CCCCCC',size:(parseFloat(_wAttr(top,'sz'))||2)/8},rows:rows}
  }
  const bloques=[],b=doc.getElementsByTagNameNS(W_NS,'body')[0]
  for(const el of b.childNodes){if(el.nodeType!==1)continue;if(el.localName==='p')bloques.push(par(el));else if(el.localName==='tbl')bloques.push(tabla(el))}
  return bloques
}
// Fuente incrustada en el PDF (serif, similar a Palatino): así el texto se ve igual en cualquier visor.
// Sin conexión se usa Times (fuente estándar del PDF).
const LIB_FONTKIT='https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js'
const FUENTE_PDF={reg:'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/crimsontext/CrimsonText-Regular.ttf',bold:'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/crimsontext/CrimsonText-Bold.ttf'}
let _fuenteBytes=null
async function _fuentesPdf(doc){
  try{
    await cargarLib(LIB_FONTKIT,'fontkit')
    doc.registerFontkit(window.fontkit)
    if(!_fuenteBytes)_fuenteBytes=await Promise.all([FUENTE_PDF.reg,FUENTE_PDF.bold].map(u=>fetch(u).then(x=>{if(!x.ok)throw new Error('HTTP '+x.status);return x.arrayBuffer()})))
    return{reg:await doc.embedFont(_fuenteBytes[0],{subset:true}),bold:await doc.embedFont(_fuenteBytes[1],{subset:true})}
  }catch(e){
    console.warn('Fuente incrustada no disponible, se usa Times:',e)
    return{reg:await doc.embedFont(PDFLib.StandardFonts.TimesRoman),bold:await doc.embedFont(PDFLib.StandardFonts.TimesRomanBold)}
  }
}
// Texto que la fuente puede dibujar (se reemplazan o quitan símbolos sin glifo)
const _REEMPLAZOS={'■':'•','✓':'v','✔':'v','→':'->','←':'<-','≤':'<=','≥':'>=',' ':' ',' ':' ','‑':'-'}
function _txtPdf(font,s){
  const fk=font.embedder&&font.embedder.font&&font.embedder.font.hasGlyphForCodePoint?font.embedder.font:null
  let o=''
  for(const ch of String(s)){
    const c=_REEMPLAZOS[ch]!==undefined?_REEMPLAZOS[ch]:ch
    if(fk){if(c===' '||Array.from(c).every(x=>fk.hasGlyphForCodePoint(x.codePointAt(0))))o+=c;continue}
    try{font.encodeText(c);o+=c}catch(e){}
  }
  return o
}
// Arma las líneas de un párrafo dentro de un ancho dado
function _lineasParrafo(p,ancho,F){
  const toks=[]
  p.runs.forEach(function(r){
    const font=r.bold?F.bold:F.reg,txt=_txtPdf(font,r.text)
    txt.split(/( +)/).forEach(function(w){if(w!=='')toks.push({t:w,esp:/^ +$/.test(w),font:font,size:r.size,color:r.color,ancho:font.widthOfTextAtSize(w,r.size)})})
  })
  const lineas=[];let ln=[],w=0
  const primera=()=>lineas.length===0
  const limite=()=>ancho-(primera()?Math.max(p.indLeft-p.hanging,0):p.indLeft)
  toks.forEach(function(t){
    if(t.esp&&!ln.length)return
    if(!t.esp&&w+t.ancho>limite()&&ln.length){
      while(ln.length&&ln[ln.length-1].esp){w-=ln.pop().ancho}
      lineas.push({toks:ln,ancho:w});ln=[];w=0
    }
    // palabra más larga que la línea: se corta por caracteres
    if(!t.esp&&t.ancho>limite()){
      let trozo=''
      for(const ch of t.t){const x=t.font.widthOfTextAtSize(trozo+ch,t.size);if(x>limite()&&trozo){ln.push(Object.assign({},t,{t:trozo,ancho:t.font.widthOfTextAtSize(trozo,t.size)}));lineas.push({toks:ln,ancho:t.font.widthOfTextAtSize(trozo,t.size)});ln=[];trozo=ch}else trozo+=ch}
      t=Object.assign({},t,{t:trozo,ancho:t.font.widthOfTextAtSize(trozo,t.size)})
    }
    ln.push(t);w+=t.ancho
  })
  while(ln.length&&ln[ln.length-1].esp){w-=ln.pop().ancho}
  if(ln.length||!lineas.length)lineas.push({toks:ln,ancho:w})
  const def=(p.runs[0]&&p.runs[0].size)||11
  lineas.forEach(l=>{l.alto=Math.max(def,...l.toks.map(t=>t.size))*1.2})
  return lineas
}
const _altoParrafo=(p,ancho,F)=>p.before+p.after+_lineasParrafo(p,ancho,F).reduce((s,l)=>s+l.alto,0)
function _dibujarLinea(page,l,x,y,ancho,p,ultima,indent){
  const libre=ancho-indent-l.ancho
  let xx=x+indent,extra=0
  if(p.align==='center')xx+=libre/2
  else if(p.align==='right')xx+=libre
  else if(p.align==='both'&&!ultima){const gaps=l.toks.filter(t=>t.esp).length;if(gaps)extra=libre/gaps}
  l.toks.forEach(function(t){
    if(t.esp){xx+=t.ancho+extra;return}
    page.drawText(t.t,{x:xx,y:y,size:t.size,font:t.font,color:hexRgb(t.color)});xx+=t.ancho
  })
}

async function generarPdf(body,opts){
  opts=opts||{}
  await cargarLib(LIB_PDFLIB,'PDFLib')
  const L=PDFLib,doc=await L.PDFDocument.create()
  const F=await _fuentesPdf(doc)
  const b64u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0))
  const logo=await doc.embedPng(b64u8(LOGO_B64)),ondas=await doc.embedJpg(b64u8(ONDAS_B64))
  const qr=opts.qrB64?await doc.embedPng(b64u8(opts.qrB64)):null
  const PW=595.28,PH=841.89,ML=56.7,MR=56.7,MT=100,MB=112,AN=PW-ML-MR
  const pr=prestador()
  const pie=[pr.direccion?'Dirección: '+pr.direccion:'',pr.telefono?'Celular: '+pr.telefono:'',pr.web?'Sitio web: '+pr.web:''].filter(Boolean)
  let page,y
  const nuevaPagina=function(){
    page=doc.addPage([PW,PH])
    const hO=PW*406/478
    page.drawImage(ondas,{x:0,y:0,width:PW,height:hO})
    page.drawImage(logo,{x:39.4,y:PH-23.6-70.4,width:198.4,height:70.4})
    if(qr)page.drawImage(qr,{x:PW-39.4-64.6,y:PH-20.5-64.6,width:64.6,height:64.6})
    let yy=28
    pie.slice().reverse().forEach(function(t){const s=_txtPdf(F.bold,t),w=F.bold.widthOfTextAtSize(s,10);page.drawText(s,{x:(PW-w)/2,y:yy,size:10,font:F.bold,color:hexRgb('215E99')});yy+=13})
    if(opts.codigo){const s=_txtPdf(F.reg,'Código de verificación: '+opts.codigo+' · Verifique su autenticidad escaneando el código QR'),w=F.reg.widthOfTextAtSize(s,7.5);page.drawText(s,{x:(PW-w)/2,y:yy+1,size:7.5,font:F.reg,color:hexRgb('0B2545')})}
    y=PH-MT
  }
  const libre=()=>y-MB
  const firmas=[] // posiciones de las líneas de firma (para el sello de la firma electrónica)
  nuevaPagina()
  const bloques=_modeloBody(body)
  const altoTabla=t=>t.rows.reduce((s,r)=>s+_altoFila(r),0)
  const _altoFila=function(r){
    return Math.max(...r.cells.map(c=>8+c.paras.reduce((s,p)=>s+_altoParrafo(Object.assign({},p,{before:0,after:0}),c.w-10,F),0)))
  }
  const altoMinimo=function(bq){ // lo que debe caber junto con un párrafo "mantener con el siguiente"
    if(!bq)return 0
    if(bq.type==='tbl'){
      const esFirmas=bq.rows.some(r=>r.cells.some(c=>c.paras.length===1&&/^_{8,}$/.test((c.paras[0].runs[0]||{}).text||'')))
      const keepAll=esFirmas||bq.rows.slice(0,-1).every(r=>r.keep)
      return keepAll?altoTabla(bq):(_altoFila(bq.rows[0])+(bq.rows[1]?_altoFila(bq.rows[1]):0))
    }
    const ls=_lineasParrafo(bq,AN,F);return bq.before+ls.slice(0,2).reduce((s,l)=>s+l.alto,0)
  }
  for(let i=0;i<bloques.length;i++){
    const bq=bloques[i]
    if(bq.type==='p'){
      const ls=_lineasParrafo(bq,AN,F),alto=bq.before+ls.reduce((s,l)=>s+l.alto,0)
      if(bq.keep&&y<PH-MT){
        const necesita=bq.before+ls.reduce((s,l)=>s+l.alto,0)+altoMinimo(bloques[i+1])
        if(necesita>libre()&&necesita<PH-MT-MB)nuevaPagina()
      }
      if(y<PH-MT)y-=bq.before
      ls.forEach(function(l,k){
        if(l.alto>libre())nuevaPagina()
        y-=l.alto
        const ind=k===0?Math.max(bq.indLeft-bq.hanging,0):bq.indLeft
        _dibujarLinea(page,l,ML,y+l.alto*0.22,AN,bq,k===ls.length-1,ind)
      })
      if(bq.border){page.drawLine({start:{x:ML,y:y-2},end:{x:ML+AN,y:y-2},thickness:Math.max(bq.border.size,0.5),color:hexRgb(bq.border.color)})}
      y-=bq.after
    }else{
      // Tablas que van completas en una página: las marcadas "mantener" y la de firmas
      const esFirmas=bq.rows.some(r=>r.cells.some(c=>c.paras.length===1&&/^_{8,}$/.test((c.paras[0].runs[0]||{}).text||'')))
      const keepAll=esFirmas||bq.rows.slice(0,-1).every(r=>r.keep)
      const total=altoTabla(bq)
      if(keepAll&&total>libre()&&total<PH-MT-MB)nuevaPagina()
      const cabeceras=bq.rows.filter(r=>r.header)
      const dibujarFila=function(r){
        const h=_altoFila(r)
        let x=ML
        r.cells.forEach(function(c){
          const fill=String(c.fill||'FFFFFF').toUpperCase()
          if(fill!=='FFFFFF'&&fill!=='AUTO')page.drawRectangle({x:x,y:y-h,width:c.w,height:h,color:hexRgb(fill)})
          page.drawRectangle({x:x,y:y-h,width:c.w,height:h,borderColor:hexRgb(bq.borde.color),borderWidth:Math.max(bq.borde.size,0.25)})
          let yy=y-4
          c.paras.forEach(function(p){
            const pp=Object.assign({},p,{before:0,after:0})
            _lineasParrafo(pp,c.w-10,F).forEach(function(l,k,arr){yy-=l.alto;_dibujarLinea(page,l,x+5,yy+l.alto*0.22,c.w-10,pp,k===arr.length-1,0)})
          })
          if(c.paras.length===1&&/^_{8,}$/.test((c.paras[0].runs[0]||{}).text||''))firmas.push({page:page,x:x,y:y-h,w:c.w,h:h})
          x+=c.w
        })
        y-=h
      }
      bq.rows.forEach(function(r,k){
        if(_altoFila(r)>libre()){nuevaPagina();if(!r.header)cabeceras.forEach(dibujarFila)}
        dibujarFila(r)
      })
    }
  }
  doc.setTitle((opts.titulo||'Documento')+(opts.codigo?' · '+opts.codigo:''))
  if(opts.codigo){doc.setSubject('Código de verificación '+opts.codigo);doc.setKeywords([opts.codigo])}
  doc.setCreator('Research Assessor');doc.setProducer('Research Assessor')
  return{doc:doc,fuentes:F,firmas:firmas}
}
